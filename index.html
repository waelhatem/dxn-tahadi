function validateDXNAge18(birthDate){
  if(!birthDate) return {ok:false, message:'يرجى إدخال تاريخ التولد.'};
  const d = new Date(birthDate + 'T00:00:00');
  if(Number.isNaN(d.getTime())) return {ok:false, message:'تاريخ التولد غير صحيح.'};
  const now = new Date();
  let age = now.getFullYear() - d.getFullYear();
  const m = now.getMonth() - d.getMonth();
  if(m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
  return age >= 18
    ? {ok:true, age}
    : {ok:false, age, message:'⚠️ عذرًا، يشترط أن يكون عمر المتقدم 18 سنة أو أكثر للتسجيل.'};
}

async function boot(){if(!ready()){renderSetup();return}sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);if(!token){renderLogin();return}try{const d=await rpc('bootstrap',{p_token:token});data=d;role=d.role;me=(d.members||[])[0]||null;try{trainingData=await rpc('get_training_data',{p_token:token})}catch(e){trainingData={lessons:[],my_progress:[],member_progress:[]}}if(role==='leader'){try{membershipRequests=await rpc('leader_dxn_membership_requests',{p_token:token})}catch(e){membershipRequests=[]}}render()}catch(e){localStorage.removeItem('dxn_session');token='';renderLogin();toast(e.message||'انتهت الجلسة')}}

async function submitDXNMembershipRequest(){
  const full_name=$('dxnFullName').value.trim(), residence_country=$('dxnResidenceCountry').value.trim(), birth_country=$('dxnBirthCountry').value.trim(), birth_date=$('dxnBirthDate').value, mobile=$('dxnMobile').value.trim(), email=$('dxnEmail').value.trim(), address=$('dxnAddress').value.trim(), id_number=$('dxnIdNumber').value.trim(), sponsor_name=$('dxnSponsorName').value.trim();
  if(!full_name||!residence_country||!birth_country||!birth_date||!mobile||!email||!address||!id_number||!sponsor_name)return toast('يرجى إكمال جميع البيانات المطلوبة.');
  if(!$('dxnNoActiveMembership').checked)return toast('يجب الإقرار بعدم امتلاك عضوية DXN فعّالة.');
  if(!/^\S+@\S+\.\S+$/.test(email))return toast('أدخل بريدًا إلكترونيًا صحيحًا.');
  if(!$('dxnAgeConfirm').checked)return toast('يجب تأكيد أن العمر 18 سنة أو أكثر.');
  const d=new Date(birth_date+'T00:00:00'); const now=new Date(); let age=now.getFullYear()-d.getFullYear(); const md=now.getMonth()-d.getMonth(); if(md<0||(md===0&&now.getDate()<d.getDate()))age--;
  if(isNaN(d)||age<18)return toast('يشترط أن يكون العمر 18 سنة أو أكثر.');
  try{
await rpc('submit_dxn_membership_request',{p_full_name:full_name,p_residence_country:residence_country,p_birth_country:birth_country,p_birth_date:birth_date,p_mobile:mobile,p_email:email,p_address:address,p_id_or_passport:id_number,p_sponsor_name:sponsor_name,p_age_18_confirmed:$('dxnAgeConfirm').checked,p_no_active_membership_confirmed:$('dxnNoActiveMembership').checked});$('app').innerHTML=`<div class="login card"><div style="text-align:center"><img class="logo" src="logo.png"><h1>تم إرسال الطلب ✅</h1><p style="line-height:2">وصلت بيانات طلب العضوية بنجاح. سيتواصل معك الفريق لإكمال إجراءات عضوية DXN.</p><p class="muted">العضوية مجانية، ولا توجد شروط للبدء سوى أن يكون العمر 18 سنة أو أكثر، وألا تكون لديك عضوية DXN فعّالة.</p><button class="primary" style="width:100%" onclick="renderLogin()">🔐 العودة</button></div></div>`}catch(e){toast(e.message||'تعذر إرسال الطلب')}
}

async function selfRegister(){
  const name=$('regName').value.trim(), no=$('regNo').value.trim(), team=$('regTeam').value||null, pin=$('regPin').value, pin2=$('regPin2').value;
  if(!name)return toast('أدخل الاسم الكامل.');
  if(!/^\d{9}$/.test(no))return toast('رقم العضوية يجب أن يكون 9 أرقام بالضبط.');
  if(pin.length<4)return toast('PIN يجب أن يكون 4 أحرف أو أرقام على الأقل.');
  if(pin!==pin2)return toast('تأكيد PIN غير مطابق.');
  try{await rpc('self_register',{p_member_no:no,p_name:name,p_pin:pin,p_team:team});$('app').innerHTML=`<div class="login card"><div style="text-align:center"><img class="logo" src="logo.png"><h1>تم إرسال الطلب ✅</h1><p>تم تسجيل بياناتك بنجاح، لكن الحساب بانتظار موافقة القائد.</p><p class="muted">بعد اعتماد القائد يمكنك الدخول باستخدام رقم العضوية وPIN الذي اخترته.</p><button class="primary" style="width:100%" onclick="renderLogin()">🔐 العودة لتسجيل الدخول</button></div></div>`}catch(e){toast(e.message||'تعذر إرسال طلب العضوية')}
}
function renderViewSwitch(){
  const el=document.getElementById('viewSwitch');
  const saved=localStorage.getItem('dxn_view_mode');
  const mode=saved || (window.innerWidth>=800 ? 'desktop' : 'mobile');
  document.body.classList.toggle('desktop-mode',mode==='desktop');
  document.body.classList.toggle('mobile-mode',mode==='mobile');
  if(!el)return;
  el.innerHTML=`<button class="${mode==='mobile'?'active':''}" onclick="setViewMode('mobile')">📱 واجهة الموبايل</button><button class="${mode==='desktop'?'active':''}" onclick="setViewMode('desktop')">🖥️ واجهة الحاسوب</button>`;
}
function setViewMode(mode){
  localStorage.setItem('dxn_view_mode',mode);
  document.body.classList.remove('mobile-mode','desktop-mode');
  document.body.classList.add(mode==='desktop'?'desktop-mode':'mobile-mode');
  renderViewSwitch();
}
async function login(){try{const r=await rpc('login',{p_login_no:$('loginNo').value.trim(),p_pin:$('pin').value.trim()});token=r.token;localStorage.setItem('dxn_session',token);await boot()}catch(e){toast(e.message||'تعذر الدخول')}}
async function logout(){try{await rpc('logout',{p_token:token})}catch{}localStorage.removeItem('dxn_session');token='';me=null;data=null;tab='home';renderLogin()}
function switchTab(next){if(next==='training'&&!canAccessTraining())return;tab=next;try{render();window.scrollTo({top:0,behavior:'smooth'})}catch(e){console.error(e);toast('تعذر فتح القسم: '+(e.message||e))}}
function openMemberProgress(){if(role!=='member'||!me){toast('هذه الصفحة متاحة للأعضاء فقط.');return;}tab='progress';try{render();setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}),30)}catch(e){console.error(e);toast('تعذر فتح صفحة تقدّمي: '+(e.message||e))}}
function canAccessTraining(){return (role==='member'&&!!me&&/^\d{9}$/.test(String(me.member_no||'')))||role==='leader';}
function nav(){return `<div class="nav"><button onclick="switchTab('home')">🏠<br><span class="small">الرئيسية</span></button><button onclick="switchTab('notifications')">🔔<br><span class="small">الإشعارات ${notificationSummary().unread.length?`(${notificationSummary().unread.length})`:''}</span></button><button onclick="switchTab('ch')">🎯<br><span class="small">التحديات</span></button><button onclick="switchTab('teams')">👥<br><span class="small">الأعضاء والفرق</span></button>${role==='member'&&me?`<button onclick="switchTab('progress')">📊<br><span class="small">تقدّمي</span></button>`:''}${canAccessTraining()?`<button onclick="switchTab('training')">📚<br><span class="small">التدريبات</span></button>`:''}${role==='leader'?`<button onclick="switchTab('leader')">👑<br><span class="small">القائد</span></button>`:''}</div>`}

function notificationStorageKey(){return `dxn_notifications_seen_${role==='member'?(me?.id||'member'):'leader'}`}
function getSeenNotifications(){try{return JSON.parse(localStorage.getItem(notificationStorageKey())||'[]')}catch{return[]}}
function markNotificationsRead(ids){const old=getSeenNotifications();const set=new Set(old);(ids||[]).forEach(id=>set.add(String(id)));localStorage.setItem(notificationStorageKey(),JSON.stringify([...set].slice(-300)));}
function notificationItems(){
 const items=[];
 const push=(id,icon,title,desc,action,actionLabel='فتح')=>items.push({id:String(id),icon,title,desc,action,actionLabel});
 if(role==='member'&&me){
   const subs=data?.my_submissions||[];
   subs.filter(x=>x.status==='pending').forEach(x=>{const c=(data?.challenges||[]).find(c=>String(c.id)===String(x.challenge_id));push(`sub:${x.id}:pending`,'⏳','إنجازك بانتظار اعتماد القائد',`«${c?.title||x.challenge_title||'إنجاز تحدي'}» أرسلته للمراجعة. لا توجد مهمة جديدة من نفس النوع حتى يصدر القرار.`,()=>switchTab('ch'),'عرض التحديات');});
   subs.filter(x=>x.status==='approved').forEach(x=>{const c=(data?.challenges||[]).find(c=>String(c.id)===String(x.challenge_id));push(`sub:${x.id}:approved`,'✅','تم اعتماد إنجازك',`تم اعتماد «${c?.title||x.challenge_title||'الإنجاز'}» وحصلت على ⭐${Number(x.reward_stars??x.stars??0)}.`,()=>switchTab('progress'),'عرض تقدّمي');});
   subs.filter(x=>x.status==='rejected').forEach(x=>{const c=(data?.challenges||[]).find(c=>String(c.id)===String(x.challenge_id));push(`sub:${x.id}:rejected`,'❌','تم رفض إنجازك',`تم رفض «${c?.title||x.challenge_title||'الإنجاز'}». راجع الإثبات وأعد المحاولة.`,()=>switchTab('ch'),'إعادة المحاولة');});
   (data?.my_answers||[]).filter(x=>x.status==='approved').forEach(x=>push(`ans:${x.id}:approved`,'✅','تم اعتماد إجابتك',`تم اعتماد إجابتك عن السؤال الشهري وحصلت على ⭐1.`,()=>switchTab('ch'),'عرض الأسئلة'));
   (data?.my_answers||[]).filter(x=>x.status==='rejected').forEach(x=>push(`ans:${x.id}:rejected`,'❌','تحتاج إجابتك إلى مراجعة',`لم تتم الموافقة على إجابتك عن السؤال الشهري. يمكنك مراجعة الإجابة والمحاولة مجددًا عند إتاحة ذلك.`,()=>switchTab('ch'),'عرض الأسئلة'));
   const lvl=getLevel(Number(me.stars||0)); if(lvl.current){push(`level:${lvl.current.name}`,'🏆',`وصلت إلى رتبة ${lvl.current.name}`,`رصيدك الحالي ⭐${Number(me.stars||0)}. استمر في النشاط للوصول إلى الرتبة التالية.`,()=>switchTab('progress'),'عرض تقدّمي');}
   getBadges().filter(b=>b.earned).forEach(b=>push(`badge:${b.id}`,'🏅',`حصلت على شارة «${b.name}»`,b.desc,()=>switchTab('progress'),'عرض شاراتي'));
   const t=currentMonthlyTarget(),pts=Number(t.dxn_points||0),target=Math.max(1,Number(t.target||100));
   if(pts>=target)push(`target:${currentMonthKey()}:100`,'🎯','أحسنت! حققت التارجت الشهري',`حققت ${pts} نقطة DXN هذا الشهر، وتجاوزت الهدف بمقدار ${Math.max(0,pts-target)} نقطة.`,()=>switchTab('progress'),'عرض التقدم');
   else if(pts>=80)push(`target:${currentMonthKey()}:80`,'🔥','اقتربت من التارجت الشهري',`لديك ${pts} نقطة DXN. بقي ${target-pts} نقطة للوصول إلى 100.`,()=>switchTab('progress'),'تحديث نقاطي');
   const done=trainingCompletedCount(); if(done>0&&done<8)push(`training:${done}`,'📚','تم فتح التدريب التالي',`أكملت ${done} تدريبات. التدريب رقم ${done+1} متاح لك الآن.`,()=>switchTab('training'),'ابدأ التدريب');
 }
 if(role==='leader'){
   const subs=data?.my_submissions||[], answers=data?.my_answers||[], regs=data?.pending_registrations||[];
   const pc=subs.filter(x=>x.status==='pending'&&x.challenge_id).length, pa=answers.filter(x=>x.status==='pending'&&x.question_id).length, pr=regs.length;
   if(pc)push(`leader:ch:${pc}`,'⏳',`لديك ${pc} إنجازات بانتظار الاعتماد`,'توجد إنجازات من الأعضاء تحتاج إلى قرارك.',()=>switchTab('leader'),'مراجعة الإنجازات');
   if(pa)push(`leader:q:${pa}`,'❓',`لديك ${pa} إجابات بانتظار المراجعة`,'راجع إجابات الأعضاء واعتمد المناسب منها.',()=>switchTab('leader'),'مراجعة الإجابات');
   if(pr)push(`leader:reg:${pr}`,'🟠',`لديك ${pr} طلبات عضوية جديدة`,'توجد حسابات أعضاء بانتظار موافقتك.',()=>switchTab('leader'),'مراجعة الطلبات');
   const monthly=data?.monthly||[], target100=monthly.filter(x=>Number(x.dxn_points||x.points||0)>=100).length;
   if(target100)push(`leader:target:${currentMonthKey()}:${target100}`,'🎯',`${target100} أعضاء حققوا 100 نقطة DXN`,`يمكنك متابعة التارجت الشهري ومراجعة المكافآت المستحقة.`,()=>switchTab('leader'),'متابعة التارجت');
 }
 return items;
}
function notificationSummary(){const all=notificationItems(),seen=new Set(getSeenNotifications());return {all,unread:all.filter(x=>!seen.has(String(x.id)))};}
function notificationsCard(){const {unread}=notificationSummary();return `<div class="card"><div class="title">🔔 الإشعارات ${unread.length?`<span class="notif-count">${unread.length}</span>`:''}</div><p class="muted">تظهر هنا الإشعارات غير المقروءة فقط. عند فتح الإشعار أو تحديده كمقروء يختفي من هذه القائمة.</p>${unread.length?`<div class="notif-actions"><button onclick="markAllNotificationsRead()">✓ تحديد الكل كمقروء</button></div>`:''}<div class="notif-list">${unread.map(n=>`<div class="notif-item unread"><div class="notif-icon">${n.icon}</div><div style="flex:1"><h3>${esc(n.title)}</h3><div class="muted">${esc(n.desc)}</div>${n.action?`<div class="notif-actions"><button class="primary" onclick="notificationOpen('${esc(n.id)}')">${esc(n.actionLabel||'فتح')}</button></div>`:''}</div></div>`).join('')||'<div class="notif-empty">🎉 لا توجد إشعارات جديدة حاليًا.</div>'}</div></div>`}
function notificationOpen(id){const n=notificationItems().find(x=>String(x.id)===String(id));if(!n)return;markNotificationsRead([n.id]);if(typeof n.action==='function')n.action();else render();}
function markAllNotificationsRead(){markNotificationsRead(notificationItems().map(n=>n.id));toast('تم تحديد الإشعارات كمقروءة.');render();}
function notifications(){return notificationsCard();}

function render(){if(role==='leader'&&!me)me=null;let identity=role==='member'&&me?`<div class="member-identity"><span class="role-label">👤 العضو</span><b>${esc(me.name||'')} ${topBadge()?`<span class="badge-strip"><span class="name-badge" title="${esc(topBadge().name)}">${topBadge().icon}</span></span>`:''}</b><span>🪪 ${esc(me.member_no||'')}</span><button class="logout-top" onclick="logout()">🚪 تسجيل الخروج</button></div>`:`<div class="member-identity"><span class="role-label">👑 القائد</span><b>LEADER</b><button class="logout-top" onclick="logout()">🚪 تسجيل الخروج</button></div>`;let html=`<div class="view-switch" id="viewSwitch"></div><div class="top"><img src="logo.png" class="logo"><h1>مجتمع الصحة والثراء</h1><p>⭐ نجوم للنشاط والإنجاز — منافسة فردية وبين الفرق</p>${identity}</div>`;html+=`<div class="tabs"><button class="tab ${tab==='home'?'active':''}" onclick="switchTab('home')">الرئيسية 📊</button><button class="tab notif-tab ${tab==='notifications'?'active':''}" onclick="switchTab('notifications')">🔔 الإشعارات ${notificationSummary().unread.length?`<span class="notif-count">${notificationSummary().unread.length}</span>`:''}</button><button class="tab ${tab==='ch'?'active':''}" onclick="switchTab('ch')">التحديات 🎯</button><button class="tab ${tab==='teams'?'active':''}" onclick="switchTab('teams')">الأعضاء والفرق 👥</button>${role==='member'&&me?`<button class="tab ${tab==='progress'?'active':''}" onclick="switchTab('progress')">📊 تقدّمي</button>`:''}${canAccessTraining()?`<button class="tab ${tab==='training'?'active':''}" onclick="switchTab('training')">📚 الشروحات والتدريبات</button>`:''}${role==='leader'?`<button class="tab ${tab==='leader'?'active':''}" onclick="switchTab('leader')">إدارة القائد 👑</button>`:''}</div>`;html+=tab==='home'?home():tab==='notifications'?notifications():tab==='ch'?challenges():tab==='teams'?teams():tab==='progress'&&role==='member'&&me?progressPage():tab==='training'&&canAccessTraining()?trainings():leader();html+=nav();$('app').innerHTML=html;renderViewSwitch();maybeShowLevelUp()}
const DXN_LEVELS=[
 {stars:0,icon:'🌱',name:'البداية'},
 {stars:100,icon:'🔥',name:'عضو نشيط'},
 {stars:250,icon:'🚀',name:'عضو متقدم'},
 {stars:500,icon:'🏅',name:'صانع إنجاز'},
 {stars:1000,icon:'👑',name:'قائد صاعد'},
 {stars:2000,icon:'💎',name:'قائد متميز'},
 {stars:5000,icon:'🏆',name:'قائد مؤثر'}
];
function getLevel(stars){const n=Math.max(0,Number(stars)||0);let idx=0;for(let i=0;i<DXN_LEVELS.length;i++){if(n>=DXN_LEVELS[i].stars)idx=i;else break}const current=DXN_LEVELS[idx],next=DXN_LEVELS[idx+1]||null;const progress=next?Math.min(100,Math.max(0,Math.round((n-current.stars)/(next.stars-current.stars)*100))):100;return {index:idx,current,next,stars:n,progress};}
function levelCard(stars,compact=false){const l=getLevel(stars), nextText=l.next?`باقي ${Math.max(0,l.next.stars-l.stars)} ⭐ للوصول إلى ${l.next.icon} ${l.next.name}`:'🎉 وصلت إلى أعلى رتبة في النظام';return `<div class="card level-card"><div class="level-head"><div><div class="level-number">المستوى ${l.index}</div><div class="level-name">${l.current.icon} ${l.current.name}</div></div><div class="level-badge">${l.current.icon}</div></div><div class="level-progress"><span style="width:${l.progress}%"></span></div><div class="level-meta"><b>⭐ ${l.stars} نجمة</b><span>${l.next?`الهدف: ⭐ ${l.next.stars}`:'الحد الأعلى'}</span></div>${compact?'':`<div class="level-next">${nextText}</div>`}</div>`}
function maybeShowLevelUp(){if(role!=='member'||!me)return;const l=getLevel(me.stars);const key='dxn_level_seen_'+String(me.id||me.member_no||'member');const old=Number(localStorage.getItem(key)||0);if(l.index>old){localStorage.setItem(key,String(l.index));if(old>0||l.index>0){const el=document.createElement('div');el.className='level-up';el.innerHTML=`🎉 مبروك!<br>${l.current.icon} وصلت إلى المستوى ${l.index} — ${esc(l.current.name)}`;document.body.appendChild(el);setTimeout(()=>el.remove(),5000)}}else if(l.index<old){localStorage.setItem(key,String(l.index));}}

function activityDatesForStreak(){
 const dates=new Set();
 const subs=(data?.my_submissions||[]);
 subs.forEach(x=>{if(x.status==='approved'||x.approved===true){const d=String(x.approved_at||x.created_at||x.submitted_at||'').slice(0,10);if(d)dates.add(d)}});
 (trainingData?.my_progress||[]).forEach(x=>{if(x.completed===true||Number(x.watch_percent||0)>=100){const d=String(x.completed_at||x.updated_at||x.created_at||'').slice(0,10);if(d)dates.add(d)}});
 return dates;
}
function calcStreak(){
 const set=activityDatesForStreak(), today=new Date(); today.setHours(0,0,0,0);
 const key=d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};
 let cur=new Date(today); if(!set.has(key(cur))){cur.setDate(cur.getDate()-1);}
 let count=0; while(set.has(key(cur))){count++;cur.setDate(cur.getDate()-1);}
 let best=0, run=0, prev=null; [...set].sort().forEach(ds=>{const d=new Date(ds+'T00:00:00');if(prev){const diff=(d-prev)/86400000;if(diff!==1)run=0}run++;best=Math.max(best,run);prev=d});
 return {current:count,best,activeToday:set.has(key(today)),dates:set};
}
function streakCard(){

function trainings(){
  const lessons=(trainingData.lessons||[]).sort((a,b)=>Number(a.lesson_no)-Number(b.lesson_no));
  const progress=trainingData.my_progress||[];
  if(!canAccessTraining())return `<div class="card"><div class="title">🔒 التدريب للأعضاء والقائد</div><p class="muted">هذا القسم متاح للعضو صاحب رقم عضوية DXN وللقائد.</p></div>`;
  if(!lessons.length)return `<div class="card"><div class="title">📚 الشروحات والتدريبات</div><p class="muted">لم تتم إضافة تدريبات بعد. يمكن للقائد إضافة روابط YouTube من مركز القيادة.</p>${role==='leader'?`<button class="primary" onclick="openTrainingManager()">➕ إضافة أول تدريب</button>`:''}</div>`;

  const completedNo=new Set(progress.filter(p=>p.completed).map(p=>{
    const l=lessons.find(x=>String(x.id)===String(p.lesson_id)); return l?Number(l.lesson_no):0;
  }));
  const pct=Math.round((completedNo.size/lessons.length)*100);

  const cards=lessons.map(l=>{
    const n=Number(l.lesson_no), p=progress.find(x=>String(x.lesson_id)===String(l.id));
    const done=!!p?.completed;
    const previousDone = n===1 || completedNo.has(n-1);
    const locked = !done && !previousDone;
    return `<div class="card" style="${locked?'opacity:.58;background:#f6f8f7':''}">
      <div class="row">
        <div style="flex:1">
          <div style="font-size:28px">📚</div>
          <h3 style="margin:5px 0">التدريب ${n} — ${esc(l.title)}</h3>
          <p>${esc(l.description||'')}</p>
          <div class="muted">🎁 مكافأة الإكمال: <b>⭐${Number(l.reward_stars||0)}</b></div>
          <div class="muted">${done?'✅ مكتمل':locked?'🔒 مغلق — أكمل التدريب السابق أولاً':'▶️ متاح الآن'}</div>
          ${p?`<div class="muted">📊 نسبة المشاهدة: ${Number(p.watch_percent||0).toFixed(0)}%</div>`:''}
        </div>
        <button class="primary" ${locked?'disabled':''} onclick="startTrainingLesson('${l.id}')">${done?'🔁 إعادة المشاهدة':locked?'🔒 مغلق':'▶️ بدء التدريب'}</button>
      </div>
    </div>`;
  }).join('');

  return `<div class="card">
    <div class="title">📚 الشروحات والتدريبات</div>
    <p class="muted">شاهد التدريبات بالترتيب. لا يفتح التدريب التالي إلا بعد إكمال التدريب السابق، ويمكنك إعادة مشاهدة أي تدريب أكملته في أي وقت.</p>
    <div style="background:#eef3f1;border-radius:999px;height:14px;overflow:hidden;margin:15px 0"><div style="width:${pct}%;height:100%;background:#0f513f"></div></div>

    <div class="muted" style="text-align:center;margin-top:8px">⭐ أكمل التدريب كاملًا لتحصل على مكافأة النجوم مرة واحدة.</div>
  </div>${cards}`;
}
function youtubeEmbed(url){
  const s=String(url||'').trim();
  let id='';
  const m=s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{6,})/i);
  if(m)id=m[1];
  return id?`https://www.youtube.com/embed/${id}?cc_load_policy=1&cc_lang_pref=ar`:'';
}

    </div>
    ${role==='member'?`<div id="trainingCompleteBox" class="muted" style="margin-top:10px;text-align:center">🔒 سيظهر إكمال التدريب تلقائيًا عند وصول المشاهدة إلى 100%.</div>`:`<div class="muted" style="margin-top:12px;text-align:center">👑 وضع القائد: مشاهدة فقط</div>`}
  </div>`;
  document.body.appendChild(modal);

  if(role==='member'){
    rpc('update_training_progress',{p_token:token,p_lesson:id,p_watch_percent:0,p_current_seconds:0,p_duration_seconds:0,p_completed:false})
      .catch(e=>updateTrainingWatchStatus('⚠️ تعذر بدء تسجيل المشاهدة: '+(e.message||e),true));
  }
  waitForYouTubePlayer(l);
}
function waitForYouTubePlayer(l){
  let tries=0;
  const ready=setInterval(()=>{
    tries++;
    if(window.YT&&YT.Player){
      clearInterval(ready);
      const iframeId='trainingYoutubePlayer';
      const player=new YT.Player(iframeId,{
        videoId:trainingWatch.videoId,
        playerVars:{rel:0,cc_load_policy:1,cc_lang_pref:'ar',playsinline:1,disablekb:0},
        events:{
          onReady:()=>beginTrainingWatch(player,l.id),
          onStateChange:(e)=>{
            if(e.data===YT.PlayerState.ENDED) finishTrainingWatch(l.id,player);
          }
        }
      });
    }else if(tries>80)clearInterval(ready);
  },250);
}
function beginTrainingWatch(player,lessonId){
  trainingWatch.player=player;
  trainingWatch.timer=setInterval(()=>sampleTrainingWatch(lessonId),1000);
  updateTrainingWatchStatus('▶️ الفيديو جاهز — ابدأ المشاهدة من البداية.');
}
async function sampleTrainingWatch(lessonId){
  const p=trainingWatch.player;
  if(!p||!p.getDuration)return;
  const duration=Number(p.getDuration()||0), current=Number(p.getCurrentTime()||0);
  if(!duration)return;
  const state=p.getPlayerState();
  const pct=Math.min(100,current/duration*100);
  if(state===YT.PlayerState.PLAYING){
    // The server validates the accumulated watched time and detects large forward jumps.
    try{
      const result=await rpc('update_training_progress',{
        p_token:token,p_lesson:lessonId,p_watch_percent:pct,p_current_seconds:current,
        p_duration_seconds:duration,p_completed:false
      });
      if(result?.seek_detected){
        trainingWatch.invalid=true;
        updateTrainingWatchStatus('⚠️ تم اكتشاف محاولة تقديم يدوي. يجب إعادة التدريب من البداية.',true);
        clearInterval(trainingWatch.timer); trainingWatch.timer=null;
      }else{
        updateTrainingWatchStatus(`▶️ تمت مشاهدة ${pct.toFixed(0)}% — أكمل حتى النهاية.`);
      }
    }catch(e){}
  }
}
async function finishTrainingWatch(lessonId,player){
  if(trainingWatch.invalid)return;
  const duration=Number(player.getDuration()||0);
  if(!duration)return;
  try{
    // عند انتهاء فيديو YouTube نرسل النهاية الفعلية. الخادم يتحقق من
    // التقدم المتراكم وعدم وجود تقديم يدوي قبل اعتماد الإكمال.
    const result=await rpc('update_training_progress',{
      p_token:token,p_lesson:lessonId,p_watch_percent:100,p_current_seconds:Math.max(0,duration-0.25),
      p_duration_seconds:duration,p_completed:true
    });
    if(result?.completed){
      const rewardText=result?.stars_awarded ? ` 🎁 تمت إضافة ⭐${Number(result.reward_stars||0)} إلى رصيدك.` : '';
      updateTrainingWatchStatus(`🎉 اكتملت المشاهدة 100% — تم فتح التدريب التالي في التسلسل.${rewardText}`,false,true);
      if(trainingWatch.timer){clearInterval(trainingWatch.timer);trainingWatch.timer=null;}
      setTimeout(async()=>{closeTraining();await refresh()},1200);
    }else{
      trainingWatch.invalid=true;
      updateTrainingWatchStatus('⚠️ لم يتم اعتماد الإكمال لأن المشاهدة الكاملة لم تُثبت. أعد التدريب من البداية.',true);
    }
  }catch(e){toast(e.message||'تعذر اعتماد إكمال التدريب')}
}
function updateTrainingWatchStatus(msg,bad=false,done=false){
  const el=$('trainingWatchStatus'); if(!el)return;
  el.innerHTML=`<b>${msg}</b>${bad?`<div style="margin-top:10px"><button class="danger" onclick="restartTrainingWatch()">🔄 إعادة التدريب من البداية</button></div>`:done?'':`<div class="muted" style="margin-top:5px">لن يفتح التدريب التالي إلا بعد المشاهدة الكاملة.</div>`}`;
}
async function restartTrainingWatch(){
  const id=trainingWatch.lessonId;
  try{await rpc('reset_training_progress',{p_token:token,p_lesson:id});await refresh();closeTraining();setTimeout(()=>startTrainingLesson(id),150)}catch(e){toast(e.message||'تعذر إعادة التدريب')}
}
function closeTraining(){
  if(trainingWatch.timer){clearInterval(trainingWatch.timer);trainingWatch.timer=null;}
  if(trainingWatch.player&&trainingWatch.player.destroy){try{trainingWatch.player.destroy()}catch(e){}}
  trainingWatch={player:null,timer:null,lessonId:null,videoId:null,invalid:false};
  $('trainingModal')?.remove();
}

function leaderDailyPlan(){
  const members=data.members||[], subs=data.my_submissions||[], mp=(data.trainingData&&data.trainingData.member_progress)||[];
  const now=Date.now(), day=86400000;
  const activeSubs=subs.filter(s=>s.status==='approved');
  const rows=members.filter(m=>m.active!==false).map(m=>{
    const id=String(m.id||m.member_id||'');
    const ms=activeSubs.filter(s=>String(s.member_id||s.memberId||'')===id).map(s=>new Date(s.created_at||s.createdAt||s.approved_at||0).getTime()).filter(Boolean);
    const mt=mp.filter(x=>String(x.member_id||x.memberId||'')===id).map(x=>new Date(x.last_update_at||x.last_watched_at||x.updated_at||0).getTime()).filter(Boolean);
    const last=Math.max(0,...ms,...mt);
    const joinedAt=new Date(m.joined_at||m.joinedAt||m.membership_date||m.membershipDate||m.created_at||m.createdAt||0).getTime();
    const joinedDays=joinedAt?Math.max(0,Math.floor((now-joinedAt)/day)):null;
    const days=last?Math.max(0,Math.floor((now-last)/day)):null;
    let priority=0, reason='';
    const pending=subs.some(s=>String(s.member_id||s.memberId||'')===id&&s.status==='pending');
    const dxn=Number(m.dxn_points||m.monthly_dxn_points||0);
    if(pending){priority=100;reason='إنجاز بانتظار اعتماد القائد';}
    else if(dxn>=80&&dxn<100){priority=90;reason=`اقترب من التارجت: ${dxn}/100 نقطة DXN`}
    else if(dxn>=100){priority=70;reason='حقق التارجت الشهري — يحتاج تشجيعًا واستثمار الإنجاز';}
    else if(days!==null&&days>=7){priority=85;reason=`لا يوجد نشاط منذ ${days} أيام`;}
    else if(days!==null&&days>=3){priority=60;reason=`يحتاج دفعة نشاط — آخر نشاط منذ ${days} أيام`;}
    else if(!last){priority=50;reason=joinedDays!==null?`لم يبدأ النشاط بعد — العضوية منذ ${joinedDays} أيام`:'لم يبدأ النشاط بعد — تاريخ العضوية غير مسجل';}
    else {priority=20;reason='نشط — متابعة خفيفة وتشجيع';}
    return {...m,_priority:priority,_reason:reason,_days:days};
  }).sort((a,b)=>b._priority-a._priority).slice(0,8);
  const top=rows.slice(0,5);
  return `<div class="card smart-plan" style="border:2px solid rgba(11,107,87,.16);background:linear-gradient(180deg,#fff,#f7fbf9)">
    <div class="title">🗓️ خطة العمل اليومية للقائد</div>
    <p class="muted">قائمة عملية مرتبة حسب الأولوية، لتعرف من يستحق اهتمامك اليوم وما الإجراء الأنسب معه.</p>
    ${top.length?`<div style="display:grid;gap:10px">${top.map((m,i)=>`<div style="padding:14px;border:1px solid #e5e7eb;border-radius:14px;background:#fff;display:flex;gap:12px;align-items:center"><div style="font-size:22px;font-weight:900;min-width:30px">${i+1}</div><div style="flex:1"><b>${esc(m.name||'عضو')}</b><div class="muted" style="margin-top:4px">${esc(m._reason)}</div></div><span class="badge" style="white-space:nowrap">${m._priority>=85?'🔴 عاجلة':m._priority>=60?'🟠 مهمة':'🟢 متابعة'}</span></div>`).join('')}</div>`:'<div class="empty">لا توجد مهام متابعة حاليًا.</div>'}
    <div class="muted" style="margin-top:12px">💡 ابدأ بالأولوية الأولى، ثم انتقل بالتسلسل. الهدف هو بناء عادة متابعة يومية بسيطة ومنتظمة.</div>
  </div>`;
}

async function rejectRegistration(id){if(!confirm('رفض طلب العضوية وحذفه؟'))return;try{await rpc('reject_member_registration',{p_token:token,p_member:id});toast('تم رفض الطلب.');await refresh()}catch(e){toast(e.message||'تعذر رفض الطلب')}}
function createMemberForm(){
 const no=prompt('رقم العضوية:'); if(no===null)return;
 const name=prompt('اسم العضو:'); if(name===null)return;
 const pin=prompt('PIN المؤقت (4 أحرف/أرقام على الأقل):'); if(pin===null)return;
 const activeTeams=(data.teams||[]).filter(t=>t.active!==false); const teamList=activeTeams.map((t,i)=>`${i+1}. ${t.name}`).join('\n');
 const choice=prompt(`اختر رقم الفريق:
${teamList}\n\nاتركه فارغاً إذا كان العضو بلا فريق.`,''); if(choice===null)return;
 const idx=choice.trim()===''?-1:Number(choice)-1; const team=(idx>=0&&activeTeams[idx])?activeTeams[idx].id:null; if(choice.trim()!==''&&!team)return toast('رقم الفريق غير صحيح.');
 createMemberValues(no,name,pin,team);
}
async function createMemberValues(no,name,pin,team){try{await rpc('create_member',{p_token:token,p_member_no:no,p_name:name,p_pin:pin,p_team:team||null});toast('تم إنشاء العضو.');await refresh()}catch(e){toast(e.message||'تعذر إنشاء العضو')}}
function createTeamForm(){const n=prompt('اسم الفريق الجديد:');if(n===null)return;createTeamValues(n)}
async function createTeamValues(n){try{if(!n.trim())return;await rpc('create_team',{p_token:token,p_name:n});toast('تم إنشاء الفريق.');await refresh()}catch(e){toast(e.message||'تعذر إنشاء الفريق')}}
async function editTeam(id){const t=(data.teams||[]).find(x=>String(x.id)===String(id));if(!t)return;const n=prompt('اسم الفريق:',t.name||'');if(n===null)return;try{await rpc('update_team',{p_token:token,p_team:id,p_name:n});toast('تم تعديل الفريق.');await refresh()}catch(e){toast(e.message||'تعذر تعديل الفريق')}}
async function toggleTeam(id,active){const msg=active?'تفعيل الفريق؟':'تعطيل الفريق؟\nسيبقى السجل التاريخي محفوظاً.';if(!confirm(msg))return;try{await rpc('toggle_team_active',{p_token:token,p_team:id,p_active:active});toast(active?'تم تفعيل الفريق.':'تم تعطيل الفريق.');await refresh()}catch(e){toast(e.message||'تعذر تغيير حالة الفريق')}}
async function editMember(id){const m=(data.members||[]).find(x=>String(x.id)===String(id));if(!m)return;const no=prompt('رقم العضوية:',m.member_no||'');if(no===null)return;const name=prompt('اسم العضو:',m.name||'');if(name===null)return;const activeTeams=(data.teams||[]).filter(t=>t.active!==false);const teamList=activeTeams.map((t,i)=>`${i+1}. ${t.name}`).join('\n');const currentIdx=activeTeams.findIndex(t=>String(t.id)===String(m.team_id));const choice=prompt(`الفريق الحالي: ${m.team_name||'بدون فريق'}\n\nالفرق المتاحة:\n${teamList}\n\nأدخل رقم الفريق أو اتركه فارغاً:`,currentIdx>=0?String(currentIdx+1):'');if(choice===null)return;const idx=choice.trim()===''?-1:Number(choice)-1;const team=(idx>=0&&activeTeams[idx])?activeTeams[idx].id:null;if(choice.trim()!==''&&!team)return toast('رقم الفريق غير صحيح.');try{await rpc('update_member',{p_token:token,p_member:id,p_member_no:no,p_name:name,p_team:team});toast('تم تعديل بيانات العضو.');await refresh()}catch(e){toast(e.message||'تعذر تعديل العضو')}}
async function toggleMember(id,active){const msg=active?'تفعيل العضو؟':'تعطيل العضو؟\nسيبقى حسابه وإنجازاته محفوظة لكن لن يظهر كعضو نشط.';if(!confirm(msg))return;try{await rpc('toggle_member_active',{p_token:token,p_member:id,p_active:active});toast(active?'تم تفعيل العضو.':'تم تعطيل العضو.');await refresh()}catch(e){toast(e.message||'تعذر تغيير حالة العضو')}}
async function deleteMember(id){const m=(data.members||[]).find(x=>String(x.id)===String(id));if(!m)return;const msg=`حذف العضو «${m.name||''}» حذفًا نهائيًا؟\n\nسيتم حذف حسابه وعضويته وجميع بياناته التجريبية المرتبطة به، بما فيها الإنجازات والنجوم والسجل.\n\n⚠️ هذا الإجراء نهائي ولا يمكن التراجع عنه.`;if(!confirm(msg))return;try{await rpc('delete_member_permanently',{p_token:token,p_member:id});toast('تم حذف العضو نهائيًا.');await refresh()}catch(e){toast(e.message||'تعذر حذف العضو نهائيًا')}}
async function changeMemberPin(id){const p=prompt('PIN الجديد للعضو (4 أحرف/أرقام على الأقل):');if(p===null)return;try{await rpc('change_member_pin',{p_token:token,p_member:id,p_new_pin:p});toast('تم تغيير PIN العضو.')}catch(e){toast(e.message||'تعذر تغيير PIN العضو')}}
async function saveQuestions(){try{const items=[1,2,3,4,5].map(n=>({question_no:n,text:$('qtxt'+n).value.trim(),category:$('qcat'+n).value.trim()}));if(items.some(x=>!x.text))return toast('أكمل الأسئلة الخمسة.');await rpc('save_month_questions',{p_token:token,p_items:items});toast('تم تثبيت الأسئلة الخمسة للشهر.');await refresh()}catch(e){toast(e.message||'تعذر حفظ الأسئلة')}}
async function changePin(){const p=prompt('PIN الجديد:');if(!p)return;try{await rpc('change_pin',{p_token:token,p_new_pin:p});toast('تم تغيير PIN.')}catch(e){toast(e.message||'تعذر تغيير PIN')}}
async function decide(id,q,ok){try{await rpc(q?'approve_question':'approve_challenge',{p_token:token,[q?'p_answer':'p_submission']:id,p_ok:ok});toast(ok?'تم الاعتماد وإضافة النجوم.':'تم الرفض.');await refresh()}catch(e){toast(e.message||'تعذر التنفيذ')}}
async function setPoints(id){const v=prompt('أدخل نقاط DXN الفعلية لهذا العضو هذا الشهر:','100');if(v===null)return;try{await rpc('set_monthly_points',{p_token:token,p_member:id,p_points:Number(v)});if(Number(v)>=100&&confirm('العضو حقق 100 نقطة. هل تضيف مكافأة ⭐100؟'))await rpc('award_monthly_target',{p_token:token,p_member:id});toast('تم تحديث التارجت.');await refresh()}catch(e){toast(e.message||'تعذر تحديث التارجت')}}
async function refresh(){const d=await rpc('bootstrap',{p_token:token});data=d;role=d.role;me=(d.members||[]).find(x=>role==='member')||null;try{trainingData=await rpc('get_training_data',{p_token:token})}catch(e){trainingData={lessons:[],my_progress:[],member_progress:[]}}if(role==='leader'){try{membershipRequests=await rpc('leader_dxn_membership_requests',{p_token:token})}catch(e){membershipRequests=[]}}render()}
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{}); boot();
window.switchTab=switchTab;window.openMemberProgress=openMemberProgress;window.openTrainingManager=openTrainingManager;window.restartTrainingWatch=restartTrainingWatch;window.startTrainingLesson=startTrainingLesson;window.completeTrainingLesson=completeTrainingLesson;window.saveTrainingFromManager=saveTrainingFromManager;window.editTrainingLesson=editTrainingLesson;window.toggleTrainingLesson=toggleTrainingLesson;window.closeTraining=closeTraining;window.closeTrainingManager=closeTrainingManager;window.challenges=challenges;window.teams=teams;window.leader=leader;window.approvalCard=approvalCard;window.renderIdea=renderIdea;window.trainings=trainings;window.approveDXNMembershipRequest=approveDXNMembershipRequest;window.rejectDXNMembershipRequest=rejectDXNMembershipRequest;window.openDXNMembershipRequests=openDXNMembershipRequests;window.openApprovedDXNMembershipRequests=openApprovedDXNMembershipRequests;window.backToLeaderDashboard=backToLeaderDashboard;window.addEventListener('resize',()=>{if(!localStorage.getItem('dxn_view_mode'))renderViewSwitch()});
</script>
