<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مجتمع الصحة والثراء</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#eef5f1}
body{overflow:auto;font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif}
.page{min-height:100svh;display:flex;align-items:flex-start;justify-content:center;padding:0}
.poster{position:relative;width:min(100vw,1024px);line-height:0}
.poster img{display:block;width:100%;height:auto;image-rendering:auto}
.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;padding:0;margin:0;outline:none;z-index:5}
.hotspot:focus-visible{box-shadow:0 0 0 4px rgba(15,81,63,.45);border-radius:999px}
#previousUser{left:7.5%;bottom:13.0%;width:43%;height:9%}
#newVisitor{right:7.0%;bottom:13.0%;width:43%;height:9%}
@media(max-width:700px){.poster{width:100vw}}
</style>
</head>
<body>
<main class="page">
  <div class="poster">
    <img src="11.png" alt="مجتمع الصحة والثراء">
    <button id="previousUser" class="hotspot" aria-label="مستخدم سابق"></button>
    <button id="newVisitor" class="hotspot" aria-label="زائر جديد"></button>
  </div>
</main>
<script>
document.getElementById("newVisitor").addEventListener("click",()=>{
  location.href="/02-pretest-intro.html";
});
document.getElementById("previousUser").addEventListener("click",()=>{
  location.href="/app/index.html";
});
</script>
</body>
</html>
