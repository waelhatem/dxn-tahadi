<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=20260918">
<title>مجتمع الصحة والثراء</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#eef5f1}
body{overflow:hidden;font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif}
.page{height:100svh;width:100vw;overflow:hidden;position:relative;background:#eef5f1}
.view{width:100%;height:100%}
.hidden{display:none!important}
.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;padding:0;margin:0;outline:none}
.hotspot:focus-visible{box-shadow:0 0 0 4px rgba(15,81,63,.45);border-radius:999px}

/* واجهة الحاسوب: صورة سطح المكتب المعتمدة مستقلة عن صورة الموبايل */
.desktop-view{position:relative;width:100%;height:100%;display:block;overflow:hidden;background:#dfeae5}
.desktop-backdrop{display:none}
.desktop-poster{position:absolute;inset:0;width:100%;height:100%;line-height:0;z-index:2;overflow:hidden}
.desktop-poster img{width:100%;height:100%;display:block;object-fit:cover;object-position:center top}
/* أزرار شفافة فوق الأزرار المدمجة داخل صورة الحاسوب */
#desktopPreviousUser,
#desktopNewVisitor,
#desktopDeviceMobile,
#desktopDeviceComputer{
  position:absolute;
  border:0;
  background:transparent;
  color:transparent;
  box-shadow:none;
  padding:0;
  margin:0;
  cursor:pointer;
  outline:none;
  z-index:20;
}
#desktopNewVisitor{left:45.7%;top:59.4%;width:15%;height:8.5%}
#desktopPreviousUser{left:60.7%;top:59.4%;width:15%;height:8.5%}
#desktopDeviceComputer{left:41.7%;top:1%;width:7.8%;height:4%}
#desktopDeviceMobile{left:50.1%;top:1%;width:7.8%;height:4%}
#desktopNewVisitor:focus-visible,
#desktopPreviousUser:focus-visible,
#desktopDeviceMobile:focus-visible,
#desktopDeviceComputer:focus-visible{
  box-shadow:0 0 0 4px rgba(15,81,63,.45);
  border-radius:999px;
}

/* واجهة الموبايل: الصورة الأصلية كما هي */
.mobile-view{display:flex;align-items:center;justify-content:center}
.mobile-poster{position:relative;height:100%;max-height:100%;aspect-ratio:2 / 3;line-height:0}
.mobile-poster img{width:100%;height:100%;object-fit:contain;display:block}
#mobilePreviousUser{left:7.5%;bottom:13%;width:42.5%;height:9%}
#mobileNewVisitor{right:7%;bottom:13%;width:42.5%;height:9%}

@media(max-width:700px){}
</style>
<link rel="manifest" href="/manifest.json">
</head>
<body>
<main class="page">
<section id="desktopView" class="view desktop-view">
<div class="desktop-backdrop" aria-hidden="true"></div>
<div class="desktop-poster">
<img src="/desktop-home.png?v=20260918" alt="خلفية مجتمع الصحة والثراء">
<button id="desktopNewVisitor" class="hotspot" type="button" aria-label="زائر جديد"></button>
<button id="desktopPreviousUser" class="hotspot" type="button" aria-label="مستخدم سابق"></button>
<button id="desktopDeviceMobile" class="hotspot" type="button" aria-label="الموبايل"></button>
<button id="desktopDeviceComputer" class="hotspot" type="button" aria-label="الحاسوب"></button>
</div>
</section>
<section id="mobileView" class="view mobile-view hidden">
<div class="mobile-poster">
<img src="11.png" alt="مجتمع الصحة والثراء">
<button id="mobilePreviousUser" class="hotspot" type="button" aria-label="مستخدم سابق"></button>
<button id="mobileNewVisitor" class="hotspot" type="button" aria-label="زائر جديد"></button>
</div>
</section>
</main>
<script>
const mobileView=document.getElementById('mobileView');
const desktopView=document.getElementById('desktopView');
function goNew(mode){try{localStorage.setItem('dxn_selected_device_mode',mode);}catch(e){} location.href='/02-pretest-intro.html'}
function goPrevious(){location.href='/app/index.html'}
document.getElementById('desktopNewVisitor').addEventListener('click',function(){goNew('desktop')});
document.getElementById('desktopPreviousUser').addEventListener('click',goPrevious);
document.getElementById('desktopDeviceMobile').addEventListener('click',()=>{mobileView.classList.remove('hidden');desktopView.classList.add('hidden')});
document.getElementById('desktopDeviceComputer').addEventListener('click',()=>{desktopView.classList.remove('hidden');mobileView.classList.add('hidden')});
document.getElementById('mobileNewVisitor').addEventListener('click',function(){goNew('mobile')});
document.getElementById('mobilePreviousUser').addEventListener('click',goPrevious);
if(window.matchMedia('(max-width:700px)').matches){
  mobileView.classList.remove('hidden');
  desktopView.classList.add('hidden');
}else{
  mobileView.classList.add('hidden');
  desktopView.classList.remove('hidden');
}
</script>
<script src="/pwa-install.js?v=1" defer></script>
</body>
</html>
