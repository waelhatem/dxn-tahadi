<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f513f"><link rel="manifest" href="manifest.json"><title>لعبة تحديات DXN</title><style>
:root{--bg:#eef5f1;--card:#fff;--text:#182234;--muted:#667085;--line:#e2e8e5;--green:#0f513f;--green2:#176b55;--gold:#d99a18;--red:#b42318;--blue:#e8f1ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}.app{max-width:980px;margin:auto;padding:14px 14px 85px}.top{position:relative;background:linear-gradient(135deg,#0c4738,#1a725b);color:white;border-radius:0 0 36px 36px;padding:18px 18px 25px;text-align:center;box-shadow:0 8px 28px #0001}.logo{width:120px;height:120px;border-radius:50%;object-fit:cover;box-shadow:0 8px 24px #0003;border:4px solid #fff}.top h1{margin:8px 0 4px;font-size:30px}.top p{margin:0;font-size:14px;opacity:.88}.member-identity{position:absolute;left:18px;top:18px;min-width:150px;max-width:230px;padding:9px 12px;border:1px solid #ffffff55;border-radius:14px;background:#ffffff18;color:#fff;text-align:left;backdrop-filter:blur(4px);font-size:12px;line-height:1.45}.member-identity b{display:block;font-size:14px}.member-identity span{display:block;opacity:.92}.member-identity .role-label{font-weight:900;margin-bottom:2px}.logout-top{margin-top:8px;background:#ffffff22;color:#fff;border:1px solid #ffffff55;padding:7px 10px;min-height:36px;font-size:12px}.logout-top:hover{background:#ffffff33}.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0}.tab{flex:1;min-width:115px;border:0;border-radius:16px;padding:13px;background:#fff;color:var(--text);font-weight:900}.tab.active{background:var(--green);color:#fff}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}.stat .emoji{font-size:28px}.stat .k{color:var(--muted);font-weight:800}.stat b{font-size:27px;display:block}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.title{font-weight:950;font-size:19px}.muted{color:var(--muted);font-size:13px}.stars{color:var(--gold);font-weight:950}.badge{display:inline-block;background:#eef8f2;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900}.actions{display:flex;gap:7px;flex-wrap:wrap}button,input,textarea,select{font:inherit}button{border:0;border-radius:12px;padding:11px 14px;min-height:44px;font-weight:900;cursor:pointer;background:#eef3f2;color:var(--text)}button.primary{background:var(--green);color:#fff}button.gold{background:#fff4d5;color:#7a5300}button.danger{background:#fee4e2;color:#9f2118}button:disabled{opacity:.5;cursor:not-allowed}input,textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;margin:5px 0 10px;background:#fff}textarea{min-height:100px}.hidden{display:none!important}.challenge{border:1px solid #eadcb0;border-radius:18px;padding:14px;margin-top:10px;background:#fffdf5}.challenge h3{margin:0 0 5px}.question{border:1px solid #eadcb0;border-radius:18px;padding:14px;margin-top:10px;background:#fffdf5}.answer{background:#f7f9fb;border-radius:13px;padding:12px;white-space:pre-wrap}.ok{background:#edf9f0;border-color:#c5e4cc}.pending{background:#fff7df}.login{max-width:480px;margin:40px auto}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;gap:5px;padding:8px;z-index:20}.nav button{flex:1;max-width:180px;background:transparent}.small{font-size:11px}.empty{text-align:center;color:var(--muted);padding:20px}.toast{position:fixed;top:15px;left:15px;right:15px;background:#102a22;color:#fff;padding:12px;border-radius:13px;text-align:center;z-index:99}.teambar{display:flex;justify-content:space-between;gap:10px;padding:10px 0}.leaderbox{border:2px dashed #d7e2dd}

/* اختيار واجهة العرض */
.view-switch{display:flex;gap:8px;justify-content:center;margin:12px 0;position:sticky;top:8px;z-index:25}
.view-switch button{min-width:130px;border:1px solid var(--line);background:#fff}
.view-switch button.active{background:var(--green);color:#fff}
body.desktop-mode .app{max-width:1400px;padding:18px 28px 30px}
body.desktop-mode .top{border-radius:0 0 28px 28px;padding:20px 28px 28px;display:flex;align-items:center;gap:22px;text-align:right}
body.desktop-mode .top .logo{width:92px;height:92px}
body.desktop-mode .top h1{margin:0 0 5px;font-size:32px}
body.desktop-mode .tabs{position:sticky;top:0;z-index:24;background:var(--bg);padding:10px 0;margin:0}
body.desktop-mode .tabs .tab{min-width:150px}
body.desktop-mode .stats{grid-template-columns:repeat(4,1fr);gap:14px}
body.desktop-mode .card{padding:20px;margin-top:14px}
body.desktop-mode .nav{position:static;border:0;background:transparent;padding:12px 0;gap:10px}
body.desktop-mode .nav button{background:#fff;border:1px solid var(--line);border-radius:14px;max-width:none}
body.desktop-mode .login{max-width:620px;margin:50px auto}
body.desktop-mode .challenge,.desktop-mode .question{padding:18px}
body.mobile-mode .view-switch button{min-width:120px}
@media (max-width:799px){.member-identity{left:10px;top:10px;min-width:125px;max-width:170px;padding:7px 9px;font-size:11px}.member-identity b{font-size:12px}.top{padding-left:145px}}@media (min-width:800px){body:not(.mobile-mode) .app{max-width:1400px;padding:18px 28px 30px}body:not(.mobile-mode) .top{border-radius:0 0 28px 28px;padding:20px 28px 28px;display:flex;align-items:center;gap:22px;text-align:right}body:not(.mobile-mode) .top .logo{width:92px;height:92px}body:not(.mobile-mode) .top h1{margin:0 0 5px;font-size:32px}body:not(.mobile-mode) .stats{grid-template-columns:repeat(4,1fr)}body:not(.mobile-mode) .nav{position:static;border:0;background:transparent;padding:12px 0}body:not(.mobile-mode) .nav button{background:#fff;border:1px solid var(--line);border-radius:14px;max-width:none}}

.admin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}.admin-stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}.admin-stat .emoji{font-size:26px}.admin-stat .label{color:var(--muted);font-size:13px;font-weight:800}.admin-stat b{display:block;font-size:25px;margin-top:4px}.admin-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.admin-section-title{font-size:20px;font-weight:950;margin:0}.activity-item{padding:12px 0;border-bottom:1px solid var(--line)}.activity-item:last-child{border-bottom:0}.activity-time{color:var(--muted);font-size:12px}.mini-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.bar{height:9px;border-radius:99px;background:#e9efec;overflow:hidden;margin-top:7px}.bar>span{display:block;height:100%;background:var(--green);border-radius:99px}.admin-table{width:100%;border-collapse:collapse}.admin-table th,.admin-table td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:right;font-size:13px}.admin-table th{color:var(--muted)}
@media(max-width:799px){.admin-grid{grid-template-columns:repeat(2,1fr)}.mini-grid{grid-template-columns:1fr}.admin-table{display:block;overflow:auto;white-space:nowrap}}
.evidence-backdrop{position:fixed;inset:0;background:#0008;z-index:80}.evidence-modal{position:fixed;z-index:81;top:4vh;left:50%;transform:translateX(-50%);width:min(620px,94vw);max-height:92vh;overflow:auto}.evidence-modal h2{font-size:20px}.evidence-modal label{font-weight:900;display:block;margin-top:7px}.evidence-modal .row{align-items:flex-start}.evidence-modal img{object-fit:contain}@media(max-width:799px){.evidence-modal{top:2vh;max-height:96vh}}</style></head><body><div id="app" class="app"></div><div id="toast" class="toast hidden"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const C=window.DXN_CONFIG||{};let sb=null,token=localStorage.getItem('dxn_session')||'',me=null,role=null,data=null,tab='home';
const $=id=>document.getElementById(id); const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2600)}
function ready(){return C.SUPABASE_URL&&C.SUPABASE_ANON_KEY&&!C.SUPABASE_URL.includes('YOUR-PROJECT')&&!C.SUPABASE_ANON_KEY.includes('YOUR_')}
async function rpc(fn,args){if(!sb)throw Error('لم يتم إعداد Supabase');const {data:d,error}=await sb.rpc(fn,args);if(error)throw error;return d}
async function boot(){if(!ready()){renderSetup();return}sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);if(!token){renderLogin();return}try{const d=await rpc('bootstrap',{p_token:token});data=d;role=d.role;me=(d.members||[])[0]||null;render()}catch(e){localStorage.removeItem('dxn_session');token='';renderLogin();toast(e.message||'انتهت الجلسة')}}
function renderSetup(){ $('app').innerHTML=`<div class="login card"><img class="logo" src="logo.png"><h1>لعبة تحديات DXN</h1><h2>إعداد النسخة Online</h2><p class="muted">النسخة جاهزة للربط بقاعدة بيانات Supabase. افتح ملف <b>config.js</b> وضع رابط المشروع وPublic anon key، ثم ارفع المجلد إلى Vercel أو أي استضافة ثابتة.</p><div class="card leaderbox"><b>الخطوات:</b><ol><li>أنشئ مشروع Supabase.</li><li>نفّذ ملف schema.sql بالكامل في SQL Editor.</li><li>ضع بيانات المشروع في config.js.</li><li>ارفع المجلد إلى Vercel.</li></ol></div></div>`}
function renderLogin(){ $('app').innerHTML=`<div class="view-switch" id="viewSwitch"></div><div class="login card"><div style="text-align:center"><img class="logo" src="logo.png"><h1>لعبة تحديات DXN</h1><p class="muted">دخول موحد من أي جهاز</p></div><label>نوع الدخول</label><select id="role"><option value="member">👤 دخول العضو</option><option value="leader">👑 دخول القائد</option></select><label>رقم العضوية / رمز القائد</label><input id="loginNo" placeholder="مثال: 820426486 أو LEADER"><label>رمز الدخول PIN</label><input id="pin" type="text" autocomplete="current-password" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="PIN"><button class="primary" style="width:100%" onclick="login()">🔐 دخول</button><button style="width:100%;margin-top:8px" onclick="renderRegister()">➕ عضو جديد؟ إنشاء حساب</button><p class="muted small">بيانات القائد التجريبية بعد تنفيذ schema.sql: LEADER / 123456 — غيّرها فوراً.</p></div>`}
async function renderRegister(){
  $('app').innerHTML=`<div class="view-switch" id="viewSwitch"></div><div class="login card"><div style="text-align:center"><img class="logo" src="logo.png"><h1>عضو جديد</h1><p class="muted">أنشئ طلب عضوية جديد. بعد الإرسال يراجع القائد الطلب ويعتمد الحساب.</p></div><label>الاسم الكامل</label><input id="regName" placeholder="الاسم الكامل"><label>رقم العضوية</label><input id="regNo" inputmode="numeric" maxlength="9" placeholder="9 أرقام"><label>الفريق</label><select id="regTeam"><option value="">بدون فريق</option></select><label>PIN جديد</label><input id="regPin" type="text" inputmode="text" placeholder="4 أحرف أو أرقام على الأقل"><label>تأكيد PIN</label><input id="regPin2" type="text" inputmode="text" placeholder="أعد كتابة PIN"><button class="primary" style="width:100%" onclick="selfRegister()">📝 إرسال طلب العضوية</button><button style="width:100%;margin-top:8px" onclick="renderLogin()">↩️ العودة لتسجيل الدخول</button><p class="muted small">لن يتم تفعيل الحساب قبل مراجعة القائد.</p></div>`;
  try{const teams=await rpc('registration_teams');const el=$('regTeam');(teams||[]).forEach(t=>{const o=document.createElement('option');o.value=t.id;o.textContent=t.name;el.appendChild(o)})}catch(e){toast(e.message||'تعذر تحميل الفرق')}
  renderViewSwitch();
}
async function selfRegister(){
  const name=$('regName').value.trim(), no=$('regNo').value.trim(), team=$('regTeam').value||null, pin=$('regPin').value, pin2=$('regPin2').value;
  if(!name)return toast('أدخل الاسم الكامل.');
  if(!/^\d{9}$/.test(no))return toast('رقم العضوية يجب أن يكون 9 أرقام بالضبط.');
  if(pin.length<4)return toast('PIN يجب أن يكون 4 أحرف أو أرقام على الأقل.');
  if(pin!==pin2)return toast('تأكيد PIN غير مطابق.');
  try{await rpc('self_register',{p_member_no:no,p_name:name,p_pin:pin,p_team:team});$('app').innerHTML=`<div class="login card"><div style="text-align:center"><img class="logo" src="logo.png"><h1>تم إرسال الطلب ✅</h1><p>تم تسجيل بياناتك بنجاح، لكن الحساب بانتظار موافقة القائد.</p><p class="muted">بعد اعتماد القائد يمكنك الدخول باستخدام رقم العضوية وPIN الذي اخترته.</p><button class="primary" style="width:100%" onclick="renderLogin()">🔐 العودة لتسجيل الدخول</button></div></div>`}catch(e){toast(e.message||'تعذر إرسال طلب العضوية')}
}
function renderViewSwitch(){
  const el=document.getElementById('viewSwitch');
  const saved=localStorage.getItem('dxn_view_mode');
  const mode=saved || (window.innerWidth>=800 ? 'desktop' : 'mobile');
  document.body.classList.toggle('desktop-mode',mode==='desktop');
  document.body.classList.toggle('mobile-mode',mode==='mobile');
  if(!el)return;
  el.innerHTML=`<button class="${mode==='mobile'?'active':''}" onclick="setViewMode('mobile')">📱 واجهة الموبايل</button><button class="${mode==='desktop'?'active':''}" onclick="setViewMode('desktop')">🖥️ واجهة الحاسوب</button>`;
}
function setViewMode(mode){
  localStorage.setItem('dxn_view_mode',mode);
  document.body.classList.remove('mobile-mode','desktop-mode');
  document.body.classList.add(mode==='desktop'?'desktop-mode':'mobile-mode');
  renderViewSwitch();
}
async function login(){try{const r=await rpc('login',{p_login_no:$('loginNo').value.trim(),p_pin:$('pin').value.trim()});token=r.token;localStorage.setItem('dxn_session',token);await boot()}catch(e){toast(e.message||'تعذر الدخول')}}
async function logout(){try{await rpc('logout',{p_token:token})}catch{}localStorage.removeItem('dxn_session');token='';me=null;data=null;renderLogin()}
function switchTab(next){tab=next;try{render()}catch(e){console.error(e);toast('تعذر فتح القسم: '+(e.message||e))}}
function nav(){return `<div class="nav"><button onclick="switchTab('home')">🏠<br><span class="small">الرئيسية</span></button><button onclick="switchTab('ch')">🎯<br><span class="small">التحديات</span></button><button onclick="switchTab('teams')">👥<br><span class="small">الأعضاء والفرق</span></button>${role==='leader'?`<button onclick="switchTab('leader')">👑<br><span class="small">القائد</span></button>`:''}</div>`}
function render(){if(role==='leader'&&!me)me=null;let identity=role==='member'&&me?`<div class="member-identity"><span class="role-label">👤 العضو</span><b>${esc(me.name||'')}</b><span>🪪 ${esc(me.member_no||'')}</span><button class="logout-top" onclick="logout()">🚪 تسجيل الخروج</button></div>`:`<div class="member-identity"><span class="role-label">👑 القائد</span><b>LEADER</b><button class="logout-top" onclick="logout()">🚪 تسجيل الخروج</button></div>`;let html=`<div class="view-switch" id="viewSwitch"></div><div class="top"><img src="logo.png" class="logo"><h1>لعبة تحديات DXN</h1><p>⭐ نجوم للنشاط والإنجاز — منافسة فردية وبين الفرق</p>${identity}</div>`;html+=`<div class="tabs"><button class="tab ${tab==='home'?'active':''}" onclick="switchTab('home')">الرئيسية 📊</button><button class="tab ${tab==='ch'?'active':''}" onclick="switchTab('ch')">التحديات 🎯</button><button class="tab ${tab==='teams'?'active':''}" onclick="switchTab('teams')">الأعضاء والفرق 👥</button>${role==='leader'?`<button class="tab ${tab==='leader'?'active':''}" onclick="switchTab('leader')">إدارة القائد 👑</button>`:''}</div>`;html+=tab==='home'?home():tab==='ch'?challenges():tab==='teams'?teams():leader();html+=nav();$('app').innerHTML=html;renderViewSwitch()}
function home(){const teams=data.teams||[], members=data.members||[], ch=data.challenges||[];const totalStars=members.reduce((a,x)=>a+Number(x.stars||0),0);return `<div class="stats"><div class="stat"><div class="emoji">👥</div><div class="k">الأعضاء</div><b>${role==='leader'?members.length:1}</b></div><div class="stat"><div class="emoji">🏆</div><div class="k">الفرق</div><b>${teams.length}</b></div><div class="stat"><div class="emoji">⭐</div><div class="k">نجوم الفريق</div><b>${role==='leader'?totalStars:(me?.stars||0)}</b></div><div class="stat"><div class="emoji">🎯</div><div class="k">إجمالي التحديات</div><b>${ch.length}</b></div></div><div class="card"><div class="title">🎯 تحديات النمو والتوسع</div>${ch.slice(0,1).map(c=>challengeCard(c)).join('')}</div><div class="card"><div class="title">👥 إنجازات الفرق</div>${teams.map(t=>`<div class="teambar"><b>${esc(t.name)}</b><span>⭐ ${t.stars} · 🎯 ${t.approved_challenges} إنجاز</span></div>`).join('')||'<div class="empty">لا توجد فرق بعد.</div>'}</div>`}
function challengeCard(c){const mine=(data.my_submissions||[]).filter(x=>String(x.challenge_id||x.challengeId)===String(c.id));const pending=mine.some(x=>x.status==='pending');return `<div class="challenge"><h3>${esc(c.title)} <span class="stars">⭐${c.stars}</span></h3><div class="muted">${esc(c.type)} · ${esc(c.repeat_rule)}</div><p>${esc(c.description)}</p>${role==='member'?`<button class="primary" ${pending?'disabled':''} onclick="openChallengeSubmission('${c.id}')">${pending?'⏳ بانتظار اعتماد القائد':'✅ إنجاز التحدي وإرسال الإثبات'}</button>`:''}</div>`}
function openChallengeSubmission(id){const c=(data.challenges||[]).find(x=>String(x.id)===String(id));if(!c)return;const title=(c.title||'')+' '+(c.type||'');const isConsume=/استهلاك|منتج/i.test(title);const isContact=/تواصل|استقطاب/i.test(title);const today=new Date().toISOString().slice(0,10);const body=isConsume?`<label>📦 اسم المنتج</label><input id="ev_product" placeholder="مثال: قهوة لينجزي"><label>📅 تاريخ الاستهلاك</label><input id="ev_date" type="date" value="${today}"><label>📝 ملاحظة</label><textarea id="ev_note" placeholder="ملاحظة مختصرة (اختياري)"></textarea><label>📷 صورة الإثبات <span class="muted">(حتى 5 MB)</span></label><input id="ev_file" type="file" accept="image/jpeg,image/png,image/webp" onchange="previewEvidence()"><div id="ev_preview"></div>`:isContact?`<label>👤 اسم الشخص المحتمل</label><input id="ev_person" placeholder="اسم الشخص"><label>🌍 البلد</label><input id="ev_country" placeholder="مثال: العراق"><label>📱 طريقة التواصل</label><select id="ev_method"><option>واتساب</option><option>اتصال هاتفي</option><option>لقاء مباشر</option><option>فيسبوك</option><option>أخرى</option></select><label>📅 تاريخ التواصل</label><input id="ev_date" type="date" value="${today}"><label>📝 ماذا حدث في التواصل؟</label><textarea id="ev_note" placeholder="اكتب نتيجة التواصل باختصار"></textarea><label>📷 صورة الإثبات <span class="muted">(حتى 5 MB)</span></label><input id="ev_file" type="file" accept="image/jpeg,image/png,image/webp" onchange="previewEvidence()"><div id="ev_preview"></div>`:`<label>📝 وصف الإنجاز</label><textarea id="ev_note" placeholder="اكتب وصفاً مختصراً لما أنجزته..."></textarea><label>📷 صورة الإثبات <span class="muted">(حتى 5 MB، إن وجدت)</span></label><input id="ev_file" type="file" accept="image/jpeg,image/png,image/webp" onchange="previewEvidence()"><div id="ev_preview"></div>`;const modal=document.createElement('div');modal.id='evidenceModal';modal.innerHTML=`<div class="evidence-backdrop" onclick="closeEvidenceModal()"></div><div class="evidence-modal card"><div class="row"><div><h2 style="margin:0">🎯 ${esc(c.title)}</h2><div class="muted">⭐${c.stars} · أرسل التفاصيل والإثبات للقائد للمراجعة</div></div><button onclick="closeEvidenceModal()">✖️</button></div>${body}<div class="actions"><button class="primary" onclick="sendChallengeEvidence('${c.id}')">📤 إرسال الإنجاز</button><button onclick="closeEvidenceModal()">إلغاء</button></div></div>`;document.body.appendChild(modal)}
function closeEvidenceModal(){const m=$('evidenceModal');if(m)m.remove()}
function previewEvidence(){const f=$('ev_file')?.files?.[0],p=$('ev_preview');if(!p)return;p.innerHTML='';if(!f)return;if(!f.type.startsWith('image/'))return toast('اختر ملف صورة فقط.');if(f.size>5*1024*1024){$('ev_file').value='';return toast('حجم الصورة يجب ألا يتجاوز 5 MB.')}const img=document.createElement('img');img.src=URL.createObjectURL(f);img.style='max-width:180px;max-height:180px;border-radius:14px;margin:6px 0;display:block';p.appendChild(img)}
async function sendChallengeEvidence(id){try{const c=(data.challenges||[]).find(x=>String(x.id)===String(id));if(!c)return;const title=(c.title||'')+' '+(c.type||'');const isConsume=/استهلاك|منتج/i.test(title);const isContact=/تواصل|استقطاب/i.test(title);const details={};if(isConsume){details.product=$('ev_product')?.value.trim();details.date=$('ev_date')?.value||'';if(!details.product)return toast('أدخل اسم المنتج.')}else if(isContact){details.person=$('ev_person')?.value.trim();details.country=$('ev_country')?.value.trim();details.method=$('ev_method')?.value||'';details.date=$('ev_date')?.value||'';if(!details.person)return toast('أدخل اسم الشخص المحتمل.');if(!details.country)return toast('أدخل بلد الشخص.')}details.note=$('ev_note')?.value.trim()||'';if(!isConsume&&!isContact&&!details.note)return toast('اكتب وصف الإنجاز أولاً.');const f=$('ev_file')?.files?.[0];if(f){if(!f.type.startsWith('image/'))return toast('اختر ملف صورة فقط.');if(f.size>5*1024*1024)return toast('حجم الصورة يجب ألا يتجاوز 5 MB.')}let path=null;if(f){const ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';const base=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36));path=`evidence/${base}.${ext}`;const up=await sb.storage.from('challenge-evidence').upload(path,f,{contentType:f.type,upsert:false});if(up.error)throw up.error}await rpc('submit_challenge_details',{p_token:token,p_challenge:id,p_proof:details.note||'تم إرفاق تفاصيل الإنجاز.',p_details:details,p_evidence_path:path});closeEvidenceModal();toast('تم إرسال الإنجاز والإثبات للقائد.');await refresh()}catch(e){toast(e.message||'تعذر إرسال الإنجاز')}}
async function openEvidence(path){try{const r=await sb.storage.from('challenge-evidence').download(path);if(r.error)throw r.error;const url=URL.createObjectURL(r.data);window.open(url,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){toast(e.message||'تعذر فتح صورة الإثبات')}}
function challenges(){return `<div class="card"><div class="title">🎯 التحديات الأساسية</div><p class="muted">التحدي لا يختفي بعد الإنجاز. التحديات المتكررة يمكن إنجازها مرة أخرى وفق قاعدتها، والنجوم لا تُضاف إلا بعد اعتماد القائد.</p>${role==='leader'?`<div class="leaderbox" style="margin:12px 0;padding:12px;border-radius:16px"><div class="title">⚙️ إدارة التحديات</div><div class="actions" style="margin-top:10px"><button class="primary" onclick="openChallengeEditor()">➕ إضافة تحدٍ جديد</button></div>${(data.challenges||[]).map(c=>challengeAdminCard(c)).join('')||'<div class="empty">لا توجد تحديات.</div>'}</div>`:(data.challenges||[]).map(challengeCard).join('')}</div>${role==='member'?questions():''}`}

function approvalCard(x,isQuestion){const id=x.id||x.submission_id||x.answer_id;const title=x.challenge_title||x.title||(isQuestion?'إجابة سؤال':'إنجاز تحدي');const member=x.member_name||x.name||x.member_no||'عضو';const proof=x.proof||x.answer||x.description||'';const stars=x.stars??x.challenge_stars??1;const d=x.evidence_details||{};const extra=!isQuestion&&Object.keys(d).length?`<div class="answer" style="margin-top:7px">${d.product?`📦 المنتج: ${esc(d.product)}<br>`:''}${d.person?`👤 الشخص: ${esc(d.person)}<br>`:''}${d.country?`🌍 البلد: ${esc(d.country)}<br>`:''}${d.method?`📱 الطريقة: ${esc(d.method)}<br>`:''}${d.date?`📅 التاريخ: ${esc(d.date)}<br>`:''}${d.note?`📝 ${esc(d.note)}`:''}</div>`:'';const evidence=x.evidence_path?`<button onclick="openEvidence('${esc(x.evidence_path)}')">📷 عرض الإثبات</button>`:'';return `<div class="row pending"><div><b>${esc(title)}</b><div class="muted">👤 ${esc(member)} · ⭐${esc(stars)}</div>${extra}${proof?`<div class="answer" style="margin-top:7px">${esc(proof)}</div>`:''}</div><div class="actions">${evidence}<button class="primary" onclick="decide('${id}',${isQuestion},true)">✅ اعتماد</button><button class="danger" onclick="decide('${id}',${isQuestion},false)">❌ رفض</button></div></div>`}

function openChallengeEditor(id){const c=(data.challenges||[]).find(x=>String(x.id)===String(id));const title=prompt('اسم التحدي:',c?.title||'');if(title===null)return;const description=prompt('وصف التحدي:',c?.description||'');if(description===null)return;const type=prompt('نوع التحدي (مثال: الاستقطاب):',c?.type||'عام');if(type===null)return;const stars=prompt('عدد النجوم:',String(c?.stars??10));if(stars===null)return;const repeat=prompt('قاعدة التكرار (يومي/أسبوعي/شهري/مرة واحدة):',c?.repeat_rule||'مرة واحدة');if(repeat===null)return;saveChallenge(id,{title,description,type,stars:Number(stars),repeat_rule:repeat})}
async function saveChallenge(id,item){try{if(!item.title.trim())return toast('اسم التحدي مطلوب.');if(!Number.isInteger(item.stars)||item.stars<0)return toast('عدد النجوم يجب أن يكون رقماً صحيحاً غير سالب.');if(id){await rpc('update_challenge',{p_token:token,p_challenge:id,p_type:item.type.trim(),p_title:item.title.trim(),p_description:item.description.trim(),p_stars:item.stars,p_repeat_rule:item.repeat_rule.trim()});toast('تم تعديل التحدي.')}else{await rpc('create_challenge',{p_token:token,p_type:item.type.trim(),p_title:item.title.trim(),p_description:item.description.trim(),p_stars:item.stars,p_repeat_rule:item.repeat_rule.trim()});toast('تم إضافة التحدي.')}await refresh()}catch(e){toast(e.message||'تعذر حفظ التحدي')}}
async function setChallengeStars(id){const c=(data.challenges||[]).find(x=>String(x.id)===String(id));if(!c)return;const v=prompt('عدد النجوم الجديد:',String(c.stars));if(v===null)return;const n=Number(v);if(!Number.isInteger(n)||n<0)return toast('أدخل عدد نجوم صحيحاً غير سالب.');try{await rpc('set_challenge_stars',{p_token:token,p_challenge:id,p_stars:n});toast('تم تغيير نقاط التحدي.');await refresh()}catch(e){toast(e.message||'تعذر تغيير النقاط')}}
async function toggleChallengeFreeze(id,isFrozen){try{await rpc('toggle_challenge_freeze',{p_token:token,p_challenge:id,p_frozen:!isFrozen});toast(isFrozen?'تم إلغاء تجميد التحدي.':'تم تجميد التحدي.');await refresh()}catch(e){toast(e.message||'تعذر تغيير حالة التحدي')}}
async function deleteChallenge(id){const c=(data.challenges||[]).find(x=>String(x.id)===String(id));if(!c)return;if(!confirm(`هل تريد حذف التحدي «${c.title}»؟\nسيختفي عن الأعضاء، وتبقى الإنجازات السابقة محفوظة.`))return;try{await rpc('delete_challenge',{p_token:token,p_challenge:id});toast('تم حذف التحدي.');await refresh()}catch(e){toast(e.message||'تعذر حذف التحدي')}}
async function approveRegistration(id){if(!confirm('اعتماد طلب العضوية وتفعيل الحساب؟'))return;try{await rpc('approve_member_registration',{p_token:token,p_member:id});toast('تم اعتماد العضوية وتفعيل الحساب.');await refresh()}catch(e){toast(e.message||'تعذر اعتماد الطلب')}}
async function rejectRegistration(id){if(!confirm('رفض طلب العضوية وحذفه؟'))return;try{await rpc('reject_member_registration',{p_token:token,p_member:id});toast('تم رفض الطلب.');await refresh()}catch(e){toast(e.message||'تعذر رفض الطلب')}}
function createMemberForm(){
 const no=prompt('رقم العضوية:'); if(no===null)return;
 const name=prompt('اسم العضو:'); if(name===null)return;
 const pin=prompt('PIN المؤقت (4 أحرف/أرقام على الأقل):'); if(pin===null)return;
 const activeTeams=(data.teams||[]).filter(t=>t.active!==false); const teamList=activeTeams.map((t,i)=>`${i+1}. ${t.name}`).join('\n');
 const choice=prompt(`اختر رقم الفريق:
${teamList}\n\nاتركه فارغاً إذا كان العضو بلا فريق.`,''); if(choice===null)return;
 const idx=choice.trim()===''?-1:Number(choice)-1; const team=(idx>=0&&activeTeams[idx])?activeTeams[idx].id:null; if(choice.trim()!==''&&!team)return toast('رقم الفريق غير صحيح.');
 createMemberValues(no,name,pin,team);
}
async function createMemberValues(no,name,pin,team){try{await rpc('create_member',{p_token:token,p_member_no:no,p_name:name,p_pin:pin,p_team:team||null});toast('تم إنشاء العضو.');await refresh()}catch(e){toast(e.message||'تعذر إنشاء العضو')}}
function createTeamForm(){const n=prompt('اسم الفريق الجديد:');if(n===null)return;createTeamValues(n)}
async function createTeamValues(n){try{if(!n.trim())return;await rpc('create_team',{p_token:token,p_name:n});toast('تم إنشاء الفريق.');await refresh()}catch(e){toast(e.message||'تعذر إنشاء الفريق')}}
async function editTeam(id){const t=(data.teams||[]).find(x=>String(x.id)===String(id));if(!t)return;const n=prompt('اسم الفريق:',t.name||'');if(n===null)return;try{await rpc('update_team',{p_token:token,p_team:id,p_name:n});toast('تم تعديل الفريق.');await refresh()}catch(e){toast(e.message||'تعذر تعديل الفريق')}}
async function toggleTeam(id,active){const msg=active?'تفعيل الفريق؟':'تعطيل الفريق؟\nسيبقى السجل التاريخي محفوظاً.';if(!confirm(msg))return;try{await rpc('toggle_team_active',{p_token:token,p_team:id,p_active:active});toast(active?'تم تفعيل الفريق.':'تم تعطيل الفريق.');await refresh()}catch(e){toast(e.message||'تعذر تغيير حالة الفريق')}}
async function editMember(id){const m=(data.members||[]).find(x=>String(x.id)===String(id));if(!m)return;const no=prompt('رقم العضوية:',m.member_no||'');if(no===null)return;const name=prompt('اسم العضو:',m.name||'');if(name===null)return;const activeTeams=(data.teams||[]).filter(t=>t.active!==false);const teamList=activeTeams.map((t,i)=>`${i+1}. ${t.name}`).join('\n');const currentIdx=activeTeams.findIndex(t=>String(t.id)===String(m.team_id));const choice=prompt(`الفريق الحالي: ${m.team_name||'بدون فريق'}\n\nالفرق المتاحة:\n${teamList}\n\nأدخل رقم الفريق أو اتركه فارغاً:`,currentIdx>=0?String(currentIdx+1):'');if(choice===null)return;const idx=choice.trim()===''?-1:Number(choice)-1;const team=(idx>=0&&activeTeams[idx])?activeTeams[idx].id:null;if(choice.trim()!==''&&!team)return toast('رقم الفريق غير صحيح.');try{await rpc('update_member',{p_token:token,p_member:id,p_member_no:no,p_name:name,p_team:team});toast('تم تعديل بيانات العضو.');await refresh()}catch(e){toast(e.message||'تعذر تعديل العضو')}}
async function toggleMember(id,active){const msg=active?'تفعيل العضو؟':'تعطيل العضو؟\nسيبقى حسابه وإنجازاته محفوظة لكن لن يظهر كعضو نشط.';if(!confirm(msg))return;try{await rpc('toggle_member_active',{p_token:token,p_member:id,p_active:active});toast(active?'تم تفعيل العضو.':'تم تعطيل العضو.');await refresh()}catch(e){toast(e.message||'تعذر تغيير حالة العضو')}}
async function changeMemberPin(id){const p=prompt('PIN الجديد للعضو (4 أحرف/أرقام على الأقل):');if(p===null)return;try{await rpc('change_member_pin',{p_token:token,p_member:id,p_new_pin:p});toast('تم تغيير PIN العضو.')}catch(e){toast(e.message||'تعذر تغيير PIN العضو')}}
async function saveQuestions(){try{const items=[1,2,3,4,5].map(n=>({question_no:n,text:$('qtxt'+n).value.trim(),category:$('qcat'+n).value.trim()}));if(items.some(x=>!x.text))return toast('أكمل الأسئلة الخمسة.');await rpc('save_month_questions',{p_token:token,p_items:items});toast('تم تثبيت الأسئلة الخمسة للشهر.');await refresh()}catch(e){toast(e.message||'تعذر حفظ الأسئلة')}}
async function changePin(){const p=prompt('PIN الجديد:');if(!p)return;try{await rpc('change_pin',{p_token:token,p_new_pin:p});toast('تم تغيير PIN.')}catch(e){toast(e.message||'تعذر تغيير PIN')}}
async function decide(id,q,ok){try{await rpc(q?'approve_question':'approve_challenge',{p_token:token,[q?'p_answer':'p_submission']:id,p_ok:ok});toast(ok?'تم الاعتماد وإضافة النجوم.':'تم الرفض.');await refresh()}catch(e){toast(e.message||'تعذر التنفيذ')}}
async function setPoints(id){const v=prompt('أدخل نقاط DXN الفعلية لهذا العضو هذا الشهر:','100');if(v===null)return;try{await rpc('set_monthly_points',{p_token:token,p_member:id,p_points:Number(v)});if(Number(v)>=100&&confirm('العضو حقق 100 نقطة. هل تضيف مكافأة ⭐100؟'))await rpc('award_monthly_target',{p_token:token,p_member:id});toast('تم تحديث التارجت.');await refresh()}catch(e){toast(e.message||'تعذر تحديث التارجت')}}
async function refresh(){const d=await rpc('bootstrap',{p_token:token});data=d;role=d.role;me=(d.members||[]).find(x=>role==='member')||null;render()}
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{}); boot();
window.addEventListener('resize',()=>{if(!localStorage.getItem('dxn_view_mode'))renderViewSwitch()});
</script></body></html>
