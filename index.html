<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=20260918">
<title>مجتمع الصحة والثراء</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#eef5f1}
body{overflow:hidden;font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif}
.page{height:100svh;width:100vw;overflow:hidden;position:relative;background:#eef5f1}
.view{width:100%;height:100%}
.hidden{display:none!important}
.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;padding:0;margin:0;outline:none}
.hotspot:focus-visible{box-shadow:0 0 0 4px rgba(15,81,63,.45);border-radius:999px}
.home-brand-logo{position:absolute;z-index:28;display:block;object-fit:contain;pointer-events:none;filter:drop-shadow(0 8px 18px rgba(0,0,0,.16))}
.desktop-brand-logo{right:18.5%;top:8%;width:24%;height:auto}
.mobile-brand-logo{right:15%;top:6%;width:70%;height:auto}
@media(max-width:700px){.desktop-brand-logo{display:none}.mobile-brand-logo{display:block}}
@media(min-width:701px){.mobile-brand-logo{display:none}}.visible-cta{position:absolute;z-index:30;display:flex;align-items:center;justify-content:center;gap:10px;border:0;cursor:pointer;text-align:center;font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;direction:rtl;box-sizing:border-box;line-height:1.05;transition:filter .18s ease,transform .18s ease}
.visible-cta .cta-main{display:block;font-weight:950;font-size:clamp(17px,1.55vw,28px)}
.visible-cta .cta-sub{display:block;margin-top:5px;font-weight:750;font-size:clamp(10px,.82vw,15px)}
.visible-cta.new{background:linear-gradient(135deg,#0f513f,#176b55);color:#fff;border:2px solid rgba(255,255,255,.95);border-radius:24px;box-shadow:0 10px 24px rgba(0,0,0,.22)}
.visible-cta.previous{background:rgba(255,255,255,.98);color:#0f513f;border:2px solid #0f513f;border-radius:24px;box-shadow:0 10px 24px rgba(0,0,0,.14)}
.visible-cta:hover{filter:brightness(1.06);transform:translateY(-1px)}
.visible-cta:active{transform:translateY(1px) scale(.99)}
.visible-cta .icon{width:27px;height:27px;flex:0 0 auto}
.desktop-cta,.mobile-cta{position:absolute;inset:0;z-index:25;pointer-events:none}
.desktop-cta .visible-cta,.mobile-cta .visible-cta{pointer-events:auto}
.desktop-cta .new{left:72.5%;top:51.8%;width:16%;height:9.5%}
.desktop-cta .previous{left:55.7%;top:51.8%;width:16%;height:9.5%}
.mobile-cta .new{right:7%;bottom:13%;width:43%;height:9%}
.mobile-cta .previous{left:7.5%;bottom:13%;width:43%;height:9%}
@media(max-width:700px){
  .visible-cta .cta-main{font-size:16px}
  .visible-cta .cta-sub{font-size:9px}
  .visible-cta{border-radius:18px!important}
  .visible-cta .icon{width:22px;height:22px}
}

/* واجهة الحاسوب: صورة سطح المكتب المعتمدة مستقلة عن صورة الموبايل */
.desktop-view{position:relative;width:100%;height:100%;display:block;overflow:hidden;background:#dfeae5}
.desktop-backdrop{display:none}
.desktop-poster{position:absolute;inset:0;width:100%;height:100%;line-height:0;z-index:2;overflow:hidden}
.desktop-poster img{width:100%;height:100%;display:block;object-fit:cover;object-position:center top}
/* أزرار شفافة فوق الأزرار المدمجة داخل صورة الحاسوب */
#desktopPreviousUser,
#desktopNewVisitor,
#desktopDeviceMobile,
#desktopDeviceComputer{
  position:absolute;
  border:0;
  background:transparent;
  color:transparent;
  box-shadow:none;
  padding:0;
  margin:0;
  cursor:pointer;
  outline:none;
  z-index:20;
}
#desktopNewVisitor{left:45.7%;top:61.2%;width:15%;height:9%}
#desktopPreviousUser{left:60.7%;top:61.2%;width:15%;height:9%}
#desktopDeviceComputer{left:41.7%;top:1%;width:7.8%;height:4.5%}
#desktopDeviceMobile{left:50.1%;top:1%;width:7.8%;height:4.5%}
#desktopNewVisitor:focus-visible,
#desktopPreviousUser:focus-visible,
#desktopDeviceMobile:focus-visible,
#desktopDeviceComputer:focus-visible{
  box-shadow:0 0 0 4px rgba(15,81,63,.45);
  border-radius:999px;
}

/* واجهة الموبايل: الصورة الأصلية كما هي */
.mobile-view{display:flex;align-items:center;justify-content:center}
.mobile-poster{position:relative;height:100%;max-height:100%;aspect-ratio:2 / 3;line-height:0}
.mobile-poster img{width:100%;height:100%;object-fit:contain;display:block}
#mobilePreviousUser{left:7.5%;bottom:13%;width:43%;height:9%}
#mobileNewVisitor{right:7%;bottom:13%;width:43%;height:9%}

@media(max-width:700px){}
</style>
<link rel="manifest" href="/manifest.json">
</head>
<body>
<main class="page">
<section id="desktopView" class="view desktop-view">
<div class="desktop-backdrop" aria-hidden="true"></div>
<div class="desktop-poster">
<img src="/desktop-home.png?v=20260918" alt="خلفية مجتمع الصحة والثراء">
<button id="desktopNewVisitor" class="hotspot" type="button" aria-label="زائر جديد"></button>
<button id="desktopPreviousUser" class="hotspot" type="button" aria-label="مستخدم سابق"></button>
<button id="desktopDeviceMobile" class="hotspot" type="button" aria-label="الموبايل"></button>
<button id="desktopDeviceComputer" class="hotspot" type="button" aria-label="الحاسوب"></button>
<img id="desktopHomeLogo" class="home-brand-logo desktop-brand-logo" src="/logo.png" alt="مجتمع الصحة والثراء">
<div class="desktop-cta">
  <button id="desktopNewVisitorVisible" class="visible-cta new" type="button" aria-label="زائر جديد">
    <span><span class="cta-main">زائر جديد</span><span class="cta-sub">اكتشف الفرص المناسبة لك</span></span>
  </button>
  <button id="desktopPreviousUserVisible" class="visible-cta previous" type="button" aria-label="مستخدم سابق">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm-7 15a7 7 0 0 1 14 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span><span class="cta-main">مستخدم سابق</span><span class="cta-sub">تسجيل الدخول إلى حسابك</span></span>
  </button>
</div>
</div>
</section>
<section id="mobileView" class="view mobile-view hidden">
<div class="mobile-poster">
<img id="mobileHomeLogo" class="home-brand-logo mobile-brand-logo" src="/logo.png" alt="مجتمع الصحة والثراء">
<img src="11.png" alt="مجتمع الصحة والثراء">
<button id="mobilePreviousUser" class="hotspot" type="button" aria-label="مستخدم سابق"></button>
<button id="mobileNewVisitor" class="hotspot" type="button" aria-label="زائر جديد"></button>
<div class="mobile-cta">
  <button id="mobileNewVisitorVisible" class="visible-cta new" type="button" aria-label="زائر جديد">
    <span><span class="cta-main">زائر جديد</span><span class="cta-sub">اكتشف الفرص المناسبة لك</span></span>
  </button>
  <button id="mobilePreviousUserVisible" class="visible-cta previous" type="button" aria-label="مستخدم سابق">
    <span><span class="cta-main">مستخدم سابق</span><span class="cta-sub">تسجيل الدخول إلى حسابك</span></span>
  </button>
</div>
</div>
</section>
</main>
<script>
const mobileView=document.getElementById('mobileView');
const desktopView=document.getElementById('desktopView');
function goNew(mode){try{localStorage.setItem('dxn_selected_device_mode',mode);}catch(e){} location.href='/02-pretest-intro.html'}
function goPrevious(){location.href='/app/index.html'}
document.getElementById('desktopNewVisitor').addEventListener('click',function(){goNew('desktop')});
document.getElementById('desktopNewVisitorVisible').addEventListener('click',function(){goNew('desktop')});
document.getElementById('desktopPreviousUserVisible').addEventListener('click',goPrevious);
document.getElementById('desktopPreviousUser').addEventListener('click',goPrevious);
document.getElementById('desktopDeviceMobile').addEventListener('click',()=>{mobileView.classList.remove('hidden');desktopView.classList.add('hidden')});
document.getElementById('desktopDeviceComputer').addEventListener('click',()=>{desktopView.classList.remove('hidden');mobileView.classList.add('hidden')});
document.getElementById('mobileNewVisitor').addEventListener('click',function(){goNew('mobile')});
document.getElementById('mobileNewVisitorVisible').addEventListener('click',function(){goNew('mobile')});
document.getElementById('mobilePreviousUserVisible').addEventListener('click',goPrevious);
document.getElementById('mobilePreviousUser').addEventListener('click',goPrevious);
if(window.matchMedia('(max-width:700px)').matches){
  mobileView.classList.remove('hidden');
  desktopView.classList.add('hidden');
}else{
  mobileView.classList.add('hidden');
  desktopView.classList.remove('hidden');
}
</script>
<script src="/pwa-install.js?v=1" defer></script>
</body>
</html>
