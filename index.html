<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="512x512" href="/community-icon-512.png?v=20260922-5">
<title>مجتمع الصحة والثراء</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#eef5f1}
body{overflow:hidden;font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif}
.page{height:100svh;width:100vw;overflow:hidden;position:relative;background:#eef5f1}
.view{width:100%;height:100%}
.hidden{display:none!important}
.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;padding:0;margin:0;outline:none}
.hotspot:focus-visible{box-shadow:0 0 0 4px rgba(15,81,63,.45);border-radius:999px}

/* واجهة الحاسوب: صورة سطح المكتب المعتمدة مستقلة عن صورة الموبايل */
.desktop-view{position:relative;width:100%;height:100%;display:block;overflow:hidden;background:#dfeae5}
.desktop-backdrop{display:none}
.desktop-poster{position:absolute;inset:0;width:100%;height:100%;line-height:0;z-index:2;overflow:hidden}
.desktop-poster img{width:100%;height:100%;display:block;object-fit:cover;object-position:center top}
.desktop-brand{
  position:absolute;
  z-index:8;
  right:7%;
  top:10%;
  width:42%;
  height:48%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  pointer-events:none;
}
.desktop-brand::before{
  content:"";
  position:absolute;
  inset:-8% -6%;
  background:radial-gradient(circle at center,rgba(255,255,255,.96) 0%,rgba(255,255,255,.78) 38%,rgba(255,255,255,.34) 64%,rgba(255,255,255,0) 82%);
  z-index:-1;
}
.desktop-brand img{
  width:min(520px,100%);
  height:auto;
  max-height:68%;
  object-fit:contain;
  display:block;
  filter:drop-shadow(0 4px 10px rgba(0,70,45,.10));
}
.desktop-tagline{
  margin-top:clamp(6px,0.8vh,10px);
  text-align:center;
  direction:rtl;
  line-height:1.2;
  color:#0f513f;
  text-shadow:0 1px 2px rgba(255,255,255,.75);
  white-space:nowrap;
}
.desktop-tagline-main{
  display:block;
  font-size:clamp(22px,2.1vw,32px);
  font-weight:800;
  letter-spacing:0;
}
.desktop-tagline-sub{
  display:block;
  margin-top:clamp(3px,0.35vh,5px);
  font-size:clamp(14px,1.15vw,19px);
  font-weight:600;
}
.desktop-actions{
  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:center;
  gap:clamp(12px,1vw,18px);
  margin-top:clamp(18px,2.0vh,26px);
  pointer-events:auto;
  direction:rtl;
}
.desktop-action{
  position:static;
  width:clamp(190px,16vw,255px);
  height:clamp(68px,8vh,86px);
  border-radius:999px;
  padding:0 22px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  font-family:inherit;
  cursor:pointer;
  outline:none;
  transition:transform .15s ease,box-shadow .15s ease;
}
.desktop-action-content{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:center;
  min-width:0;
  line-height:1.1;
  text-align:right;
}
.desktop-action-title{
  display:block;
  font-size:clamp(17px,1.35vw,22px);
  font-weight:900;
  white-space:nowrap;
}
.desktop-action-sub{
  display:block;
  margin-top:6px;
  font-size:clamp(11px,.9vw,14px);
  font-weight:600;
  white-space:nowrap;
  opacity:.92;
}
.desktop-action-icon{
  width:34px;
  height:34px;
  flex:0 0 34px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.desktop-action-icon svg{
  width:100%;
  height:100%;
  display:block;
}
#desktopNewVisitor{
  background:#0f513f;
  color:#fff;
  border:2px solid #fff;
  box-shadow:0 7px 18px rgba(15,81,63,.28);
}
#desktopPreviousUser{
  background:#fff;
  color:#0f513f;
  border:2px solid #0f513f;
  box-shadow:0 7px 18px rgba(15,81,63,.16);
}
#desktopNewVisitor:hover,#desktopPreviousUser:hover{
  transform:translateY(-1px);
}
#desktopNewVisitor:hover{box-shadow:0 9px 21px rgba(15,81,63,.34)}
#desktopPreviousUser:hover{box-shadow:0 9px 21px rgba(15,81,63,.22)}
.desktop-action:focus-visible{
  box-shadow:0 0 0 4px rgba(255,255,255,.9),0 0 0 7px rgba(15,81,63,.5);
}

/* واجهة الموبايل: الصورة الأصلية كما هي */
.mobile-view{display:flex;align-items:center;justify-content:center;width:100%;height:100%;overflow:hidden}
.mobile-poster{position:relative;width:100%;height:100%;line-height:0;flex:0 0 100%;overflow:hidden}
.mobile-poster img{width:100%;height:100%;object-fit:fill;display:block}
#mobilePreviousUser{left:7.5%;bottom:13%;width:43%;height:9%}
#mobileNewVisitor{right:7%;bottom:13%;width:43%;height:9%}

@media(max-width:700px){}
</style>
<link rel="manifest" href="/manifest.json?v=20260922-5"><script src="/pwa-install.js?v=20260922-5"></script>
</head>
<body>
<main class="page">
<section id="desktopView" class="view desktop-view">
<div class="desktop-backdrop" aria-hidden="true"></div>
<div class="desktop-poster">
<img src="/desktop-home.png?v=20260918" alt="خلفية مجتمع الصحة والثراء">
<div class="desktop-brand" aria-label="مجتمع الصحة والثراء">
  <img src="/logo-full.png?v=20260920" alt="مجتمع الصحة والثراء">
  <div class="desktop-tagline" aria-label="ابدأ بخطوة. اصنع مستقبل عائلتك بنفسك.">
    <span class="desktop-tagline-main">ابدأ بخطوة</span>
    <span class="desktop-tagline-sub">اصنع مستقبل عائلتك بنفسك</span>
  </div>
  <div class="desktop-actions" aria-label="خيارات الدخول">
    <button id="desktopNewVisitor" class="desktop-action" type="button">
      <span class="desktop-action-content">
        <span class="desktop-action-title">زائر جديد</span>
        <span class="desktop-action-sub">اكتشف الفرص المناسبة لك</span>
      </span>
      <span class="desktop-action-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M31.5 7.5c-8.8 2.3-14.9 8.7-16.1 17.5 5.9-.8 10.4-3.5 13.4-8.1 1.4-2.2 2.2-5.2 2.7-9.4Z" fill="currentColor"/>
          <path d="M16.1 26.5c4.4 1.1 8.3 3.6 11.1 7.5 2.3 3.2 3.7 6.1 4.6 9.5M17.3 27.2c5.7 2.2 10.7 6.2 14.3 12.2" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
        </svg>
      </span>
    </button>
    <button id="desktopPreviousUser" class="desktop-action" type="button">
      <span class="desktop-action-content">
        <span class="desktop-action-title">مستخدم سابق</span>
        <span class="desktop-action-sub">تسجيل الدخول إلى حسابك</span>
      </span>
      <span class="desktop-action-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="15" r="8"/>
          <path d="M9 42c1.3-8.6 6.8-13 15-13s13.7 4.4 15 13H9Z"/>
        </svg>
      </span>
    </button>
  </div>
</div>
</div>
</section>
<section id="mobileView" class="view mobile-view hidden">
<div class="mobile-poster">
<img src="11.png" alt="مجتمع الصحة والثراء">
<button id="mobilePreviousUser" class="hotspot" type="button" aria-label="مستخدم سابق"></button>
<button id="mobileNewVisitor" class="hotspot" type="button" aria-label="زائر جديد"></button>
</div>
</section>
</main>
<script>
const mobileView=document.getElementById('mobileView');
const desktopView=document.getElementById('desktopView');
function goNew(mode){try{localStorage.setItem('dxn_selected_device_mode',mode);}catch(e){} location.href='/02-pretest-intro.html'}
function goPrevious(){location.href='/app/index.html'}
document.getElementById('desktopNewVisitor').addEventListener('click',function(){goNew('desktop')});
document.getElementById('desktopPreviousUser').addEventListener('click',goPrevious);
document.getElementById('mobileNewVisitor').addEventListener('click',function(){goNew('mobile')});
document.getElementById('mobilePreviousUser').addEventListener('click',goPrevious);
if(window.matchMedia('(max-width:700px)').matches){
  mobileView.classList.remove('hidden');
  desktopView.classList.add('hidden');
}else{
  mobileView.classList.add('hidden');
  desktopView.classList.remove('hidden');
}
</script>


<style id="root-global-preview-v1">
#rootPreviewLauncher{position:fixed;left:18px;bottom:18px;z-index:2147483000;direction:rtl}
#rootPreviewLauncher button{border:0;border-radius:16px;padding:11px 15px;background:#0f513f;color:#fff;font-weight:900;box-shadow:0 10px 28px rgba(0,0,0,.22);cursor:pointer}
#rootPreviewPanel{position:fixed;inset:0;z-index:2147482999;display:none;background:rgba(8,24,20,.72);backdrop-filter:blur(5px);align-items:center;justify-content:center;padding:18px;direction:rtl}
#rootPreviewPanel.show{display:flex}
#rootPreviewPanel .rps-shell{width:min(1120px,96vw);height:min(920px,94vh);background:#eef5f1;border:1px solid rgba(255,255,255,.35);border-radius:26px;box-shadow:0 30px 100px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden}
#rootPreviewPanel .rps-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 15px;background:#fff;border-bottom:1px solid #dfe9e4}
#rootPreviewPanel .rps-title{font-weight:950;color:#123b30}
#rootPreviewPanel .rps-controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#rootPreviewPanel .rps-controls button{border:1px solid #d4e2dc;background:#f6faf8;color:#17473a;border-radius:11px;min-height:38px;padding:7px 11px;font-weight:900;cursor:pointer}
#rootPreviewPanel .rps-controls button.active{background:#0f513f;color:#fff;border-color:#0f513f}
#rootPreviewPanel .rps-close{background:#fff1ef!important;color:#a32318!important;border-color:#f0c9c4!important}
#rootPreviewPanel .rps-stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto;padding:18px;background:linear-gradient(135deg,#e9f3ee,#f7faf8)}
#rootPreviewPanel .rps-device{position:relative;background:#101613;border:9px solid #101613;border-radius:38px;box-shadow:0 24px 65px rgba(0,0,0,.28);overflow:hidden;flex:0 0 auto;box-sizing:content-box}
#rootPreviewPanel .rps-device.portrait{width:390px;height:844px}
#rootPreviewPanel .rps-device.landscape{width:844px;height:390px;border-radius:30px}

@media(max-width:700px){
 #rootPreviewLauncher{left:10px;bottom:10px}
 #rootPreviewPanel{padding:8px}
 #rootPreviewPanel .rps-shell{width:100%;height:100%;border-radius:18px}
 #rootPreviewPanel .rps-stage{padding:8px}
 #rootPreviewPanel .rps-device.portrait{width:min(390px,92vw);height:min(844px,calc(100vh - 130px));box-sizing:content-box}
 #rootPreviewPanel .rps-device.landscape{width:min(844px,96vw);height:min(390px,calc(100vh - 130px));box-sizing:content-box}
}
</style>
<div id="rootPreviewLauncher"><button type="button" id="rootPreviewOpen">👁️ معاينة الموقع</button></div>
<div id="rootPreviewPanel" aria-hidden="true" role="dialog" aria-modal="true" aria-label="معاينة الموقع">
 <div class="rps-shell">
  <div class="rps-head">
   <div class="rps-title">👁️ معاينة الموقع — وضع الشرح</div>
   <div class="rps-controls">
    <button type="button" data-root-preview-mode="desktop">🖥️ كمبيوتر</button>
    <button type="button" data-root-preview-mode="portrait">📱 موبايل</button>
    <button type="button" data-root-preview-mode="landscape">📲 أفقي</button>
    <button type="button" id="rootPreviewZoomOut">➖</button>
    <button type="button" id="rootPreviewZoomReset">100%</button>
    <button type="button" id="rootPreviewZoomIn">➕</button>
    <button type="button" class="rps-close" id="rootPreviewClose">✕ إغلاق</button>
   </div>
  </div>
  <div class="rps-stage">
   <div id="rootPreviewDevice" class="rps-device portrait">
    <iframe id="rootPreviewFrame" title="معاينة نسخة الموبايل" loading="eager"></iframe>
   </div>
   <div class="rps-note">المعاينة تستخدم نافذة داخلية مستقلة؛ تصميم الصفحة الأصلي لا يتغير.</div>
  </div>
 </div>
</div>
<script id="root-global-preview-v1-script">
(function(){
 const p=new URLSearchParams(location.search),embedded=p.get('rootPreviewFrame')==='1';
 const launcher=document.getElementById('rootPreviewLauncher'),panel=document.getElementById('rootPreviewPanel'),openBtn=document.getElementById('rootPreviewOpen'),closeBtn=document.getElementById('rootPreviewClose'),device=document.getElementById('rootPreviewDevice'),frame=document.getElementById('rootPreviewFrame'),zin=document.getElementById('rootPreviewZoomIn'),zout=document.getElementById('rootPreviewZoomOut'),zreset=document.getElementById('rootPreviewZoomReset');
 if(embedded){launcher&&launcher.remove();panel&&panel.remove();return;}
 let zoom=1;
 function fit(m){
  const stage=document.querySelector('#rootPreviewPanel .rps-stage');if(!stage||!device)return;
  const sw=stage.clientWidth-36,sh=stage.clientHeight-36;
  const w=m==='landscape'?862:m==='desktop'?Math.min(1100,sw):408;
  const h=m==='landscape'?408:m==='desktop'?Math.min(760,sh):862;
  const fit=Math.min(1,sw/w,sh/h);
  device.style.transform='scale('+(fit*zoom)+')';
  if(zreset)zreset.textContent=Math.round(zoom*100)+'%';
 }
 function mode(m){
  device.classList.remove('desktop','portrait','landscape');device.classList.add(m);
  document.querySelectorAll('#rootPreviewPanel [data-root-preview-mode]').forEach(b=>b.classList.toggle('active',b.dataset.rootPreviewMode===m));
  frame.title=m==='desktop'?'معاينة نسخة الكمبيوتر':m==='landscape'?'معاينة الموبايل الأفقي':'معاينة نسخة الموبايل';
  if(!frame.src){const u=new URL(location.href);u.searchParams.set('rootPreviewFrame','1');frame.src=u.href;}
  setTimeout(()=>fit(m),120);
 }
 function show(){panel.classList.add('show');panel.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';mode('portrait')}
 function hide(){panel.classList.remove('show');panel.setAttribute('aria-hidden','true');document.body.style.overflow=''}
 openBtn&&openBtn.addEventListener('click',show);closeBtn&&closeBtn.addEventListener('click',hide);
 zin&&zin.addEventListener('click',()=>{zoom=Math.min(1.8,Math.round((zoom+.1)*100)/100);const b=document.querySelector('#rootPreviewPanel [data-root-preview-mode].active');fit(b?b.dataset.rootPreviewMode:'portrait')});
 zout&&zout.addEventListener('click',()=>{zoom=Math.max(.75,Math.round((zoom-.1)*100)/100);const b=document.querySelector('#rootPreviewPanel [data-root-preview-mode].active');fit(b?b.dataset.rootPreviewMode:'portrait')});
 zreset&&zreset.addEventListener('click',()=>{zoom=1;const b=document.querySelector('#rootPreviewPanel [data-root-preview-mode].active');fit(b?b.dataset.rootPreviewMode:'portrait')});
 document.querySelectorAll('#rootPreviewPanel [data-root-preview-mode]').forEach(b=>b.addEventListener('click',()=>mode(b.dataset.rootPreviewMode)));
 frame&&frame.addEventListener('load',()=>{const b=document.querySelector('#rootPreviewPanel [data-root-preview-mode].active');fit(b?b.dataset.rootPreviewMode:'portrait')});
 window.addEventListener('resize',()=>{const b=document.querySelector('#rootPreviewPanel [data-root-preview-mode].active');fit(b?b.dataset.rootPreviewMode:'portrait')});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&panel.classList.contains('show'))hide()});
})();
</script>
</body>
