<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=20260918">
<title>مجتمع الصحة والثراء</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#eef5f1}
body{overflow:hidden;font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif}
.page{height:100svh;width:100vw;overflow:hidden;position:relative;background:#eef5f1}
.view{width:100%;height:100%}
.hidden{display:none!important}
.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;padding:0;margin:0;outline:none;z-index:10}
.hotspot:focus-visible{box-shadow:0 0 0 4px rgba(15,81,63,.45);border-radius:999px}

/* واجهة الحاسوب: صورة سطح المكتب المعتمدة مستقلة عن صورة الموبايل */
.desktop-view{position:relative;width:100%;height:100%;display:block;overflow:hidden;background:#dfeae5}
.desktop-backdrop{display:none}
.desktop-poster{position:absolute;inset:0;width:100%;height:100%;line-height:0;z-index:2;overflow:hidden}
.desktop-poster img{width:100%;height:100%;display:block;object-fit:cover;object-position:center top}
.desktop-brand{
  position:absolute;
  z-index:8;
  right:7%;
  top:10%;
  width:42%;
  height:48%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  pointer-events:none;
}
.desktop-brand::before{
  content:"";
  position:absolute;
  inset:-8% -6%;
  background:radial-gradient(circle at center,rgba(255,255,255,.96) 0%,rgba(255,255,255,.78) 38%,rgba(255,255,255,.34) 64%,rgba(255,255,255,0) 82%);
  z-index:-1;
}
.desktop-brand img{
  width:min(520px,100%);
  height:auto;
  max-height:68%;
  object-fit:contain;
  display:block;
  filter:drop-shadow(0 4px 10px rgba(0,70,45,.10));
}
.desktop-tagline{
  margin-top:clamp(6px,0.8vh,10px);
  text-align:center;
  direction:rtl;
  line-height:1.2;
  color:#0f513f;
  text-shadow:0 1px 2px rgba(255,255,255,.75);
  white-space:nowrap;
}
.desktop-tagline-main{
  display:block;
  font-size:clamp(22px,2.1vw,32px);
  font-weight:800;
  letter-spacing:0;
}
.desktop-tagline-sub{
  display:block;
  margin-top:clamp(3px,0.35vh,5px);
  font-size:clamp(14px,1.15vw,19px);
  font-weight:600;
}
.desktop-actions{
  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:center;
  gap:clamp(8px,0.8vw,14px);
  margin-top:clamp(10px,1.1vh,15px);
  pointer-events:auto;
  direction:rtl;
}
.desktop-action{
  position:static;
  width:clamp(145px,11.5vw,185px);
  height:clamp(42px,5vh,54px);
  border:1px solid rgba(15,81,63,.55);
  border-radius:999px;
  background:linear-gradient(180deg,#17634e 0%,#0f513f 100%);
  color:#fff;
  font-family:inherit;
  font-size:clamp(16px,1.15vw,19px);
  font-weight:700;
  line-height:1;
  box-shadow:0 5px 14px rgba(15,81,63,.22),inset 0 1px 0 rgba(255,255,255,.22);
  cursor:pointer;
  outline:none;
  transition:transform .15s ease,box-shadow .15s ease,background .15s ease;
}
.desktop-action:hover{
  transform:translateY(-1px);
  box-shadow:0 7px 17px rgba(15,81,63,.28),inset 0 1px 0 rgba(255,255,255,.25);
  background:linear-gradient(180deg,#1b6e57 0%,#115b47 100%);
}
.desktop-action:focus-visible{
  box-shadow:0 0 0 4px rgba(255,255,255,.9),0 0 0 7px rgba(15,81,63,.5);
}
#desktopEmbeddedComputer,#desktopEmbeddedMobile{top:1.0%;height:5.6%;width:8.0%}
#desktopEmbeddedComputer{left:40.7%}
#desktopEmbeddedMobile{left:50.0%}

/* واجهة الموبايل: الصورة الأصلية كما هي */
.mobile-view{display:flex;align-items:center;justify-content:center}
.mobile-poster{position:relative;height:100%;max-height:100%;aspect-ratio:2 / 3;line-height:0}
.mobile-poster img{width:100%;height:100%;object-fit:contain;display:block}
#mobilePreviousUser{left:7.5%;bottom:13%;width:43%;height:9%}
#mobileNewVisitor{right:7%;bottom:13%;width:43%;height:9%}
#mobileEmbeddedComputer,#mobileEmbeddedMobile{top:1.0%;height:6.4%;width:20.5%}
#mobileEmbeddedComputer{left:29.5%}
#mobileEmbeddedMobile{left:50.0%}

@media(max-width:700px){}
</style>
<link rel="manifest" href="/manifest.json">
</head>
<body>
<main class="page">
<section id="desktopView" class="view desktop-view">
<div class="desktop-backdrop" aria-hidden="true"></div>
<div class="desktop-poster">
<img src="/desktop-home.png?v=20260918" alt="خلفية مجتمع الصحة والثراء">
<div class="desktop-brand" aria-label="مجتمع الصحة والثراء">
  <img src="/logo-full.png?v=20260920" alt="مجتمع الصحة والثراء">
  <div class="desktop-tagline" aria-label="ابدأ بخطوة. اصنع مستقبل عائلتك بنفسك.">
    <span class="desktop-tagline-main">ابدأ بخطوة</span>
    <span class="desktop-tagline-sub">اصنع مستقبل عائلتك بنفسك</span>
  </div>
  <div class="desktop-actions" aria-label="خيارات الدخول">
    <button id="desktopNewVisitor" class="desktop-action" type="button">زائر جديد</button>
    <button id="desktopPreviousUser" class="desktop-action" type="button">مستخدم سابق</button>
  </div>
</div>
<button id="desktopEmbeddedMobile" class="hotspot" type="button" aria-label="الموبايل"></button>
<button id="desktopEmbeddedComputer" class="hotspot" type="button" aria-label="الحاسوب"></button>
</div>
</section>
<section id="mobileView" class="view mobile-view hidden">
<div class="mobile-poster">
<img src="11.png" alt="مجتمع الصحة والثراء">
<button id="mobilePreviousUser" class="hotspot" type="button" aria-label="مستخدم سابق"></button>
<button id="mobileNewVisitor" class="hotspot" type="button" aria-label="زائر جديد"></button>
<button id="mobileEmbeddedMobile" class="hotspot" type="button" aria-label="الموبايل"></button>
<button id="mobileEmbeddedComputer" class="hotspot" type="button" aria-label="الحاسوب"></button>
</div>
</section>
</main>
<script>
const mobileView=document.getElementById('mobileView');
const desktopView=document.getElementById('desktopView');
function goNew(){location.href='/02-pretest-intro.html'}
function goPrevious(){location.href='/app/index.html'}
function setDeviceView(mode){
  const mobile=mode==='mobile';
  mobileView.classList.toggle('hidden',!mobile);
  desktopView.classList.toggle('hidden',mobile);
}
document.getElementById('desktopNewVisitor').addEventListener('click',goNew);
document.getElementById('desktopPreviousUser').addEventListener('click',goPrevious);
document.getElementById('mobileNewVisitor').addEventListener('click',goNew);
document.getElementById('mobilePreviousUser').addEventListener('click',goPrevious);
document.getElementById('desktopEmbeddedMobile').addEventListener('click',()=>setDeviceView('mobile'));
document.getElementById('desktopEmbeddedComputer').addEventListener('click',()=>setDeviceView('desktop'));
document.getElementById('mobileEmbeddedMobile').addEventListener('click',()=>setDeviceView('mobile'));
document.getElementById('mobileEmbeddedComputer').addEventListener('click',()=>setDeviceView('desktop'));
setDeviceView(window.matchMedia('(max-width:700px)').matches?'mobile':'desktop');
</script>
<script src="/pwa-install.js?v=1" defer></script>
</body>
</html>
