</head><body><div id="app" class="app"></div><div id="toast" class="toast hidden"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
function validateDXNAge18(birthDate){
  if(!birthDate) return {ok:false, message:'يرجى إدخال تاريخ التولد.'};
  const d = new Date(birthDate + 'T00:00:00');
  if(Number.isNaN(d.getTime())) return {ok:false, message:'تاريخ التولد غير صحيح.'};
  const now = new Date();
  let age = now.getFullYear() - d.getFullYear();
  const m = now.getMonth() - d.getMonth();
  if(m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
  return age >= 18
    ? {ok:true, age}
    : {ok:false, age, message:'⚠️ عذرًا، يشترط أن يكون عمر المتقدم 18 سنة أو أكثر للتسجيل.'};
}

const C=window.DXN_CONFIG||{};let sb=null,token=localStorage.getItem('dxn_session')||'',me=null,role=null,data=null,tab='home',membershipRequests=[],trainingData={lessons:[],my_progress:[],member_progress:[]},trainingWatch={player:null,timer:null,lessonId:null,videoId:null,invalid:false};
const $=id=>document.getElementById(id); const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2600)}
function ready(){return C.SUPABASE_URL&&C.SUPABASE_ANON_KEY&&!C.SUPABASE_URL.includes('YOUR-PROJECT')&&!C.SUPABASE_ANON_KEY.includes('YOUR_')}
async function rpc(fn,args){if(!sb)throw Error('لم يتم إعداد Supabase');const {data:d,error}=await sb.rpc(fn,args);if(error)throw error;return d}
async function boot(){if(!ready()){renderSetup();return}sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);if(!token){renderLogin();return}try{const d=await rpc('bootstrap',{p_token:token});data=d;role=d.role;me=(d.members||[])[0]||null;try{trainingData=await rpc('get_training_data',{p_token:token})}catch(e){trainingData={lessons:[],my_progress:[],member_progress:[]}}if(role==='leader'){try{membershipRequests=await rpc('leader_dxn_membership_requests',{p_token:token})}catch(e){membershipRequests=[]}}render()}catch(e){localStorage.removeItem('dxn_session');token='';renderLogin();toast(e.message||'انتهت الجلسة')}}
function renderSetup(){ $('app').innerHTML=`<div class="login card"><img class="logo" src="logo.png"><h1>مجتمع الصحة والثراء</h1><h2>إعداد النسخة Online</h2><p class="muted">النسخة جاهزة للربط بقاعدة بيانات Supabase. افتح ملف <b>config.js</b> وضع رابط المشروع وPublic anon key، ثم ارفع المجلد إلى Vercel أو أي استضافة ثابتة.</p><div class="card leaderbox"><b>الخطوات:</b><ol><li>أنشئ مشروع Supabase.</li><li>نفّذ ملف schema.sql بالكامل في SQL Editor.</li><li>ضع بيانات المشروع في config.js.</li><li>ارفع المجلد إلى Vercel.</li></ol></div></div>`}
function renderLogin(){ $('app').innerHTML=`<div class="view-switch" id="viewSwitch"></div><div class="login card"><div style="text-align:center"><img class="logo" src="logo.png"><h1>مجتمع الصحة والثراء</h1><p class="muted">دخول موحد من أي جهاز</p></div><label>نوع الدخول</label><select id="role"><option value="member">👤 دخول العضو</option><option value="leader">👑 دخول القائد</option></select><label>رقم العضوية / رمز القائد</label><input id="loginNo" placeholder="مثال: 820426486 أو LEADER"><label>رمز الدخول PIN</label><input id="pin" type="text" autocomplete="current-password" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="PIN"><button class="primary" style="width:100%" onclick="login()">🔐 دخول</button><button style="width:100%;margin-top:8px" onclick="renderRegister()">📝 طلب عضوية DXN</button><button style="width:100%;margin-top:8px" onclick="renderIdea()">✨ اكتشف رحلة الصحة والثراء والحرية</button><p class="muted small">بيانات القائد التجريبية بعد تنفيذ schema.sql: LEADER / 123456 — غيّرها فوراً.</p></div>`}
async function renderRegister(){
  $('app').innerHTML=`<div class="view-switch" id="viewSwitch"></div><div class="login card" style="max-width:700px;text-align:right"><div style="text-align:center"><img class="logo" src="logo.png"><h1>📝 طلب عضوية DXN</h1><p class="muted">هذه الخطوة مخصصة لمن لا يمتلك عضوية DXN بعد. العضوية مجانية، ولا توجد شروط للبدء سوى أن يكون العمر 18 سنة أو أكثر.</p></div><div class="card" style="background:#f7fbf9"><b>ℹ️ قبل إرسال الطلب</b><p class="muted" style="line-height:1.9">سيتم إرسال بياناتك إلى فريقنا للتواصل معك وإكمال إجراءات العضوية. تأكد من صحة البيانات، والبريد الإلكتروني ضروري.</p></div><label>الاسم الكامل *</label><input id="dxnFullName" placeholder="اكتب الاسم الكامل"><label>بلد السكن *</label><input id="dxnResidenceCountry" placeholder="مثال: العراق"><label>بلد التولد (الجنسية) *</label><input id="dxnBirthCountry" placeholder="مثال: العراق"><label>تاريخ التولد — اليوم والشهر والسنة *</label><input id="dxnBirthDate" type="date"><label>رقم الموبايل *</label><input id="dxnMobile" type="tel" inputmode="tel" placeholder="رقم الموبايل"><label>البريد الإلكتروني * <span class="muted">(ضروري)</span></label><input id="dxnEmail" type="email" autocomplete="email" placeholder="example@email.com"><label>العنوان *</label><textarea id="dxnAddress" placeholder="العنوان بالتفصيل"></textarea><label>رقم الهوية أو جواز السفر *</label><input id="dxnIdNumber" placeholder="أدخل رقم الهوية أو جواز السفر"><label>اسم العضو الذي دلك على المشروع *</label><input id="dxnSponsorName" placeholder="اكتب اسم العضو الذي عرّفك بالمشروع"><div class="card" style="background:#fff8e8;border:1px solid #f0d58a;margin-top:10px"><b>⚠️ التعهد</b><p style="line-height:1.9;margin:8px 0">أتعهد بأنني لا أمتلك حاليًا عضوية DXN فعّالة، وأن المعلومات التي قدمتها صحيحة، وأوافق على استخدام هذه البيانات لإجراءات التسجيل والتواصل معي.</p><label style="display:flex;gap:8px;align-items:center;font-weight:700"><input id="dxnNoActiveMembership" type="checkbox" style="width:auto;margin:0"> أقرّ وأتعهد بما ورد أعلاه *</label><label style="display:flex;gap:8px;align-items:center;font-weight:700;margin-top:8px"><input id="dxnAgeConfirm" type="checkbox" style="width:auto;margin:0"> أؤكد أن عمري 18 سنة أو أكثر وأن البيانات التي أدخلتها صحيحة. *</label></div><button class="primary" style="width:100%;margin-top:10px" onclick="submitDXNMembershipRequest()">📩 إرسال طلب العضوية</button><button style="width:100%;margin-top:8px" onclick="renderLogin()">↩️ العودة</button></div>`;
  renderViewSwitch();
  const bd=document.getElementById('dxnBirthDate');
  if(bd){ const d=new Date(); d.setFullYear(d.getFullYear()-18); bd.max=d.toISOString().slice(0,10); }
}
async function submitDXNMembershipRequest(){
  const full_name=$('dxnFullName').value.trim(), residence_country=$('dxnResidenceCountry').value.trim(), birth_country=$('dxnBirthCountry').value.trim(), birth_date=$('dxnBirthDate').value, mobile=$('dxnMobile').value.trim(), email=$('dxnEmail').value.trim(), address=$('dxnAddress').value.trim(), id_number=$('dxnIdNumber').value.trim(), sponsor_name=$('dxnSponsorName').value.trim();
  if(!full_name||!residence_country||!birth_country||!birth_date||!mobile||!email||!address||!id_number||!sponsor_name)return toast('يرجى إكمال جميع البيانات المطلوبة.');
  if(!$('dxnNoActiveMembership').checked)return toast('يجب الإقرار بعدم امتلاك عضوية DXN فعّالة.');
  if(!/^\S+@\S+\.\S+$/.test(email))return toast('أدخل بريدًا إلكترونيًا صحيحًا.');
  if(!$('dxnAgeConfirm').checked)return toast('يجب تأكيد أن العمر 18 سنة أو أكثر.');
  const d=new Date(birth_date+'T00:00:00'); const now=new Date(); let age=now.getFullYear()-d.getFullYear(); const md=now.getMonth()-d.getMonth(); if(md<0||(md===0&&now.getDate()<d.getDate()))age--;
  if(isNaN(d)||age<18)return toast('يشترط أن يكون العمر 18 سنة أو أكثر.');
  try{
await rpc('submit_dxn_membership_request',{p_full_name:full_name,p_residence_country:residence_country,p_birth_country:birth_country,p_birth_date:birth_date,p_mobile:mobile,p_email:email,p_address:address,p_id_or_passport:id_number,p_sponsor_name:sponsor_name,p_age_18_confirmed:$('dxnAgeConfirm').checked,p_no_active_membership_confirmed:$('dxnNoActiveMembership').checked});$('app').innerHTML=`<div class="login card"><div style="text-align:center"><img class="logo" src="logo.png"><h1>تم إرسال الطلب ✅</h1><p style="line-height:2">وصلت بيانات طلب العضوية بنجاح. سيتواصل معك الفريق لإكمال إجراءات عضوية DXN.</p><p class="muted">العضوية مجانية، ولا توجد شروط للبدء سوى أن يكون العمر 18 سنة أو أكثر، وألا تكون لديك عضوية DXN فعّالة.</p><button class="primary" style="width:100%" onclick="renderLogin()">🔐 العودة</button></div></div>`}catch(e){toast(e.message||'تعذر إرسال الطلب')}
}

async function selfRegister(){
  const name=$('regName').value.trim(), no=$('regNo').value.trim(), team=$('regTeam').value||null, pin=$('regPin').value, pin2=$('regPin2').value;
  if(!name)return toast('أدخل الاسم الكامل.');
  if(!/^\d{9}$/.test(no))return toast('رقم العضوية يجب أن يكون 9 أرقام بالضبط.');
  if(pin.length<4)return toast('PIN يجب أن يكون 4 أحرف أو أرقام على الأقل.');
  if(pin!==pin2)return toast('تأكيد PIN غير مطابق.');
  try{await rpc('self_register',{p_member_no:no,p_name:name,p_pin:pin,p_team:team});$('app').innerHTML=`<div class="login card"><div style="text-align:center"><img class="logo" src="logo.png"><h1>تم إرسال الطلب ✅</h1><p>تم تسجيل بياناتك بنجاح، لكن الحساب بانتظار موافقة القائد.</p><p class="muted">بعد اعتماد القائد يمكنك الدخول باستخدام رقم العضوية وPIN الذي اخترته.</p><button class="primary" style="width:100%" onclick="renderLogin()">🔐 العودة لتسجيل الدخول</button></div></div>`}catch(e){toast(e.message||'تعذر إرسال طلب العضوية')}
}
function renderViewSwitch(){
  const el=document.getElementById('viewSwitch');
  const saved=localStorage.getItem('dxn_view_mode');
  const mode=saved || (window.innerWidth>=800 ? 'desktop' : 'mobile');
  document.body.classList.toggle('desktop-mode',mode==='desktop');
  document.body.classList.toggle('mobile-mode',mode==='mobile');
  if(!el)return;
  el.innerHTML=`<button class="${mode==='mobile'?'active':''}" onclick="setViewMode('mobile')">📱 واجهة الموبايل</button><button class="${mode==='desktop'?'active':''}" onclick="setViewMode('desktop')">🖥️ واجهة الحاسوب</button>`;
}
function setViewMode(mode){
  localStorage.setItem('dxn_view_mode',mode);
  document.body.classList.remove('mobile-mode','desktop-mode');
  document.body.classList.add(mode==='desktop'?'desktop-mode':'mobile-mode');
  renderViewSwitch();
}
async function login(){try{const r=await rpc('login',{p_login_no:$('loginNo').value.trim(),p_pin:$('pin').value.trim()});token=r.token;localStorage.setItem('dxn_session',token);await boot()}catch(e){toast(e.message||'تعذر الدخول')}}
async function logout(){try{await rpc('logout',{p_token:token})}catch{}localStorage.removeItem('dxn_session');token='';me=null;data=null;tab='home';renderLogin()}
function switchTab(next){if(next==='training'&&!canAccessTraining())return;tab=next;try{render()}catch(e){console.error(e);toast('تعذر فتح القسم: '+(e.message||e))}}

function home(){const teams=data.teams||[], members=data.members||[], ch=data.challenges||[];const totalStars=members.reduce((a,x)=>a+Number(x.stars||0),0);const teamStarsById={};members.forEach(m=>{if(m.active===false)return;const key=m.team_id??m.teamId??m.team_name;if(key==null)return;const k=String(key);teamStarsById[k]=(teamStarsById[k]||0)+Number(m.stars||0)});const maxTeamStars=teams.filter(t=>t.active!==false).reduce((mx,t)=>Math.max(mx,Number(teamStarsById[String(t.id)]??teamStarsById[String(t.name)]??0)),0);return `<div class="stats"><div class="stat"><div class="emoji">👥</div><div class="k">الأعضاء</div><b>${role==='leader'?members.length:1}</b></div><div class="stat"><div class="emoji">🏆</div><div class="k">الفرق</div><b>${teams.length}</b></div><div class="stat"><div class="emoji">⭐</div><div class="k">${role==='leader'?'أعلى رصيد فريق':'نجومي'}</div><b>${role==='leader'?maxTeamStars:(me?.stars||0)}</b></div><div class="stat"><div class="emoji">🎯</div><div class="k">إجمالي التحديات</div><b>${ch.length}</b></div></div><div class="card"><div class="title">🎯 تحديات النمو والتوسع</div>${ch.slice(0,1).map(c=>challengeCard(c)).join('')}</div><div class="card"><div class="title">👥 إنجازات الفرق</div>${teams.map(t=>{const ts=Number(teamStarsById[String(t.id)]||teamStarsById[String(t.name)]||0);return `<div class="teambar"><b>${esc(t.name)}</b><span>⭐ ${ts} · 🎯 ${t.approved_challenges||0} إنجاز</span></div>`}).join('')||'<div class="empty">لا توجد فرق بعد.</div>'}</div>`}

function openChallengeSubmission(id){const c=(data.challenges||[]).find(x=>String(x.id)===String(id));if(!c)return;const title=(c.title||'')+' '+(c.type||'');const isConsume=/استهلاك|منتج/i.test(title);const isContact=/تواصل|استقطاب/i.test(title);const today=new Date().toISOString().slice(0,10);const body=isConsume?`<label>📦 اسم المنتج</label><input id="ev_product" placeholder="مثال: قهوة لينجزي"><label>📅 تاريخ الاستهلاك</label><input id="ev_date" type="date" value="${today}"><label>📝 ملاحظة</label><textarea id="ev_note" placeholder="ملاحظة مختصرة (اختياري)"></textarea><label>📷 صورة الإثبات <span class="muted">(حتى 5 MB)</span></label><input id="ev_file" type="file" accept="image/jpeg,image/png,image/webp" onchange="previewEvidence()"><div id="ev_preview"></div>`:isContact?`<label>👤 اسم الشخص المحتمل</label><input id="ev_person" placeholder="اسم الشخص"><label>🌍 البلد</label><input id="ev_country" placeholder="مثال: العراق"><label>📱 طريقة التواصل</label><select id="ev_method"><option>واتساب</option><option>اتصال هاتفي</option><option>لقاء مباشر</option><option>فيسبوك</option><option>أخرى</option></select><label>📅 تاريخ التواصل</label><input id="ev_date" type="date" value="${today}"><label>📝 ماذا حدث في التواصل؟</label><textarea id="ev_note" placeholder="اكتب نتيجة التواصل باختصار"></textarea><label>📷 صورة الإثبات <span class="muted">(حتى 5 MB)</span></label><input id="ev_file" type="file" accept="image/jpeg,image/png,image/webp" onchange="previewEvidence()"><div id="ev_preview"></div>`:`<label>📝 وصف الإنجاز</label><textarea id="ev_note" placeholder="اكتب وصفاً مختصراً لما أنجزته..."></textarea><label>📷 صورة الإثبات <span class="muted">(حتى 5 MB، إن وجدت)</span></label><input id="ev_file" type="file" accept="image/jpeg,image/png,image/webp" onchange="previewEvidence()"><div id="ev_preview"></div>`;const modal=document.createElement('div');modal.id='evidenceModal';modal.innerHTML=`<div class="evidence-backdrop" onclick="closeEvidenceModal()"></div><div class="evidence- async function openEvidence(path){try{if(!path)return toast('لا توجد صورة إثبات.');const fd=new FormData();fd.append('action','view');fd.append('token',token);fd.append('path',path);const endpoint=`${C.SUPABASE_URL}/functions/v1/challenge-evidence`;const res=await fetch(endpoint,{method:'POST',headers:{'apikey':C.SUPABASE_ANON_KEY||''},body:fd});let out={};try{out=await res.json()}catch{}if(!res.ok||!out.ok)throw new Error(out.error||`تعذر فتح صورة الإثبات (${res.status})`);window.open(out.url,'_blank','noopener');}catch(e){toast(e.message||'تعذر فتح صورة الإثبات')}}

function trainings(){

  if(!canAccessTraining())return `<div class="card"><div class="title">🔒 التدريب للأعضاء والقائد</div><p class="muted">هذا القسم متاح للعضو صاحب رقم عضوية DXN وللقائد.</p></div>`;

function youtubeEmbed(url){
  const s=String(url||'').trim();
  let id='';
  const m=s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{6,})/i);
  if(m)id=m[1];
  return id?`https://www.youtube.com/embed/${id}?cc_load_policy=1&cc_lang_pref=ar`:'';
}
function startTrainingLesson(id){

  const done=new Set(progress.filter(p=>p.completed).map(p=>{const z=lessons.find(x=>String(x.id)===String(p.lesson_id));return z?Number(z.lesson_no):0;}));
  const highest=lessons.filter(x=>done.has(Number(x.lesson_no))).reduce((m,x)=>Math.max(m,Number(x.lesson_no)),0);
  if(Number(l.lesson_no)>highest+1)return toast('أكمل التدريب السابق أولاً.');

    </div>

  </div>`;
  document.body.appendChild(modal);

  if(role==='member'){
    rpc('update_training_progress',{p_token:token,p_lesson:id,p_watch_percent:0,p_current_seconds:0,p_duration_seconds:0,p_completed:false})
      .then(()=>refresh()).catch(()=>{});
  }
  waitForYouTubePlayer(l);
}
function waitForYouTubePlayer(l){
  let tries=0;
  const ready=setInterval(()=>{
    tries++;
    if(window.YT&&YT.Player){
      clearInterval(ready);
      const iframeId='trainingYoutubePlayer';
      const player=new YT.Player(iframeId,{
        videoId:trainingWatch.videoId,
        playerVars:{rel:0,cc_load_policy:1,cc_lang_pref:'ar',playsinline:1,disablekb:0},
        events:{
          onReady:()=>beginTrainingWatch(player,l.id),
          onStateChange:(e)=>{
            if(e.data===YT.PlayerState.ENDED) finishTrainingWatch(l.id,player);
          }
        }
      });
    }else if(tries>80)clearInterval(ready);
  },250);
}
function beginTrainingWatch(player,lessonId){
  trainingWatch.player=player;
  trainingWatch.timer=setInterval(()=>sampleTrainingWatch(lessonId),2000);
  updateTrainingWatchStatus('▶️ الفيديو جاهز — ابدأ المشاهدة من البداية.');
}
async function sampleTrainingWatch(lessonId){
  const p=trainingWatch.player;
  if(!p||!p.getDuration)return;
  const duration=Number(p.getDuration()||0), current=Number(p.getCurrentTime()||0);
  if(!duration)return;
  const state=p.getPlayerState();
  const pct=Math.min(100,current/duration*100);
  if(state===YT.PlayerState.PLAYING){
    // The server validates the accumulated watched time and detects large forward jumps.
    try{
      const result=await rpc('update_training_progress',{
        p_token:token,p_lesson:lessonId,p_watch_percent:pct,p_current_seconds:current,
        p_duration_seconds:duration,p_completed:false
      });
      if(result?.seek_detected){
        trainingWatch.invalid=true;
        updateTrainingWatchStatus('⚠️ تم اكتشاف محاولة تقديم يدوي. يجب إعادة التدريب من البداية.',true);
        clearInterval(trainingWatch.timer); trainingWatch.timer=null;
      }else{
        updateTrainingWatchStatus(`▶️ تمت مشاهدة ${pct.toFixed(0)}% — أكمل حتى النهاية.`);
      }
    }catch(e){}
  }
}
async function finishTrainingWatch(lessonId,player){
  if(trainingWatch.invalid)return;
  const duration=Number(player.getDuration()||0), current=Number(player.getCurrentTime()||0);
  if(!duration)return;
  try{
    const result=await rpc('update_training_progress',{
      p_token:token,p_lesson:lessonId,p_watch_percent:100,p_current_seconds:current,
      p_duration_seconds:duration,p_completed:true
    });
    if(result?.completed){
      updateTrainingWatchStatus('🎉 اكتملت المشاهدة 100% — تم فتح التدريب التالي.',false,true);
      if(trainingWatch.timer){clearInterval(trainingWatch.timer);trainingWatch.timer=null;}
      setTimeout(async()=>{closeTraining();await refresh()},1200);
    }else{
      trainingWatch.invalid=true;
      updateTrainingWatchStatus('⚠️ لم يتم اعتماد الإكمال لأن المشاهدة الكاملة لم تُثبت. أعد التدريب من البداية.',true);
    }
  }catch(e){toast(e.message||'تعذر اعتماد إكمال التدريب')}
}
function updateTrainingWatchStatus(msg,bad=false,done=false){
  const el=$('trainingWatchStatus'); if(!el)return;
  el.innerHTML=`<b>${msg}</b>${bad?`<div style="margin-top:10px"><button class="danger" onclick="restartTrainingWatch()">🔄 إعادة التدريب من البداية</button></div>`:done?'':`<div class="muted" style="margin-top:5px">لن يفتح التدريب التالي إلا بعد المشاهدة الكاملة.</div>`}`;
}
async function restartTrainingWatch(){
  const id=trainingWatch.lessonId;

function closeTraining(){
  if(trainingWatch.timer){clearInterval(trainingWatch.timer);trainingWatch.timer=null;}

 <div class="card"><div class="title">📚 متابعة التدريبات</div><p class="muted">يمكنك من هنا متابعة تقدم الأعضاء في التدريبات المضافة.</p>${(trainingData.member_progress||[]).map(m=>{const total=Number(m.total_lessons||0),done=Number(m.completed_lessons||0),pct=total?Math.round(done*100/total):0;return `<div class="row"><div><b>👤 ${esc(m.name)}</b><div class="muted">🪪 ${esc(m.member_no)} · 📚 ${done}/${total} · 📊 ${pct}%</div><div class="muted">${m.current_lesson_no?`▶️ التدريب الحالي: ${m.current_lesson_no}`:'🏁 لم يبدأ بعد'}${m.last_watched_at?` · 🕐 آخر نشاط: ${fmt(m.last_watched_at)}`:''}</div></div><span class="stars">${pct}%</span></div>`}).join('')||'<div class="empty">لا يوجد تقدم تدريبي مسجل بعد.</div>'}</div>
 <div class="card"><div class="title">🕘 آخر التحركات المسجلة</div>${allActivity.slice(0,20).map(x=>{const member=x.member_name||x.name||x.member_no||'عضو';const title=x.challenge_title||x.title||x._kind;const status=x.status||'pending';return `<div class="activity-item"><b>${esc(x._kind)} — ${esc(title)}</b><div class="muted">👤 ${esc(member)} · الحالة: ${esc(status)} · ${fmt(x.created_at)}</div></div>`}).join('')||'<div class="empty">لا توجد تحركات مسجلة في البيانات الحالية.</div>'}<p class="muted small">هذه القائمة تعتمد على السجلات التي ترسلها قاعدة البيانات حاليًا. لإظهار سجل تدقيق كامل لكل تسجيل دخول وتعديل وحذف وتجميد واعتماد، نضيف في الخطوة التالية سجل نشاط دائم في قاعدة البيانات.</p></div>
 <div class="card"><button onclick="changePin()">🔐 تغيير PIN القائد</button> <button class="danger" onclick="logout()">🚪 تسجيل الخروج</button></div>`
}
function approvalCard(x,isQuestion){const id=x.id||x.submission_id||x.answer_id;const title=x.challenge_title||x.title||((data.challenges||[]).find(c=>String(c.id)===String(x.challenge_id))?.title)||(isQuestion?'إجابة سؤال':'إنجاز تحدي');const linkedMember=(data.members||[]).find(m=>String(m.id)===String(x.member_id));const memberName=x.member_name||x.name||linkedMember?.name||'';const memberNo=x.member_no||linkedMember?.member_no||'';const memberLabel=memberName?(memberNo?`${memberName} · 🪪 ${memberNo}`:memberName):(memberNo?`🪪 ${memberNo}`:'عضو');const proof=x.proof||x.answer||x.description||'';const stars=x.stars??x.reward_stars??x.challenge_stars??1;const d=x.evidence_details||{};const extra=!isQuestion&&Object.keys(d).length?`<div class="answer" style="margin-top:7px">${d.product?`📦 المنتج: ${esc(d.product)}<br>`:''}${d.person?`👤 الشخص المحتمل: ${esc(d.person)}<br>`:''}${d.country?`🌍 البلد: ${esc(d.country)}<br>`:''}${d.method?`📱 الطريقة: ${esc(d.method)}<br>`:''}${d.date?`📅 التاريخ: ${esc(d.date)}<br>`:''}${d.note?`📝 ${esc(d.note)}`:''}</div>`:'';const evidence=x.evidence_path?`<button onclick="openEvidence('${esc(x.evidence_path)}')">📷 عرض الإثبات</button>`:'';return `<div class="row pending"><div><b>${esc(title)}</b><div class="muted">👤 ${esc(memberLabel)} · ⭐${esc(stars)}</div>${extra}${proof?`<div class="answer" style="margin-top:7px">${esc(proof)}</div>`:''}</div><div class="actions">${evidence}<button class="primary" onclick="decide('${id}',${isQuestion},true)">✅ اعتماد</button><button class="danger" onclick="decide('${id}',${isQuestion},false)">❌ رفض</button></div></div>`}
function challengeAdminCard(c){const deleted=!!c.deleted_at;const frozen=!c.active&&!deleted;return `<div class="challenge"><div class="row"><div><h3>${esc(c.title)} <span class="stars">⭐${c.stars}</span></h3><div class="muted">${esc(c.type)} · ${esc(c.repeat_rule)} ${deleted?'· 🗑️ محذوف':frozen?'· ❄️ مجمد':'· ✅ نشط'}</div></div><div class="actions"><button onclick="openChallengeEditor('${c.id}')">✏️ تعديل</button><button class="gold" onclick="setChallengeStars('${c.id}')">⭐ النقاط</button>${!deleted?`<button onclick="toggleChallengeFreeze('${c.id}',${frozen})">${frozen?'🔥 إلغاء التجميد':'❄️ تجميد'}</button><button class="danger" onclick="deleteChallenge('${c.id}')">🗑️ حذف</button>`:''}</div></div><p>${esc(c.description)}</p></div>`}
function openChallengeEditor(id){const c=(data.challenges||[]).find(x=>String(x.id)===String(id));const title=prompt('اسم التحدي:',c?.title||'');if(title===null)return;const description=prompt('وصف التحدي:',c?.description||'');if(description===null)return;const type=prompt('نوع التحدي (مثال: الاستقطاب):',c?.type||'عام');if(type===null)return;const stars=prompt('عدد النجوم:',String(c?.stars??10));if(stars===null)return;const repeat=prompt('قاعدة التكرار (يومي/أسبوعي/شهري/مرة واحدة):',c?.repeat_rule||'مرة واحدة');if(repeat===null)return;saveChallenge(id,{title,description,type,stars:Number(stars),repeat_rule:repeat})}
async function saveChallenge(id,item){try{if(!item.title.trim())return toast('اسم التحدي مطلوب.');if(!Number.isInteger(item.stars)||item.stars<0)return toast('عدد النجوم يجب أن يكون رقماً صحيحاً غير سالب.');if(id){await rpc('update_challenge',{p_token:token,p_challenge:id,p_type:item.type.trim(),p_title:item.title.trim(),p_description:item.description.trim(),p_stars:item.stars,p_repeat_rule:item.repeat_rule.trim()});toast('تم تعديل التحدي.')}else{await rpc('create_challenge',{p_token:token,p_type:item.type.trim(),p_title:item.title.trim(),p_description:item.description.trim(),p_stars:item.stars,p_repeat_rule:item.repeat_rule.trim()});toast('تم إضافة التحدي.')}await refresh()}catch(e){toast(e.message||'تعذر حفظ التحدي')}}
async function setChallengeStars(id){const c=(data.challenges||[]).find(x=>String(x.id)===String(id));if(!c)return;const v=prompt('عدد النجوم الجديد:',String(c.stars));if(v===null)return;const n=Number(v);if(!Number.isInteger(n)||n<0)return toast('أدخل عدد نجوم صحيحاً غير سالب.');try{await rpc('set_challenge_stars',{p_token:token,p_challenge:id,p_stars:n});toast('تم تغيير نقاط التحدي.');await refresh()}catch(e){toast(e.message||'تعذر تغيير النقاط')}}
async function toggleChallengeFreeze(id,isFrozen){try{await rpc('toggle_challenge_freeze',{p_token:token,p_challenge:id,p_frozen:!isFrozen});toast(isFrozen?'تم إلغاء تجميد التحدي.':'تم تجميد التحدي.');await refresh()}catch(e){toast(e.message||'تعذر تغيير حالة التحدي')}}
async function deleteChallenge(id){const c=(data.challenges||[]).find(x=>String(x.id)===String(id));if(!c)return;if(!confirm(`هل تريد حذف التحدي «${c.title}»؟\nسيختفي عن الأعضاء، وتبقى الإنجازات السابقة محفوظة.`))return;try{await rpc('delete_challenge',{p_token:token,p_challenge:id});toast('تم حذف التحدي.');await refresh()}catch(e){toast(e.message||'تعذر حذف التحدي')}}
async function approveRegistration(id){if(!confirm('اعتماد طلب العضوية وتفعيل الحساب؟'))return;try{await rpc('approve_member_registration',{p_token:token,p_member:id});toast('تم اعتماد العضوية وتفعيل الحساب.');await refresh()}catch(e){toast(e.message||'تعذر اعتماد الطلب')}}
async function rejectRegistration(id){if(!confirm('رفض طلب العضوية وحذفه؟'))return;try{await rpc('reject_member_registration',{p_token:token,p_member:id});toast('تم رفض الطلب.');await refresh()}catch(e){toast(e.message||'تعذر رفض الطلب')}}
function createMemberForm(){
 const no=prompt('رقم العضوية:'); if(no===null)return;
 const name=prompt('اسم العضو:'); if(name===null)return;
 const pin=prompt('PIN المؤقت (4 أحرف/أرقام على الأقل):'); if(pin===null)return;
 const activeTeams=(data.teams||[]).filter(t=>t.active!==false); const teamList=activeTeams.map((t,i)=>`${i+1}. ${t.name}`).join('\n');
 const choice=prompt(`اختر رقم الفريق:
${teamList}\n\nاتركه فارغاً إذا كان العضو بلا فريق.`,''); if(choice===null)return;
 const idx=choice.trim()===''?-1:Number(choice)-1; const team=(idx>=0&&activeTeams[idx])?activeTeams[idx].id:null; if(choice.trim()!==''&&!team)return toast('رقم الفريق غير صحيح.');
 createMemberValues(no,name,pin,team);
}
async function createMemberValues(no,name,pin,team){try{await rpc('create_member',{p_token:token,p_member_no:no,p_name:name,p_pin:pin,p_team:team||null});toast('تم إنشاء العضو.');await refresh()}catch(e){toast(e.message||'تعذر إنشاء العضو')}}
function createTeamForm(){const n=prompt('اسم الفريق الجديد:');if(n===null)return;createTeamValues(n)}
async function createTeamValues(n){try{if(!n.trim())return;await rpc('create_team',{p_token:token,p_name:n});toast('تم إنشاء الفريق.');await refresh()}catch(e){toast(e.message||'تعذر إنشاء الفريق')}}
async function editTeam(id){const t=(data.teams||[]).find(x=>String(x.id)===String(id));if(!t)return;const n=prompt('اسم الفريق:',t.name||'');if(n===null)return;try{await rpc('update_team',{p_token:token,p_team:id,p_name:n});toast('تم تعديل الفريق.');await refresh()}catch(e){toast(e.message||'تعذر تعديل الفريق')}}
async function toggleTeam(id,active){const msg=active?'تفعيل الفريق؟':'تعطيل الفريق؟\nسيبقى السجل التاريخي محفوظاً.';if(!confirm(msg))return;try{await rpc('toggle_team_active',{p_token:token,p_team:id,p_active:active});toast(active?'تم تفعيل الفريق.':'تم تعطيل الفريق.');await refresh()}catch(e){toast(e.message||'تعذر تغيير حالة الفريق')}}
async function editMember(id){const m=(data.members||[]).find(x=>String(x.id)===String(id));if(!m)return;const no=prompt('رقم العضوية:',m.member_no||'');if(no===null)return;const name=prompt('اسم العضو:',m.name||'');if(name===null)return;const activeTeams=(data.teams||[]).filter(t=>t.active!==false);const teamList=activeTeams.map((t,i)=>`${i+1}. ${t.name}`).join('\n');const currentIdx=activeTeams.findIndex(t=>String(t.id)===String(m.team_id));const choice=prompt(`الفريق الحالي: ${m.team_name||'بدون فريق'}\n\nالفرق المتاحة:\n${teamList}\n\nأدخل رقم الفريق أو اتركه فارغاً:`,currentIdx>=0?String(currentIdx+1):'');if(choice===null)return;const idx=choice.trim()===''?-1:Number(choice)-1;const team=(idx>=0&&activeTeams[idx])?activeTeams[idx].id:null;if(choice.trim()!==''&&!team)return toast('رقم الفريق غير صحيح.');try{await rpc('update_member',{p_token:token,p_member:id,p_member_no:no,p_name:name,p_team:team});toast('تم تعديل بيانات العضو.');await refresh()}catch(e){toast(e.message||'تعذر تعديل العضو')}}
async function toggleMember(id,active){const msg=active?'تفعيل العضو؟':'تعطيل العضو؟\nسيبقى حسابه وإنجازاته محفوظة لكن لن يظهر كعضو نشط.';if(!confirm(msg))return;try{await rpc('toggle_member_active',{p_token:token,p_member:id,p_active:active});toast(active?'تم تفعيل العضو.':'تم تعطيل العضو.');await refresh()}catch(e){toast(e.message||'تعذر تغيير حالة العضو')}}
async function deleteMember(id){const m=(data.members||[]).find(x=>String(x.id)===String(id));if(!m)return;const msg=`حذف العضو «${m.name||''}» حذفًا نهائيًا؟\n\nسيتم حذف حسابه وعضويته وجميع بياناته التجريبية المرتبطة به، بما فيها الإنجازات والنجوم والسجل.\n\n⚠️ هذا الإجراء نهائي ولا يمكن التراجع عنه.`;if(!confirm(msg))return;try{await rpc('delete_member_permanently',{p_token:token,p_member:id});toast('تم حذف العضو نهائيًا.');await refresh()}catch(e){toast(e.message||'تعذر حذف العضو نهائيًا')}}
async function changeMemberPin(id){const p=prompt('PIN الجديد للعضو (4 أحرف/أرقام على الأقل):');if(p===null)return;try{await rpc('change_member_pin',{p_token:token,p_member:id,p_new_pin:p});toast('تم تغيير PIN العضو.')}catch(e){toast(e.message||'تعذر تغيير PIN العضو')}}
async function saveQuestions(){try{const items=[1,2,3,4,5].map(n=>({question_no:n,text:$('qtxt'+n).value.trim(),category:$('qcat'+n).value.trim()}));if(items.some(x=>!x.text))return toast('أكمل الأسئلة الخمسة.');await rpc('save_month_questions',{p_token:token,p_items:items});toast('تم تثبيت الأسئلة الخمسة للشهر.');await refresh()}catch(e){toast(e.message||'تعذر حفظ الأسئلة')}}
async function changePin(){const p=prompt('PIN الجديد:');if(!p)return;try{await rpc('change_pin',{p_token:token,p_new_pin:p});toast('تم تغيير PIN.')}catch(e){toast(e.message||'تعذر تغيير PIN')}}
async function decide(id,q,ok){try{await rpc(q?'approve_question':'approve_challenge',{p_token:token,[q?'p_answer':'p_submission']:id,p_ok:ok});toast(ok?'تم الاعتماد وإضافة النجوم.':'تم الرفض.');await refresh()}catch(e){toast(e.message||'تعذر التنفيذ')}}
async function setPoints(id){const v=prompt('أدخل نقاط DXN الفعلية لهذا العضو هذا الشهر:','100');if(v===null)return;try{await rpc('set_monthly_points',{p_token:token,p_member:id,p_points:Number(v)});if(Number(v)>=100&&confirm('العضو حقق 100 نقطة. هل تضيف مكافأة ⭐100؟'))await rpc('award_monthly_target',{p_token:token,p_member:id});toast('تم تحديث التارجت.');await refresh()}catch(e){toast(e.message||'تعذر تحديث التارجت')}}
async function refresh(){const d=await rpc('bootstrap',{p_token:token});data=d;role=d.role;me=(d.members||[]).find(x=>role==='member')||null;try{trainingData=await rpc('get_training_data',{p_token:token})}catch(e){trainingData={lessons:[],my_progress:[],member_progress:[]}}if(role==='leader'){try{membershipRequests=await rpc('leader_dxn_membership_requests',{p_token:token})}catch(e){membershipRequests=[]}}render()}
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{}); boot();
window.switchTab=switchTab;window.openTrainingManager=openTrainingManager;window.restartTrainingWatch=restartTrainingWatch;window.startTrainingLesson=startTrainingLesson;window.completeTrainingLesson=completeTrainingLesson;window.saveTrainingFromManager=saveTrainingFromManager;window.editTrainingLesson=editTrainingLesson;window.toggleTrainingLesson=toggleTrainingLesson;window.closeTraining=closeTraining;window.closeTrainingManager=closeTrainingManager;window.challenges=challenges;window.teams=teams;window.leader=leader;window.approvalCard=approvalCard;window.renderIdea=renderIdea;window.trainings=trainings;window.approveDXNMembershipRequest=approveDXNMembershipRequest;window.rejectDXNMembershipRequest=rejectDXNMembershipRequest;window.openDXNMembershipRequests=openDXNMembershipRequests;window.openApprovedDXNMembershipRequests=openApprovedDXNMembershipRequests;window.backToLeaderDashboard=backToLeaderDashboard;window.addEventListener('resize',()=>{if(!localStorage.getItem('dxn_view_mode'))renderViewSwitch()});
</script>
