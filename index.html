<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f513f"><link rel="manifest" href="manifest.json"><title>لعبة تحديات DXN</title><style>
:root{--bg:#eef5f1;--card:#fff;--text:#182234;--muted:#667085;--line:#e2e8e5;--green:#0f513f;--green2:#176b55;--gold:#d99a18;--red:#b42318;--blue:#e8f1ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}.app{max-width:980px;margin:auto;padding:14px 14px 85px}.top{background:linear-gradient(135deg,#0c4738,#1a725b);color:white;border-radius:0 0 36px 36px;padding:18px 18px 25px;text-align:center;box-shadow:0 8px 28px #0001}.logo{width:120px;height:120px;border-radius:50%;object-fit:cover;box-shadow:0 8px 24px #0003;border:4px solid #fff}.top h1{margin:8px 0 4px;font-size:30px}.top p{margin:0;font-size:14px;opacity:.88}.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0}.tab{flex:1;min-width:115px;border:0;border-radius:16px;padding:13px;background:#fff;color:var(--text);font-weight:900}.tab.active{background:var(--green);color:#fff}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}.stat .emoji{font-size:28px}.stat .k{color:var(--muted);font-weight:800}.stat b{font-size:27px;display:block}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.title{font-weight:950;font-size:19px}.muted{color:var(--muted);font-size:13px}.stars{color:var(--gold);font-weight:950}.badge{display:inline-block;background:#eef8f2;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900}.actions{display:flex;gap:7px;flex-wrap:wrap}button,input,textarea,select{font:inherit}button{border:0;border-radius:12px;padding:11px 14px;min-height:44px;font-weight:900;cursor:pointer;background:#eef3f2;color:var(--text)}button.primary{background:var(--green);color:#fff}button.gold{background:#fff4d5;color:#7a5300}button.danger{background:#fee4e2;color:#9f2118}button:disabled{opacity:.5;cursor:not-allowed}input,textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;margin:5px 0 10px;background:#fff}textarea{min-height:100px}.hidden{display:none!important}.challenge{border:1px solid #eadcb0;border-radius:18px;padding:14px;margin-top:10px;background:#fffdf5}.challenge h3{margin:0 0 5px}.question{border:1px solid #eadcb0;border-radius:18px;padding:14px;margin-top:10px;background:#fffdf5}.answer{background:#f7f9fb;border-radius:13px;padding:12px;white-space:pre-wrap}.ok{background:#edf9f0;border-color:#c5e4cc}.pending{background:#fff7df}.login{max-width:480px;margin:40px auto}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;gap:5px;padding:8px;z-index:20}.nav button{flex:1;max-width:180px;background:transparent}.small{font-size:11px}.empty{text-align:center;color:var(--muted);padding:20px}.toast{position:fixed;top:15px;left:15px;right:15px;background:#102a22;color:#fff;padding:12px;border-radius:13px;text-align:center;z-index:99}.teambar{display:flex;justify-content:space-between;gap:10px;padding:10px 0}.leaderbox{border:2px dashed #d7e2dd}

/* اختيار واجهة العرض */
.view-switch{display:flex;gap:8px;justify-content:center;margin:12px 0;position:sticky;top:8px;z-index:25}
.view-switch button{min-width:130px;border:1px solid var(--line);background:#fff}
.view-switch button.active{background:var(--green);color:#fff}
body.desktop-mode .app{max-width:1400px;padding:18px 28px 30px}
body.desktop-mode .top{border-radius:0 0 28px 28px;padding:20px 28px 28px;display:flex;align-items:center;gap:22px;text-align:right}
body.desktop-mode .top .logo{width:92px;height:92px}
body.desktop-mode .top h1{margin:0 0 5px;font-size:32px}
body.desktop-mode .tabs{position:sticky;top:0;z-index:24;background:var(--bg);padding:10px 0;margin:0}
body.desktop-mode .tabs .tab{min-width:150px}
body.desktop-mode .stats{grid-template-columns:repeat(4,1fr);gap:14px}
body.desktop-mode .card{padding:20px;margin-top:14px}
body.desktop-mode .nav{position:static;border:0;background:transparent;padding:12px 0;gap:10px}
body.desktop-mode .nav button{background:#fff;border:1px solid var(--line);border-radius:14px;max-width:none}
body.desktop-mode .login{max-width:620px;margin:50px auto}
body.desktop-mode .challenge,.desktop-mode .question{padding:18px}
body.mobile-mode .view-switch button{min-width:120px}
@media (min-width:800px){body:not(.mobile-mode) .app{max-width:1400px;padding:18px 28px 30px}body:not(.mobile-mode) .top{border-radius:0 0 28px 28px;padding:20px 28px 28px;display:flex;align-items:center;gap:22px;text-align:right}body:not(.mobile-mode) .top .logo{width:92px;height:92px}body:not(.mobile-mode) .top h1{margin:0 0 5px;font-size:32px}body:not(.mobile-mode) .stats{grid-template-columns:repeat(4,1fr)}body:not(.mobile-mode) .nav{position:static;border:0;background:transparent;padding:12px 0}body:not(.mobile-mode) .nav button{background:#fff;border:1px solid var(--line);border-radius:14px;max-width:none}}
</style></head><body><div id="app" class="app"></div><div id="toast" class="toast hidden"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const C=window.DXN_CONFIG||{};let sb=null,token=localStorage.getItem('dxn_session')||'',me=null,role=null,data=null,tab='home';
const $=id=>document.getElementById(id); const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2600)}
function ready(){return C.SUPABASE_URL&&C.SUPABASE_ANON_KEY&&!C.SUPABASE_URL.includes('YOUR-PROJECT')&&!C.SUPABASE_ANON_KEY.includes('YOUR_')}
async function rpc(fn,args){if(!sb)throw Error('لم يتم إعداد Supabase');const {data:d,error}=await sb.rpc(fn,args);if(error)throw error;return d}
async function boot(){if(!ready()){renderSetup();return}sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);if(!token){renderLogin();return}try{const d=await rpc('bootstrap',{p_token:token});data=d;role=d.role;me=(d.members||[])[0]||null;render()}catch(e){localStorage.removeItem('dxn_session');token='';renderLogin();toast(e.message||'انتهت الجلسة')}}
function renderSetup(){ $('app').innerHTML=`<div class="login card"><img class="logo" src="logo.png"><h1>لعبة تحديات DXN</h1><h2>إعداد النسخة Online</h2><p class="muted">النسخة جاهزة للربط بقاعدة بيانات Supabase. افتح ملف <b>config.js</b> وضع رابط المشروع وPublic anon key، ثم ارفع المجلد إلى Vercel أو أي استضافة ثابتة.</p><div class="card leaderbox"><b>الخطوات:</b><ol><li>أنشئ مشروع Supabase.</li><li>نفّذ ملف schema.sql بالكامل في SQL Editor.</li><li>ضع بيانات المشروع في config.js.</li><li>ارفع المجلد إلى Vercel.</li></ol></div></div>`}
function renderLogin(){ $('app').innerHTML=`<div class="view-switch" id="viewSwitch"></div><div class="login card"><div style="text-align:center"><img class="logo" src="logo.png"><h1>لعبة تحديات DXN</h1><p class="muted">دخول موحد من أي جهاز</p></div><label>نوع الدخول</label><select id="role"><option value="member">👤 دخول العضو</option><option value="leader">👑 دخول القائد</option></select><label>رقم العضوية / رمز القائد</label><input id="loginNo" placeholder="مثال: 820426486 أو LEADER"><label>رمز الدخول PIN</label><input id="pin" type="text" autocomplete="current-password" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="PIN"><button class="primary" style="width:100%" onclick="login()">🔐 دخول</button><p class="muted small">بيانات القائد التجريبية بعد تنفيذ schema.sql: LEADER / 123456 — غيّرها فوراً.</p></div>`}
renderViewSwitch();
renderViewSwitch();
async function login(){try{const r=await rpc('login',{p_login_no:$('loginNo').value.trim(),p_pin:$('pin').value.trim()});token=r.token;localStorage.setItem('dxn_session',token);await boot()}catch(e){toast(e.message||'تعذر الدخول')}}
async function logout(){try{await rpc('logout',{p_token:token})}catch{}localStorage.removeItem('dxn_session');token='';me=null;data=null;renderLogin()}
function nav(){return `<div class="nav"><button onclick="tab='home';render()">🏠<br><span class="small">الرئيسية</span></button><button onclick="tab='ch';render()">🎯<br><span class="small">التحديات</span></button><button onclick="tab='teams';render()">👥<br><span class="small">الأعضاء والفرق</span></button><button onclick="tab='leader';render()">👑<br><span class="small">القائد</span></button></div>`}
function render(){if(role==='leader'&&!me)me=null;let html=`<div class="view-switch" id="viewSwitch"></div><div class="top"><img src="logo.png" class="logo"><h1>لعبة تحديات DXN</h1><p>⭐ نجوم للنشاط والإنجاز — منافسة فردية وبين الفرق</p></div>`;html+=`<div class="tabs"><button class="tab ${tab==='home'?'active':''}" onclick="tab='home';render()">الرئيسية 📊</button><button class="tab ${tab==='ch'?'active':''}" onclick="tab='ch';render()">التحديات 🎯</button><button class="tab ${tab==='teams'?'active':''}" onclick="tab='teams';render()">الأعضاء والفرق 👥</button>${role==='leader'?`<button class="tab ${tab==='leader'?'active':''}" onclick="tab='leader';render()">إدارة القائد 👑</button>`:''}</div>`;html+=tab==='home'?home():tab==='ch'?challenges():tab==='teams'?teams():leader();html+=nav();$('app').innerHTML=html;renderViewSwitch()}
function home(){const teams=data.teams||[], members=data.members||[], ch=data.challenges||[];const totalStars=members.reduce((a,x)=>a+Number(x.stars||0),0);return `<div class="stats"><div class="stat"><div class="emoji">👥</div><div class="k">الأعضاء</div><b>${role==='leader'?members.length:1}</b></div><div class="stat"><div class="emoji">🏆</div><div class="k">الفرق</div><b>${teams.length}</b></div><div class="stat"><div class="emoji">⭐</div><div class="k">نجوم الفريق</div><b>${role==='leader'?totalStars:(me?.stars||0)}</b></div><div class="stat"><div class="emoji">🎯</div><div class="k">إجمالي التحديات</div><b>${ch.length}</b></div></div><div class="card"><div class="title">🎯 تحديات النمو والتوسع</div>${ch.slice(0,1).map(c=>challengeCard(c)).join('')}</div><div class="card"><div class="title">👥 إنجازات الفرق</div>${teams.map(t=>`<div class="teambar"><b>${esc(t.name)}</b><span>⭐ ${t.stars} · 🎯 ${t.approved_challenges} إنجاز</span></div>`).join('')||'<div class="empty">لا توجد فرق بعد.</div>'}</div>`}
function challengeCard(c){const mine=(data.my_submissions||[]).filter(x=>String(x.challenge_id||x.challengeId)===String(c.id));const pending=mine.some(x=>x.status==='pending');return `<div class="challenge"><h3>${esc(c.title)} <span class="stars">⭐${c.stars}</span></h3><div class="muted">${esc(c.type)} · ${esc(c.repeat_rule)}</div><p>${esc(c.description)}</p>${role==='member'?`<textarea id="proof_${c.id}" placeholder="اكتب وصفاً مختصراً لما أنجزته..."></textarea><button class="primary" ${pending?'disabled':''} onclick="submitChallenge('${c.id}')">${pending?'⏳ بانتظار اعتماد القائد':'✅ أنجزت التحدي وإرسال الإنجاز'}</button>`:''}</div>`}
async function submitChallenge(id){try{const p=$('proof_'+id).value.trim();if(!p)return toast('اكتب وصف الإنجاز أولاً.');await rpc('submit_challenge',{p_token:token,p_challenge:id,p_proof:p});toast('تم إرسال الإنجاز للقائد.');await refresh()}catch(e){toast(e.message||'تعذر إرسال الإنجاز')}}
function challenges(){return `<div class="card"><div class="title">🎯 التحديات الأساسية</div><p class="muted">التحدي لا يختفي بعد الإنجاز. التحديات المتكررة يمكن إنجازها مرة أخرى وفق قاعدتها، والنجوم لا تُضاف إلا بعد اعتماد القائد.</p>${(data.challenges||[]).map(challengeCard).join('')}</div>${role==='member'?questions():''}`}
function questions(){const ans=data.my_answers||[];return `<div class="card"><div class="title">❓ أسئلة الشهر</div><p class="muted">خمسة أسئلة ثابتة طوال الشهر. كل عضو يجيب عن كل سؤال مرة واحدة فقط. بعد الإجابة يصبح السؤال مغلقاً ولا يظهر سؤال جديد حتى الشهر التالي.</p>${(data.questions||[]).map(q=>{const a=ans.find(x=>String(x.question_id)===String(q.id));return `<div class="question ${a?'ok':''}"><h3>${esc(q.question_no)}. ${esc(q.text)}</h3><div class="muted">${esc(q.category)} · ⭐1</div>${a?`<div class="answer"><b>إجابتك:</b><br>${esc(a.answer)}<br><span class="small">${a.status==='approved'?'✅ معتمدة — ⭐1':a.status==='pending'?'⏳ بانتظار اعتماد القائد':'❌ مرفوضة'}</span></div>`:`<textarea id="qa_${q.id}" placeholder="اكتب إجابتك..."></textarea><button class="primary" onclick="submitQuestion('${q.id}')">⭐1 · إرسال الإجابة للقائد</button>`}</div>`}).join('')}</div>`}
async function submitQuestion(id){try{const a=$('qa_'+id).value.trim();if(!a)return toast('اكتب الإجابة أولاً.');await rpc('submit_question',{p_token:token,p_question:id,p_answer:a});toast('تم إرسال الإجابة للقائد.');await refresh()}catch(e){toast(e.message||'تعذر إرسال الإجابة')}}
function teams(){return `<div class="card"><div class="title">🏆 ترتيب الفرق</div>${(data.teams||[]).map((t,i)=>`<div class="row"><div><b>#${i+1} ${esc(t.name)}</b><div class="muted">👥 ${t.members} · 🎯 ${t.approved_challenges} إنجاز</div></div><span class="stars">⭐ ${t.stars}</span></div>`).join('')}</div><div class="card"><div class="title">⭐ المتصدرون</div>${(data.members||[]).map((m,i)=>`<div class="row"><div><b>#${i+1} ${esc(m.name)}</b><div class="muted">${esc(m.team_name||'بدون فريق')} · 🪪 ${esc(m.member_no)}</div></div><span class="stars">⭐ ${m.stars}</span></div>`).join('')}</div>`}
function leader(){const subs=(data.my_submissions||[]).filter(x=>x.status==='pending'&&x.challenge_id);const qa=(data.my_answers||[]).filter(x=>x.status==='pending'&&x.question_id);return `<div class="card leaderbox"><div class="title">👑 لوحة القائد</div><p class="muted">اعتمد الإنجاز لإضافة النجوم. رفضه لا يضيف أي نجوم.</p><h3>🎯 إنجازات التحديات المعلقة (${subs.length})</h3>${subs.map(x=>approvalCard(x,false)).join('')||'<div class="empty">لا توجد طلبات تحديات.</div>'}<h3>❓ إجابات الأسئلة المعلقة (${qa.length})</h3>${qa.map(x=>approvalCard(x,true)).join('')||'<div class="empty">لا توجد إجابات معلقة.</div>'}</div><div class="card"><div class="title">👤 إضافة عضو جديد</div><input id="newNo" placeholder="رقم العضوية"><input id="newName" placeholder="اسم العضو"><input id="newPin" type="text" autocomplete="new-password" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="PIN مؤقت"><select id="newTeam">${(data.teams||[]).map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select><button class="primary" onclick="createMember()">➕ إضافة العضو</button></div><div class="card"><div class="title">🏆 إضافة فريق</div><input id="newTeamName" placeholder="اسم الفريق"><button onclick="createTeam()">➕ إنشاء فريق</button></div><div class="card"><div class="title">❓ تثبيت أسئلة الشهر</div><p class="muted">يمكنك تغيير الأسئلة الخمسة للشهر الحالي. بعد حفظها تصبح ثابتة للأعضاء، وكل عضو يجيب عن كل سؤال مرة واحدة فقط.</p>${[1,2,3,4,5].map(n=>{const q=(data.questions||[]).find(x=>Number(x.question_no)===n);return `<input id="qtxt${n}" value="${esc(q?.text||'')}" placeholder="السؤال ${n}"><input id="qcat${n}" value="${esc(q?.category||'الوعي والتفاعل')}" placeholder="التصنيف">`}).join('')}<button class="primary" onclick="saveQuestions()">💾 حفظ الأسئلة الخمسة</button></div><div class="card"><div class="title">📅 التارجت الشهري</div><p class="muted">سجّل نقاط DXN الفعلية. عند بلوغ 100 يمكن إضافة مكافأة ⭐100 مرة واحدة للشهر.</p>${(data.members||[]).map(m=>`<div class="row"><div><b>${esc(m.name)}</b><div class="muted">${esc(m.member_no)} · ⭐${m.stars}</div></div><button onclick="setPoints('${m.id}')">تحديث التارجت</button></div>`).join('')}</div><div class="card"><button onclick="changePin()">🔐 تغيير PIN القائد</button> <button class="danger" onclick="logout()">تسجيل الخروج</button></div>`}
async function createMember(){try{await rpc('create_member',{p_token:token,p_member_no:$('newNo').value,p_name:$('newName').value,p_pin:$('newPin').value,p_team:$('newTeam').value});toast('تم إنشاء العضو.');await refresh()}catch(e){toast(e.message||'تعذر إنشاء العضو')}}
async function createTeam(){try{const n=prompt('اسم الفريق الجديد:');if(!n)return;await rpc('create_team',{p_token:token,p_name:n});toast('تم إنشاء الفريق.');await refresh()}catch(e){toast(e.message||'تعذر إنشاء الفريق')}}
async function saveQuestions(){try{const items=[1,2,3,4,5].map(n=>({question_no:n,text:$('qtxt'+n).value.trim(),category:$('qcat'+n).value.trim()}));if(items.some(x=>!x.text))return toast('أكمل الأسئلة الخمسة.');await rpc('save_month_questions',{p_token:token,p_items:items});toast('تم تثبيت الأسئلة الخمسة للشهر.');await refresh()}catch(e){toast(e.message||'تعذر حفظ الأسئلة')}}
async function changePin(){const p=prompt('PIN الجديد:');if(!p)return;try{await rpc('change_pin',{p_token:token,p_new_pin:p});toast('تم تغيير PIN.')}catch(e){toast(e.message||'تعذر تغيير PIN')}}
async function decide(id,q,ok){try{await rpc(q?'approve_question':'approve_challenge',{p_token:token,[q?'p_answer':'p_submission']:id,p_ok:ok});toast(ok?'تم الاعتماد وإضافة النجوم.':'تم الرفض.');await refresh()}catch(e){toast(e.message||'تعذر التنفيذ')}}
async function setPoints(id){const v=prompt('أدخل نقاط DXN الفعلية لهذا العضو هذا الشهر:','100');if(v===null)return;try{await rpc('set_monthly_points',{p_token:token,p_member:id,p_points:Number(v)});if(Number(v)>=100&&confirm('العضو حقق 100 نقطة. هل تضيف مكافأة ⭐100؟'))await rpc('award_monthly_target',{p_token:token,p_member:id});toast('تم تحديث التارجت.');await refresh()}catch(e){toast(e.message||'تعذر تحديث التارجت')}}
async function refresh(){const d=await rpc('bootstrap',{p_token:token});data=d;role=d.role;me=(d.members||[]).find(x=>role==='member')||null;render()}
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{}); boot();
window.addEventListener('resize',()=>{if(!localStorage.getItem('dxn_view_mode'))renderViewSwitch()});
</script></body></html>
