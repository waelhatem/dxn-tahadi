<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مجتمع الصحة والثراء</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#eef5f1}
body{overflow:hidden;font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif}
.device-bar{height:57px;display:flex;justify-content:center;align-items:center;gap:8px;padding:8px 12px;background:rgba(238,245,241,.96);backdrop-filter:blur(8px);border-bottom:1px solid rgba(15,81,63,.12);flex:0 0 57px}
.device-btn{border:1px solid rgba(15,81,63,.22);background:#fff;color:#17372d;border-radius:999px;padding:9px 18px;font:800 14px/1 "Tajawal","Segoe UI",Tahoma,Arial,sans-serif;cursor:pointer;transition:.2s;min-width:130px}
.device-btn.active{background:#0f513f;color:#fff;border-color:#0f513f;box-shadow:0 6px 14px rgba(15,81,63,.16)}
.page{height:calc(100svh - 57px);min-height:0;display:flex;align-items:center;justify-content:center;padding:0;overflow:hidden}
.poster{position:relative;height:min(calc(100svh - 65px), 150vw);width:auto;max-width:calc(100vw - 16px);aspect-ratio:2 / 3;line-height:0;transition:height .2s ease,width .2s ease;overflow:hidden}
.poster img{display:block;width:100%;height:100%;object-fit:contain;image-rendering:auto}
.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;padding:0;margin:0;outline:none;z-index:5}
.hotspot:focus-visible{box-shadow:0 0 0 4px rgba(15,81,63,.45);border-radius:999px}
#previousUser{left:7.5%;bottom:13.0%;width:43%;height:9%}
#newVisitor{right:7.0%;bottom:13.0%;width:43%;height:9%}
body.mobile-preview .poster{height:min(calc(100svh - 65px), 150vw);max-width:min(390px,calc(100vw - 16px));aspect-ratio:2 / 3}
body.mobile-preview .poster img{object-fit:contain}
body.desktop-preview .page{height:calc(100svh - 57px);width:100vw}
body.desktop-preview .poster{width:100vw;height:calc(100svh - 57px);max-width:none;aspect-ratio:auto}
body.desktop-preview .poster img{width:100%;height:100%;object-fit:cover;object-position:center center}
@media(max-width:700px){
  body.desktop-preview .poster{width:100vw;height:calc(100svh - 57px);max-width:none}
}
</style>
</head>
<body class="desktop-preview">
<nav class="device-bar" aria-label="معاينة الجهاز">
  <button id="mobilePreview" class="device-btn" type="button" aria-pressed="false">📱 الموبايل</button>
  <button id="desktopPreview" class="device-btn active" type="button" aria-pressed="true">🖥️ الحاسوب</button>
</nav>
<main class="page">
  <div class="poster">
    <img src="11.png" alt="مجتمع الصحة والثراء">
    <button id="previousUser" class="hotspot" aria-label="مستخدم سابق"></button>
    <button id="newVisitor" class="hotspot" aria-label="زائر جديد"></button>
  </div>
</main>
<script>
const mobileBtn=document.getElementById("mobilePreview");
const desktopBtn=document.getElementById("desktopPreview");
function setPreview(mode){
  const mobile=mode==="mobile";
  document.body.classList.toggle("mobile-preview",mobile);
  document.body.classList.toggle("desktop-preview",!mobile);
  mobileBtn.classList.toggle("active",mobile);
  desktopBtn.classList.toggle("active",!mobile);
  mobileBtn.setAttribute("aria-pressed",String(mobile));
  desktopBtn.setAttribute("aria-pressed",String(!mobile));
}
mobileBtn.addEventListener("click",()=>setPreview("mobile"));
desktopBtn.addEventListener("click",()=>setPreview("desktop"));
document.getElementById("newVisitor").addEventListener("click",()=>{location.href="/02-pretest-intro.html"});
document.getElementById("previousUser").addEventListener("click",()=>{location.href="/app/index.html"});
</script>
</body>
</html>
