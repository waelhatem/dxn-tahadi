<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#073c2d"><title>عداد الاستغفار</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:#082f25}body{overflow-x:hidden}.app{min-height:100vh;background:linear-gradient(180deg,#174a3a 0%,#d9c49a 55%,#8b7655 100%);position:relative;color:#fff}.sky{position:absolute;inset:0;background:radial-gradient(circle at 50% 31%,#ffe9bd 0 7%,transparent 8%),linear-gradient(#7899a0 0 31%,#d8bd91 55%,#756249 100%);opacity:.9}.mosque{position:absolute;inset:18% 0 0;opacity:.28;background:radial-gradient(ellipse at 50% 66%,#fff 0 8%,transparent 8.5%),radial-gradient(ellipse at 22% 57%,#fff 0 5%,transparent 5.5%),radial-gradient(ellipse at 78% 57%,#fff 0 5%,transparent 5.5%),linear-gradient(90deg,transparent 18%,#fff 18% 21%,transparent 21% 79%,#fff 79% 82%,transparent 82%)}.app:after{content:"";position:absolute;inset:0;background:linear-gradient(#001c1430,#001c1420 45%,#00130c65);pointer-events:none}.content{position:relative;z-index:2;max-width:520px;margin:auto;padding:16px 16px 28px}.top{display:flex;justify-content:space-between}.icon{width:54px;height:54px;border-radius:50%;border:2px solid #d9b45f;background:#0b3d30dd;color:#fff;font-size:25px}.title{text-align:center;margin:24px 0 8px;text-shadow:0 3px 8px #0007}.title h1{margin:0;color:#063d2d;font-size:45px}.title p{color:#073b2e;font-size:22px;font-weight:700;margin:9px 0}.counter{width:min(74vw,310px);aspect-ratio:1;margin:10px auto 14px;border-radius:50%;border:8px solid #d7ae55;background:radial-gradient(circle at 35% 25%,#155f49,#063729 72%);box-shadow:0 14px 30px #0008,inset 0 0 35px #0008;display:flex;flex-direction:column;align-items:center;justify-content:center}.number{font-size:78px;font-weight:900}.label{font-size:20px;font-weight:700;margin-top:8px}.tap{display:block;width:min(82vw,350px);height:104px;margin:0 auto 18px;border:6px solid #d9b45f;border-radius:55px;background:linear-gradient(145deg,#14a96f,#00633f);color:white;font-size:29px;font-weight:900;box-shadow:0 12px 25px #0008,inset 0 2px 5px #fff5}.tap:active{transform:scale(.96)}.goalbox{background:#faf1dcf2;color:#17261f;border:3px solid #d6ad59;border-radius:22px;padding:14px 16px;margin-bottom:13px}.goalrow{display:flex;justify-content:space-between;font-size:18px;font-weight:800}.progress{height:15px;background:#dfd3b9;border-radius:20px;overflow:hidden;margin-top:9px}.bar{height:100%;width:0;background:#079b63;transition:.25s}.percent{text-align:left;font-size:15px;margin-top:4px}.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.preset,.action{border:2px solid #d8b15f;border-radius:18px;background:#faf1dcf5;color:#18271f;font-weight:900;padding:10px 3px;font-family:inherit}.preset.active{background:#087c55;color:#fff}.preset small{display:block;font-size:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}.action{min-height:52px;font-size:16px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:#073c2d;border:1px solid #d7ae55;border-radius:13px;padding:10px 18px;opacity:0;transition:.2s;z-index:9}.toast.show{opacity:1;transform:translate(-50%,0)}.modal{position:fixed;inset:0;background:#001b14aa;display:none;place-items:center;padding:20px;z-index:10}.modal.show{display:grid}.card{width:100%;max-width:390px;background:#f8efd9;color:#183027;border:3px solid #d5ad5b;border-radius:24px;padding:20px}.stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #d8c9a8}.close{width:100%;margin-top:15px;padding:12px;border:0;border-radius:14px;background:#087c55;color:#fff;font:700 17px Tahoma}
</style></head><body><div class="app"><div class="sky"></div><div class="mosque"></div><main class="content">
<div class="top"><button class="icon" id="settings">⚙️</button><button class="icon" id="statsBtn">▥</button></div>
<section class="title"><h1>الاستغفار</h1><p>أستغفر الله وأتوب إليه</p></section>
<section class="counter"><div class="number" id="count">0</div><div class="label">عدد الاستغفارات</div></section>
<button class="tap" id="tap">☝️ أستغفر الله</button>
<section class="goalbox"><div class="goalrow"><span>الهدف الحالي</span><span><b id="goal">500</b> استغفار</span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="percent" id="percent">0%</div></section>
<div class="presets"><button class="preset" data-goal="100">100<small>استغفار</small></button><button class="preset active" data-goal="500">500<small>استغفار</small></button><button class="preset" data-goal="1000">1000<small>استغفار</small></button><button class="preset" data-goal="0">بدون هدف<small>∞</small></button></div>
<div class="actions"><button class="action" id="reset">↻ تصفير العداد</button><button class="action" id="history">▥ الإحصائيات</button></div>
</main><div class="toast" id="toast"></div><div class="modal" id="modal"><div class="card"><h2>إحصائيات الاستغفار</h2><div class="stat"><span>الإجمالي</span><b id="totalStat">0</b></div><div class="stat"><span>الجلسات</span><b id="sessionsStat">0</b></div><div class="stat"><span>الهدف</span><b id="goalStat">500</b></div><div class="stat"><span>الإنجاز</span><b id="percentStat">0%</b></div><button class="close" id="close">إغلاق</button></div></div></div>
<script>
const K="istighfar_v2",d={count:0,total:0,sessions:0,goal:500};let s={...d,...JSON.parse(localStorage.getItem(K)||"{}")};const $=x=>document.getElementById(x);
function save(){localStorage.setItem(K,JSON.stringify(s))}
function render(){count.textContent=s.count.toLocaleString("ar-EG");goal.textContent=s.goal?s.goal.toLocaleString("ar-EG"):"∞";let p=s.goal?Math.min(100,Math.round(s.count/s.goal*100)):0;bar.style.width=p+"%";percent.textContent=s.goal?p+"%":"بدون هدف";document.querySelectorAll(".preset").forEach(b=>b.classList.toggle("active",+b.dataset.goal===s.goal))}
function toast(t){toastEl.textContent=t;toastEl.classList.add("show");setTimeout(()=>toastEl.classList.remove("show"),800)}
const toastEl=$("toast");
$("tap").onclick=()=>{if(s.count===0)s.sessions++;s.count++;s.total++;save();render();if(navigator.vibrate)navigator.vibrate(12)};
$("reset").onclick=()=>{if(confirm("هل تريد تصفير عداد الجلسة الحالية؟")){s.count=0;save();render();toast("تم التصفير")}};
document.querySelectorAll(".preset").forEach(b=>b.onclick=()=>{s.goal=+b.dataset.goal;save();render();toast("تم تغيير الهدف")});
function stats(){$("totalStat").textContent=s.total.toLocaleString("ar-EG");$("sessionsStat").textContent=s.sessions.toLocaleString("ar-EG");$("goalStat").textContent=s.goal?s.goal.toLocaleString("ar-EG"):"بدون هدف";$("percentStat").textContent=s.goal?Math.min(100,Math.round(s.count/s.goal*100))+"%":"—";$("modal").classList.add("show")}
$("history").onclick=stats;$("statsBtn").onclick=stats;$("close").onclick=()=>modal.classList.remove("show");$("modal").onclick=e=>{if(e.target.id==="modal")modal.classList.remove("show")};$("settings").onclick=()=>toast("اختر الهدف من الأزرار أدناه");render();
</script></body></html>
