<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>مجتمع الصحة والثراء — قبل أن تبدأ</title>
<!-- V4: clean desktop background image; mobile original preserved -->
<style>
:root{--green:#0f513f;--green2:#176b55}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef5f1;font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif}
.page{width:100vw;height:100svh;display:grid;place-items:center;overflow:hidden}
.scene{position:relative;width:min(100vw,66.6667svh);height:min(150svw,100svh);aspect-ratio:2/3;overflow:hidden;background:#fff}
.scene-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center}
.readability{position:absolute;right:0;top:0;bottom:0;width:52%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.02) 18%,rgba(7,39,29,.11) 70%,rgba(7,39,29,.22));filter:blur(2px);pointer-events:none}
.text-col{position:absolute;right:2.8%;top:3.8%;width:55.5%;height:92%;display:flex;flex-direction:column;align-items:flex-start;color:#fff;text-shadow:0 2px 2px rgba(0,0,0,.82),0 4px 12px rgba(55,55,55,.60),0 0 3px rgba(65,65,65,.38);z-index:3}
.brand{width:100%;text-align:right}
.logo{width:14%;min-width:58px;max-width:90px;aspect-ratio:1;object-fit:contain;margin:0 0 3px auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.brand h1{margin:0;color:#fff;font-size:clamp(20px,2.55vw,31px);font-weight:950;line-height:1.08}
.brand p{margin:.35rem 0 0;color:#fff;font-size:clamp(9px,1.05vw,13px);font-weight:800}
.headline{margin-top:2.1%;text-align:right;width:100%}
.headline h2{margin:0;color:#fff;font-size:clamp(26px,3.1vw,40px);font-weight:950;line-height:1.12}
 .typewriter{flex:1;width:100%;margin-top:1.6%;overflow:visible;font-size:clamp(16px,1.9vw,23px);line-height:1.92;font-weight:900;display:flex;align-items:flex-start;justify-content:flex-start}
 .seg{position:relative;display:block;width:100%;margin:0;opacity:0;transform:translateY(10px);transition:opacity 1.35s ease,transform 1.35s ease}
.seg.visible{opacity:1;transform:none}
.seg-box{position:relative;width:100%;min-height:clamp(120px,16vh,190px);padding:clamp(18px,2vw,28px);border:1px solid rgba(255,255,255,.55);border-radius:22px;background:rgba(7,39,29,.48);box-shadow:0 14px 30px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.18);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;text-align:right}
.seg-text{display:block;width:100%}
.seg.fade-out{opacity:0;transform:translateY(-10px)}
.continue-wrap{position:relative;left:clamp(18px,2vw,28px);top:auto!important;margin:8px 0 0;text-align:left;z-index:5;height:82px}
.continue-btn{position:relative;width:150px;height:82px;min-width:150px;min-height:82px;border:0;border-radius:0;padding:0;background:transparent;cursor:pointer;box-shadow:none;transition:transform .55s ease,filter .35s ease;z-index:2;display:grid;place-items:center}
.continue-btn svg{width:150px;height:82px;display:block;overflow:visible;filter:drop-shadow(0 0 3px rgba(0,255,110,.95)) drop-shadow(0 0 10px rgba(0,255,110,.85)) drop-shadow(0 0 22px rgba(0,255,110,.65))}
.continue-btn:hover{transform:translateX(-10px) scale(1.07);filter:brightness(1.25)}
.continue-btn:active{transform:translateX(-5px) scale(.98)}
.continue-btn:focus-visible{outline:3px solid rgba(0,255,132,.7);outline-offset:4px}
.continue-btn:focus-visible{outline:3px solid rgba(0,255,132,.7);outline-offset:4px}
@keyframes dxnContinueArrow{
  0%,100%{transform:translateX(0)}
  50%{transform:translateX(-12px)}
}
.continue-btn{animation:dxnContinueArrow 1.15s ease-in-out infinite}
.continue-btn:active{animation:none;transform:translateX(-5px) scale(.98)}

.continue-btn:focus-visible{outline:3px solid rgba(0,255,132,.7);outline-offset:4px}
.actions{margin-top:1.1%;width:100%;text-align:right;transform:translateY(-18px)}
.start{min-width:285px;min-height:64px;border:0;border-radius:999px;padding:0 24px;background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;font-size:18px;font-weight:950;cursor:pointer;box-shadow:0 12px 25px rgba(0,0,0,.20);opacity:0;pointer-events:none;transform:translateY(7px);transition:.3s}
.start.ready{opacity:1;pointer-events:auto;transform:none}
.note{margin-top:7px;font-size:10px;font-weight:800;color:#fff}
@media(max-width:700px){.scene{width:100vw;height:100svh;aspect-ratio:auto}.scene-bg{object-position:center center}.readability{width:68%;background:linear-gradient(90deg,rgba(7,39,29,.02),rgba(7,39,29,.10) 42%,rgba(7,39,29,.28) 100%)}.text-col{right:4.5vw;top:4.8svh;width:69%;height:90svh}.logo{width:58px;min-width:58px;max-width:58px}.brand h1{font-size:20px}.brand p{font-size:9.5px}.headline{margin-top:1.6vh}.headline h2{font-size:28px}.typewriter{width:100%;font-size:16.5px;line-height:1.72;margin-top:1.4vh;margin-bottom:12px;max-height:none;overflow:visible}.seg{margin-bottom:0}.seg-box{min-height:130px;padding:16px;border-radius:18px}.continue-wrap{position:relative;left:15px;top:auto!important;bottom:auto!important;margin:8px 0 0;height:52px}.continue-btn{min-width:68px;min-height:52px;width:68px;height:52px;font-size:54px}.start{min-width:190px;min-height:50px;font-size:16px}.note{font-size:8.5px}}
</style>
<style id="desktop-intro-fullscreen">.desktop-mode .scene{width:100vw;height:100svh;aspect-ratio:auto}.desktop-mode .desktop-bg{width:100%;height:100%;object-fit:cover;object-position:center center}</style>
<style id="device-image-visibility">.desktop-bg{display:block}.mobile-bg{display:none}@media(max-width:700px){.desktop-bg{display:none}.mobile-bg{display:block}}</style>
<style id="v13-final-mobile-adjustments">@media(max-width:700px){.page{padding:0;background:#eef5f1}.scene{width:100vw!important;height:100svh!important;aspect-ratio:auto!important;max-height:none!important}.mobile-bg{width:100%!important;height:100%!important;object-fit:fill!important;object-position:center center!important}.text-col{right:4.2%;top:4.0%;width:69%;height:91%}.typewriter{width:100%;font-size:19px;line-height:1.78;font-weight:900;text-shadow:0 2px 2px rgba(0,0,0,.82),0 4px 11px rgba(55,55,55,.60),0 0 3px rgba(65,65,65,.38)}.actions{transform:translateY(-18px)}.start.ready{transform:translateY(-18px)}}</style>
<link rel="manifest" href="/manifest.json">
</head>
<body>
<main class="page"><section class="scene"><img class="scene-bg desktop-bg" src="desktop-scene.webp" alt="مجتمع الصحة والثراء — واجهة الحاسوب"><img class="scene-bg mobile-bg" src="mobile-scene.webp" alt="مجتمع الصحة والثراء — واجهة الموبايل"><div class="readability"></div><div class="text-col"><div class="brand"><img class="logo" src="logo.png" alt="شعار مجتمع الصحة والثراء"><h1>مجتمع الصحة والثراء</h1><p>حياة أفضل .. فرص أوسع .. لمستقبل أجمل</p></div><div class="headline"><h2 id="headline"></h2></div><div class="typewriter" id="typewriter"></div><div class="actions"><button class="start" id="start" type="button">ابدأ الاختبار <span>→</span></button><div class="note">ستنتقل بعدها مباشرة إلى الأسئلة العشرة.</div></div></div></section></main>
<script>
const segments=[
  "خذ لحظة لنفسك... أحيانًا تكون أفضل بداية هي أن نتوقف قليلًا، وننظر بصدق إلى أنفسنا.",
  "ماذا نريد؟ كيف نفكر؟ وكيف نتعامل مع الفرص والتغيير؟ أمامك الآن 10 أسئلة قصيرة صُممت لتساعدك على اكتشاف مدى استعدادك لخوض مسارات وفرص مختلفة قد تناسبك في المستقبل.",
  "لا تبحث عن الإجابة المثالية، ولا تحاول أن تتوقع ما نريد منك اختياره. أجب كما أنت فعلًا؛ وفق سجيتك، فطرتك، طبيعتك، وأسلوبك الحقيقي في التفكير والتصرف. لا تُطل التفكير في الإجابة، ودع إجابتك الأولى تتحدث عنك.",
  "هذه ليست مسابقة، ولا يوجد فيها نجاح أو رسوب. إنها رحلة قصيرة للتعرّف على نفسك بشكل أوضح. كن صادقًا مع نفسك... ودع إجاباتك تتحدث عنك."
];
const box=document.getElementById("typewriter");
const head=document.getElementById("headline");
const start=document.getElementById("start");
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function makeContinue(){
  const wrap=document.createElement("div");
  wrap.className="continue-wrap";
  const btn=document.createElement("button");
  btn.className="continue-btn";
  btn.type="button";
  btn.setAttribute("aria-label","الاستمرار إلى الفقرة التالية");
  btn.innerHTML='<svg viewBox="0 0 320 200" role="img" aria-hidden="true" focusable="false"><path d="M305 60H155V22L18 100l137 78v-38h150V60Z" fill="none" stroke="#00d878" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><path d="M305 60H155V22L18 100l137 78v-38h150V60Z" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  wrap.appendChild(btn);
  return {wrap,btn};
}

async function showSegment(index){
  box.innerHTML="";
  const seg=document.createElement("div");
  seg.className="seg";
  const panel=document.createElement("div");
  panel.className="seg-box";
  const textEl=document.createElement("span");
  textEl.className="seg-text";
  textEl.textContent=segments[index];
  panel.appendChild(textEl);
  seg.appendChild(panel);

  if(index < segments.length-1){
    const {wrap,btn}=makeContinue();
    seg.appendChild(wrap);
    btn.addEventListener("click",async()=>{
      btn.disabled=true;
      seg.classList.remove("visible");
      seg.classList.add("fade-out");
      await sleep(1350);
      showSegment(index+1);
    });
  }else{
    await sleep(1350);
    start.classList.add("ready");
  }

  box.appendChild(seg);
  requestAnimationFrame(()=>requestAnimationFrame(()=>seg.classList.add("visible")));
}

function run(){
  head.textContent="قبل أن تبدأ...";
  showSegment(0);
}

start.addEventListener("click",()=>location.href="/03-pretest.html");run();
</script>
<script>
(function removeDuplicateDeviceSelector(){
  function cleanup(){
    document.querySelectorAll('#dxn-global-device-switch').forEach(function(el){el.remove();});
  }
  cleanup();
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',cleanup,{once:true});
  if(window.MutationObserver){
    new MutationObserver(cleanup).observe(document.body,{childList:true,subtree:true});
  }
})();
</script>
<script src="/device-mode.js?v=86.66" defer></script>
<script src="/pwa-install.js?v=1" defer></script>
</body>
</html>
