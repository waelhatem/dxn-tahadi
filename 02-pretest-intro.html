<!doctype html>

<title>مجتمع الصحة والثراء — قبل أن تبدأ</title>
<!-- V4: clean desktop background image; mobile original preserved -->
<style>
:root{--green:#0f513f;--green2:#176b55}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef5f1;font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif}
.page{width:100vw;height:100svh;display:grid;place-items:center;overflow:hidden}
.scene{position:relative;width:min(100vw,66.6667svh);height:min(150svw,100svh);aspect-ratio:2/3;overflow:hidden;background:#fff}
.scene-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center}
.readability{position:absolute;right:0;top:0;bottom:0;width:52%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.02) 18%,rgba(7,39,29,.11) 70%,rgba(7,39,29,.22));filter:blur(2px);pointer-events:none}
.text-col{position:absolute;right:2.8%;top:3.8%;width:55.5%;height:92%;display:flex;flex-direction:column;align-items:flex-start;color:#fff;text-shadow:0 2px 2px rgba(0,0,0,.82),0 4px 12px rgba(55,55,55,.60),0 0 3px rgba(65,65,65,.38);z-index:3}
.brand{width:100%;text-align:right}
.logo{width:14%;min-width:58px;max-width:90px;aspect-ratio:1;object-fit:contain;margin:0 0 3px auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.brand h1{margin:0;color:#fff;font-size:clamp(20px,2.55vw,31px);font-weight:950;line-height:1.08}
.brand p{margin:.35rem 0 0;color:#fff;font-size:clamp(9px,1.05vw,13px);font-weight:800}
.headline{margin-top:2.1%;text-align:right;width:100%}
.headline h2{margin:0;color:#fff;font-size:clamp(26px,3.1vw,40px);font-weight:950;line-height:1.12}
 .typewriter{flex:1;width:100%;margin-top:1.6%;overflow:visible;font-size:clamp(16px,1.9vw,23px);line-height:1.92;font-weight:900;display:flex;align-items:flex-start;justify-content:flex-start}
 .seg{position:relative;display:block;width:100%;margin:0;opacity:0;transform:translateY(10px);transition:opacity 1.35s ease,transform 1.35s ease}
.seg.visible{opacity:1;transform:none}
.seg-box{position:relative;width:100%;min-height:clamp(120px,16vh,190px);padding:clamp(18px,2vw,28px);border:1px solid rgba(255,255,255,.55);border-radius:22px;background:rgba(7,39,29,.48);box-shadow:0 14px 30px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.18);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;text-align:right}
.seg-text{display:block;width:100%}
.seg.fade-out{opacity:0;transform:translateY(-10px)}
.continue-wrap{position:absolute;left:clamp(18px,2vw,28px);top:0;margin:0;text-align:left;z-index:5}
.continue-btn{width:92px;height:68px;min-width:92px;min-height:68px;border:0;border-radius:0;padding:0;background:transparent;color:#fff;font-size:76px;line-height:.7;font-family:Arial,sans-serif;font-weight:900;cursor:pointer;box-shadow:none;text-shadow:0 4px 0 rgba(0,0,0,.38),0 7px 14px rgba(0,0,0,.45);-webkit-text-stroke:2px rgba(0,0,0,.12);transition:transform .25s ease,filter .25s ease}
.continue-btn:hover{transform:translateX(-7px) scale(1.06);filter:brightness(1.08)}
.continue-btn:focus-visible{outline:3px solid rgba(34,164,71,.45);outline-offset:4px}
.actions{margin-top:1.1%;width:100%;text-align:right;transform:translateY(-18px)}
.start{min-width:285px;min-height:64px;border:0;border-radius:999px;padding:0 24px;background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;font-size:18px;font-weight:950;cursor:pointer;box-shadow:0 12px 25px rgba(0,0,0,.20);opacity:0;pointer-events:none;transform:translateY(7px);transition:.3s}
.start.ready{opacity:1;pointer-events:auto;transform:none}
.note{margin-top:7px;font-size:10px;font-weight:800;color:#fff}
@media(max-width:700px){.scene{width:100vw;height:100svh;aspect-ratio:auto}.scene-bg{object-position:center center}.readability{width:68%;background:linear-gradient(90deg,rgba(7,39,29,.02),rgba(7,39,29,.10) 42%,rgba(7,39,29,.28) 100%)}.text-col{right:4.5vw;top:4.8svh;width:69%;height:90svh}.logo{width:58px;min-width:58px;max-width:58px}.brand h1{font-size:20px}.brand p{font-size:9.5px}.headline{margin-top:1.6vh}.headline h2{font-size:28px}.typewriter{width:100%;font-size:16.5px;line-height:1.72;margin-top:1.4vh;max-height:none;overflow:hidden}.seg{margin-bottom:0}.seg-box{min-height:130px;padding:16px;border-radius:18px}.continue-wrap{left:15px;bottom:10px}.continue-btn{min-width:62px;min-height:48px;width:62px;height:48px;font-size:48px}.start{min-width:190px;min-height:50px;font-size:16px}.note{font-size:8.5px}}
</style>
<style id="v13-final-mobile-adjustments">@media(max-width:700px){.page{padding:0;background:#eef5f1}.scene{width:94vw!important;height:auto!important;aspect-ratio:2/3!important;max-height:92svh!important}.text-col{right:4.2%;top:4.0%;width:69%;height:91%}.typewriter{width:100%;font-size:19px;line-height:1.78;font-weight:900;text-shadow:0 2px 2px rgba(0,0,0,.82),0 4px 11px rgba(55,55,55,.60),0 0 3px rgba(65,65,65,.38)}.actions{transform:translateY(-18px)}.start.ready{transform:translateY(-18px)}}</style>
<style id="device-interface">.device-switch{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:6px;padding:5px;border-radius:999px;background:rgba(255,255,255,.95);box-shadow:0 8px 22px rgba(0,0,0,.16);direction:rtl;backdrop-filter:blur(8px)}.device-switch button{border:0;border-radius:999px;padding:9px 16px;min-width:118px;background:transparent;color:#0f513f;font:800 14px/1 "Tajawal","Segoe UI",Tahoma,Arial,sans-serif;cursor:pointer;transition:.2s ease}.device-switch button.active{color:#fff;background:linear-gradient(135deg,#0f513f,#176b55);box-shadow:0 5px 12px rgba(15,81,63,.22)}.scene-bg{display:none!important}body.manual-desktop .desktop-bg,body.manual-mobile .mobile-bg{display:block!important}body.manual-desktop .scene{width:100vw!important;height:100svh!important;aspect-ratio:auto!important}body.manual-desktop .desktop-bg{object-fit:cover!important;object-position:center center!important}body.manual-desktop .text-col{right:3.8%!important;top:4%!important;width:43%!important;height:90%!important}body.manual-desktop .typewriter{font-size:clamp(17px,1.65vw,25px)!important;line-height:1.85!important}body.manual-desktop .seg-box{min-height:clamp(125px,18vh,205px)!important}body.manual-desktop .continue-wrap{left:clamp(18px,2vw,28px)!important;top:0!important}body.manual-desktop .continue-btn{min-width:92px!important;min-height:68px!important;width:92px!important;height:68px!important;font-size:76px!important}body.manual-desktop .start{min-width:285px!important;min-height:64px!important;font-size:20px!important}body.manual-mobile .scene{width:min(94vw,61.333svh)!important;height:min(92svh,141.3043vw)!important;aspect-ratio:2/3!important;max-height:92svh!important}body.manual-mobile .mobile-bg{object-fit:contain!important;object-position:center center!important}body.manual-mobile .readability{width:68%!important;background:linear-gradient(90deg,rgba(7,39,29,.02),rgba(7,39,29,.10) 42%,rgba(7,39,29,.28) 100%)!important}body.manual-mobile .text-col{right:4.2%!important;top:4%!important;width:69%!important;height:91%!important}body.manual-mobile .logo{width:58px!important;min-width:58px!important;max-width:58px!important}body.manual-mobile .brand h1{font-size:20px!important}.brand p{font-size:9.5px}body.manual-mobile .headline{margin-top:1.6vh!important}.manual-mobile .headline h2{font-size:28px!important}body.manual-mobile .typewriter{width:100%!important;font-size:19px!important;line-height:1.78!important;overflow:visible!important}body.manual-mobile .seg-box{min-height:125px!important;padding:15px!important}body.manual-mobile .continue-wrap{left:15px!important;top:0!important}body.manual-mobile .continue-btn{min-width:68px!important;min-height:52px!important;width:68px!important;height:52px!important;font-size:54px!important}body.manual-mobile .start{min-width:205px!important;min-height:54px!important;font-size:16px!important}body.manual-mobile .note{font-size:8.5px!important}@media(max-width:700px){.device-switch{top:8px;padding:4px;gap:4px}.device-switch button{min-width:102px;padding:8px 12px;font-size:12px}}</style>
</head>
<body>
<div class="device-switch" role="group" aria-label="اختيار واجهة العرض"><button id="mobileMode" type="button" aria-pressed="false">📱 الموبايل</button><button id="desktopMode" type="button" class="active" aria-pressed="true">🖥️ الحاسوب</button></div>
<main class="page"><section class="scene"><img class="scene-bg desktop-bg" src="desktop-scene.webp" alt="مجتمع الصحة والثراء — واجهة الحاسوب"><img class="scene-bg mobile-bg" src="mobile-scene.webp" alt="مجتمع الصحة والثراء — واجهة الموبايل"><div class="readability"></div><div class="text-col"><div class="brand"><img class="logo" src="logo.png" alt="شعار مجتمع الصحة والثراء"><h1>مجتمع الصحة والثراء</h1><p>حياة أفضل .. فرص أوسع .. لمستقبل أجمل</p></div><div class="headline"><h2 id="headline"></h2></div><div class="typewriter" id="typewriter"></div><div class="actions"><button class="start" id="start" type="button">ابدأ الاختبار <span>→</span></button><div class="note">ستنتقل بعدها مباشرة إلى الأسئلة العشرة.</div></div></div></section></main>
<script>
const mobileMode=document.getElementById("mobileMode");const desktopMode=document.getElementById("desktopMode");
function setDeviceMode(mode,persist=true){
  const isMobile=mode==="mobile";
  document.body.classList.toggle("manual-mobile",isMobile);
  document.body.classList.toggle("manual-desktop",!isMobile);
  mobileMode.classList.toggle("active",isMobile);
  desktopMode.classList.toggle("active",!isMobile);
  mobileMode.setAttribute("aria-pressed",String(isMobile));
  desktopMode.setAttribute("aria-pressed",String(!isMobile));
  if(persist){
    try{localStorage.setItem("dxn_selected_device_mode",isMobile?"mobile":"desktop");}catch(e){}
  }
}
mobileMode.addEventListener("click",()=>setDeviceMode("mobile",true));
desktopMode.addEventListener("click",()=>setDeviceMode("desktop",true));
const requestedMode=new URLSearchParams(location.search).get("device");
let savedMode=null;
try{savedMode=localStorage.getItem("dxn_selected_device_mode");}catch(e){}
const initialMode=(savedMode==="mobile"||savedMode==="desktop")
  ? savedMode
  : (requestedMode==="mobile"||requestedMode==="desktop" ? requestedMode : "desktop");
setDeviceMode(initialMode,true);
const segments=[
  "خذ لحظة لنفسك... أحيانًا تكون أفضل بداية هي أن نتوقف قليلًا، وننظر بصدق إلى أنفسنا.",
  "ماذا نريد؟ كيف نفكر؟ وكيف نتعامل مع الفرص والتغيير؟ أمامك الآن 10 أسئلة قصيرة صُممت لتساعدك على اكتشاف مدى استعدادك لخوض مسارات وفرص مختلفة قد تناسبك في المستقبل.",
  "لا تبحث عن الإجابة المثالية، ولا تحاول أن تتوقع ما نريد منك اختياره. أجب كما أنت فعلًا؛ وفق سجيتك، فطرتك، طبيعتك، وأسلوبك الحقيقي في التفكير والتصرف. لا تُطل التفكير في الإجابة، ودع إجابتك الأولى تتحدث عنك.",
  "هذه ليست مسابقة، ولا يوجد فيها نجاح أو رسوب. إنها رحلة قصيرة للتعرّف على نفسك بشكل أوضح. كن صادقًا مع نفسك... ودع إجاباتك تتحدث عنك."
];
const box=document.getElementById("typewriter");
const head=document.getElementById("headline");
const start=document.getElementById("start");
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function makeContinue(){
  const wrap=document.createElement("div");
  wrap.className="continue-wrap";
  const btn=document.createElement("button");
  btn.className="continue-btn";
  btn.type="button";
  btn.setAttribute("aria-label","الاستمرار إلى الفقرة التالية");
  btn.textContent="←";
  wrap.appendChild(btn);
  return {wrap,btn};
}

async function showSegment(index){
  box.innerHTML="";
  const seg=document.createElement("div");
  seg.className="seg";
  const panel=document.createElement("div");
  panel.className="seg-box";
  const textEl=document.createElement("span");
  textEl.className="seg-text";
  textEl.textContent=segments[index];
  panel.appendChild(textEl);
  seg.appendChild(panel);

  if(index < segments.length-1){
    const {wrap,btn}=makeContinue();
    seg.appendChild(wrap);
    function positionArrow(){
      const gap=8;
      wrap.style.top=(panel.offsetTop + panel.offsetHeight + gap)+"px";
    }
    positionArrow();
    if(window.ResizeObserver){
      const ro=new ResizeObserver(positionArrow);
      ro.observe(panel);
    }else{
      window.addEventListener("resize",positionArrow);
    }
    btn.addEventListener("click",async()=>{
      btn.disabled=true;
      seg.classList.remove("visible");
      seg.classList.add("fade-out");
      await sleep(1350);
      showSegment(index+1);
    });
  }else{
    await sleep(1350);
    start.classList.add("ready");
  }

  box.appendChild(seg);
  requestAnimationFrame(()=>requestAnimationFrame(()=>seg.classList.add("visible")));
}

function run(){
  head.textContent="قبل أن تبدأ...";
  showSegment(0);
}

start.addEventListener("click",()=>location.href="/03-pretest.html");run();
</script>
<script>
(function removeDuplicateDeviceSelector(){
  function cleanup(){
    document.querySelectorAll('#dxn-global-device-switch').forEach(function(el){el.remove();});
  }
  cleanup();
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',cleanup,{once:true});
  if(window.MutationObserver){
    new MutationObserver(cleanup).observe(document.body,{childList:true,subtree:true});
  }
})();
</script>
<script src="/device-mode.js?v=86.66" defer></script>
</body>
</html>
