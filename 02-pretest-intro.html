<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>مجتمع الصحة والثراء — قبل أن تبدأ</title>
<style>
:root{--green:#0f513f;--green2:#176b55}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef5f1;font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif}
.page{width:100vw;height:100svh;display:grid;place-items:center;overflow:hidden}
.scene{position:relative;width:min(100vw,66.6667svh);height:min(150svw,100svh);aspect-ratio:2/3;overflow:hidden;background:#fff}
.scene-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center}
.readability{position:absolute;right:0;top:0;bottom:0;width:52%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.02) 18%,rgba(7,39,29,.11) 70%,rgba(7,39,29,.22));filter:blur(2px);pointer-events:none}
.text-col{position:absolute;right:2.8%;top:3.8%;width:55.5%;height:92%;display:flex;flex-direction:column;align-items:flex-start;color:#fff;text-shadow:0 2px 2px rgba(0,0,0,.82),0 4px 12px rgba(55,55,55,.60),0 0 3px rgba(65,65,65,.38);z-index:3}
.brand{width:100%;text-align:right}.logo{width:14%;min-width:58px;max-width:90px;aspect-ratio:1;object-fit:contain;margin:0 0 3px auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}.brand h1{margin:0;color:#fff;font-size:clamp(20px,2.55vw,31px);font-weight:950;line-height:1.08}.brand p{margin:.35rem 0 0;color:#fff;font-size:clamp(9px,1.05vw,13px);font-weight:800}
.headline{margin-top:2.1%;text-align:right;width:100%}.headline h2{margin:0;color:#fff;font-size:clamp(26px,3.1vw,40px);font-weight:950;line-height:1.12}.typewriter{flex:1;width:100%;margin-top:1.6%;overflow:hidden;font-size:clamp(16px,1.9vw,23px);line-height:1.92;font-weight:900}
.seg{display:none;margin:0 0 1.8%;opacity:0;transform:translateY(5px)}.seg.active{display:block;opacity:1;transform:none}.seg.typing:after{content:"";display:inline-block;width:2px;height:1em;background:#fff;margin-right:4px;vertical-align:-2px;animation:blink .8s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.actions{margin-top:1.1%;width:100%;text-align:right;transform:translateY(-18px)}.start{min-width:285px;min-height:64px;border:0;border-radius:999px;padding:0 24px;background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;font-size:18px;font-weight:950;cursor:pointer;box-shadow:0 12px 25px rgba(0,0,0,.20);opacity:0;pointer-events:none;transform:translateY(7px);transition:.3s}.start.ready{opacity:1;pointer-events:auto;transform:none}.note{margin-top:7px;font-size:10px;font-weight:800;color:#fff}
@media(max-width:700px){.scene{width:100vw;height:100svh;aspect-ratio:auto}.scene-bg{object-position:center center}.readability{width:68%;background:linear-gradient(90deg,rgba(7,39,29,.02),rgba(7,39,29,.10) 42%,rgba(7,39,29,.28) 100%)}.text-col{right:4.5vw;top:4.8svh;width:69%;height:90svh}.logo{width:58px;min-width:58px;max-width:58px}.brand h1{font-size:20px}.brand p{font-size:9.5px}.headline{margin-top:1.6vh}.headline h2{font-size:28px}.typewriter{width:100%;font-size:16.5px;line-height:1.72;margin-top:1.4vh;max-height:none;overflow:hidden}.seg{margin-bottom:1.6vh}.start{min-width:190px;min-height:50px;font-size:16px}.note{font-size:8.5px}}
@media(max-width:700px){.page{padding:0;background:#eef5f1}.scene{width:94vw!important;height:auto!important;aspect-ratio:2/3!important;max-height:92svh!important}.text-col{right:4.2%;top:4.0%;width:69%;height:91%}.typewriter{width:100%;font-size:19px;line-height:1.78;font-weight:900;text-shadow:0 2px 2px rgba(0,0,0,.82),0 4px 11px rgba(55,55,55,.60),0 0 3px rgba(65,65,65,.38)}.actions{transform:translateY(-18px)}.start.ready{transform:translateY(-18px)}}
@media(min-width:701px){.scene{width:min(100vw,66.6667svh)!important;height:min(150svw,100svh)!important;aspect-ratio:2/3!important}.scene-bg{object-fit:contain!important}.text-col{right:3%;top:3.8%;width:54%;height:91%}.typewriter{font-size:clamp(16px,1.9vw,23px);line-height:1.9}.actions{margin-top:1.1%!important;transform:translateY(-18px)!important}.start{min-width:285px!important;min-height:64px!important;font-size:20px!important}}
@media(max-width:700px){.start{min-width:205px!important;min-height:54px!important}.actions{transform:translateY(-14px)!important}}
</style>
</head>
<body>
<main class="page">
<section class="scene">
<img class="scene-bg" src="11.png" alt="">
<div class="readability"></div><div class="text-col"><div class="brand"><img class="logo" src="logo.png" alt="شعار مجتمع الصحة والثراء"><h1>مجتمع الصحة والثراء</h1><p>حياة أفضل .. فرص أوسع .. لمستقبل أجمل</p></div><div class="headline"><h2 id="headline"></h2></div><div id="typewriter" class="typewriter"></div><div class="actions"><button id="start" class="start" type="button">ابدأ الآن</button><div class="note">خذ لحظتك… واقرأ بهدوء.</div></div></div>
</section>
</main>
<script>
const segments=["قبل أن تبدأ رحلتك، خذ لحظة لتسأل نفسك: هل أنت راضٍ حقًا عن مستوى صحتك وحياتك اليوم؟","كثيرون يمرّون في الحياة وهم يبحثون عن حلّ سريع، بينما التغيير الحقيقي يبدأ من فهم الصورة كاملة واتخاذ قرار واعٍ.","هذه ليست مجرد أسئلة؛ إنها وقفة قصيرة مع نفسك، لتكتشف أين أنت الآن، وإلى أين تريد أن تصل.","أجب بصدق عن الأسئلة القادمة، فالنتيجة ليست حكمًا عليك، بل مؤشر يساعدك على معرفة نقطة البداية."];
const box=document.getElementById("typewriter"),head=document.getElementById("headline"),start=document.getElementById("start");const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function typeText(el,text,speed){for(const ch of [...text]){el.appendChild(document.createTextNode(ch));await sleep(speed)}}
async function run(){const cursor=document.createElement("span");cursor.className="seg typing active";cursor.style.display="inline-block";cursor.textContent="";head.appendChild(cursor);await typeText(cursor,"قبل أن تبدأ...",120);cursor.classList.remove("typing");for(const text of segments){const seg=document.createElement("div");seg.className="seg active typing";box.innerHTML="";box.appendChild(seg);await typeText(seg,text,115);seg.classList.remove("typing");await sleep(1100)}start.classList.add("ready")}
start.addEventListener("click",()=>location.href="03-pretest.html");run();
</script>
</body>
</html>
