<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f513f"><title>اختبار البداية — مجتمع الصحة والثراء</title><style>:root{--g:#0f513f;--g2:#176b55;--bg:#eef5f1;--text:#182234;--muted:#667085;--ok:#166534;--bad:#9f2118}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eaf5ef,#fff);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}.wrap{max-width:820px;margin:auto;padding:22px 16px 50px}.card{background:#fff;border:1px solid #dce8e2;border-radius:24px;padding:24px;box-shadow:0 14px 40px #00000012}.head{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;border-radius:20px;padding:22px;margin-bottom:16px}.head h1{margin:0 0 5px;font-size:27px}.head p{margin:0;opacity:.9}.progress{height:9px;background:#dfeae5;border-radius:99px;overflow:hidden;margin-top:14px}.progress span{display:block;height:100%;width:0;background:#d9a62e;transition:width .2s}.question{display:none}.question.active{display:block}.qno{font-size:13px;color:var(--muted);font-weight:900}.question h2{font-size:21px;line-height:1.7;margin:8px 0 16px}.answers{display:grid;gap:10px}.answers label{display:flex;gap:10px;align-items:flex-start;padding:14px;border:1px solid #dce8e2;border-radius:15px;background:#f8fbf9;cursor:pointer;line-height:1.7}.answers label:hover{border-color:#9bc3b1}.answers input{margin-top:5px;accent-color:var(--g)}.actions{display:flex;gap:10px;margin-top:20px}.actions button{flex:1;border:0;border-radius:14px;min-height:48px;padding:12px 16px;font:inherit;font-weight:900;cursor:pointer}.next{background:var(--g);color:#fff}.back{background:#edf3f0;color:var(--text)}.result{text-align:center}.score{font-size:62px;font-weight:950;color:var(--g);line-height:1}.status{font-size:19px;font-weight:900;margin:12px 0}.gate{margin-top:18px;padding:18px;border-radius:18px;background:#f7faf8;border:1px solid #dce8e2;line-height:1.8}.discover{display:block;text-decoration:none;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:16px;border-radius:15px;font-weight:950;font-size:18px;margin-top:14px}.retry{margin-top:12px;background:#edf3f0;color:var(--text);border:0;border-radius:14px;min-height:46px;padding:11px 16px;font:inherit;font-weight:900;cursor:pointer}.muted{color:var(--muted);font-size:13px;line-height:1.8}@media(max-width:520px){.card{padding:17px}.question h2{font-size:19px}}
</style></head><body><main class="wrap"><section class="card"><div class="head"><h1>🧭 اختبار البداية</h1><p>10 أسئلة قصيرة — النتيجة من 100</p><div class="progress"><span id="bar"></span></div></div><div id="quiz"></div><div id="result" class="result" style="display:none"></div></section></main><script>
const questions=[
['ما مدى اهتمامك بتطوير صحتك ونمط حياتك؟',['أهتم بذلك بشكل جاد','أهتم أحياناً','لا أفكر فيه كثيراً']],
['هل ترى أن الصحة الجيدة تؤثر في جودة حياتك اليومية؟',['نعم بشكل واضح','إلى حد ما','لا أرى تأثيراً كبيراً']],
['هل لديك استعداد لتعلم مهارات جديدة إذا كانت تساعدك على تطوير حياتك؟',['نعم، بالتأكيد','ربما حسب الموضوع','أفضل عدم تغيير ما أفعله']],
['كيف تنظر إلى فكرة بناء مصدر دخل إضافي بجانب عملك الحالي؟',['فكرة مهمة أريد استكشافها','قد تكون مناسبة لي','ليست ضمن أولوياتي']],
['هل تستطيع تخصيص وقت منتظم للتعلم والتطبيق؟',['نعم، أستطيع الالتزام','أستطيع بشكل محدود','لا أستطيع حالياً']],
['هل تؤمن بأن النتائج تحتاج إلى تعلم ثم تطبيق مستمر؟',['نعم','إلى حد ما','لا أوافق']],
['ما مدى استعدادك للتواصل مع أشخاص جدد وتوسيع دائرة علاقاتك؟',['مستعد جداً','مستعد إلى حد ما','أفضل البقاء ضمن دائرتي الحالية']],
['هل تهتم بأن يكون لديك مجتمع أو فريق تتعلم معه وتشارك تجربتك؟',['نعم، هذا مهم بالنسبة لي','ربما','لا أحتاج إلى ذلك']],
['إذا وجدت مساراً منظماً للتعلم والتطبيق، هل ترغب في استكشافه؟',['نعم، أرغب في استكشافه','سأفكر في الأمر','لا أرغب حالياً']],
['بعد هذه المقدمة، ما مدى رغبتك في معرفة المزيد عن عالم الصحة والثراء والحرية؟',['رغبة قوية جداً','رغبة متوسطة','غير مهتم حالياً']]
];
let current=0,answers=Array(questions.length).fill(null);const quiz=document.getElementById('quiz'),bar=document.getElementById('bar'),result=document.getElementById('result');
function render(){const [q,a]=questions[current];quiz.innerHTML=`<div class="question active"><div class="qno">السؤال ${current+1} من ${questions.length}</div><h2>${q}</h2><div class="answers">${a.map((x,i)=>`<label><input type="radio" name="answer" value="${i}" ${answers[current]===i?'checked':''}><span>${x}</span></label>`).join('')}</div><div class="actions">${current?'<button class="back" type="button" onclick="prev()">السابق</button>':''}<button class="next" type="button" onclick="next()">${current===questions.length-1?'إنهاء الاختبار':'التالي'}</button></div></div>`;bar.style.width=((current+1)/questions.length*100)+'%';}
function save(){const r=document.querySelector('input[name="answer"]:checked');if(!r){alert('اختر إجابة للمتابعة.');return false}answers[current]=Number(r.value);return true}
function next(){if(!save())return;if(current<questions.length-1){current++;render();window.scrollTo(0,0)}else finish()}
function prev(){if(current>0){current--;render();window.scrollTo(0,0)}}
function finish(){const weights=[10,5,0],score=answers.reduce((s,a)=>s+(weights[a]??0),0);quiz.style.display='none';bar.style.width='100%';result.style.display='block';const passed=score>=90;result.innerHTML=`<div class="qno">اكتمل الاختبار</div><div class="score">${score}</div><div class="status">${passed?'🎉 لديك بوابة الاكتشاف مفتوحة':'تم تسجيل نتيجتك'}</div>${passed?`<div class="gate"><b>نتيجتك 90 أو أكثر</b><p>يمكنك الآن الانتقال إلى الخطوة التالية والتعرف على المسار الكامل.</p><a class="discover" href="/app/index.html">✨ اكتشف عالم الصحة والثراء والحرية</a></div>`:`<div class="gate"><b>النتيجة أقل من 90</b><p>يمكنك إعادة الاختبار متى شئت واستكشاف الأسئلة من جديد.</p><button class="retry" onclick="restart()">إعادة الاختبار</button></div>`}`;localStorage.setItem('dxn_pretest_score',String(score));localStorage.setItem('dxn_pretest_passed',passed?'1':'0');window.scrollTo(0,0)}
function restart(){current=0;answers=Array(questions.length).fill(null);quiz.style.display='block';result.style.display='none';render();window.scrollTo(0,0)}
render();
</script><script src="/device-mode.js" defer></script>
</body></html>
