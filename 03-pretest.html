<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبار البداية — مجتمع الصحة والثراء</title><style>
:root{--g:#0d5b49;--g2:#2a8b70;--bg:#eef5f1;--text:#123b30;--muted:#71827b;--line:#dce7e1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif}.page{min-height:100vh;display:grid;grid-template-columns:31% 69%;direction:ltr}.visual{position:relative;min-height:100vh;background:url('/11.png') center/cover no-repeat;overflow:hidden}.visual:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 82%,#eef5f1 100%);pointer-events:none}.content{padding:28px 30px;display:flex;align-items:center;justify-content:center;direction:rtl}.app{width:min(1100px,100%)}.brand{text-align:center;margin-bottom:14px}.brand img{width:78px;height:58px;object-fit:contain}.brand h1{display:none}.brand p{display:none}.card{background:#fffffff8;border:1px solid var(--line);border-radius:25px;padding:17px 18px 18px;box-shadow:0 18px 50px #18322a1f}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.pill{color:var(--g);background:#eef8f2;border:1px solid #cfe4da;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:900}.progress{height:8px;background:#e6eee9;border-radius:99px;overflow:hidden;margin:0 0 19px}.progress i{display:block;height:100%;width:10%;background:linear-gradient(90deg,var(--g),var(--g2));transition:.25s}.intro{text-align:center}.intro h2{font-size:clamp(26px,3vw,34px);margin:0 0 7px}.intro p{margin:0;color:var(--muted);line-height:1.8;font-size:13px}.qnum{margin-top:18px;color:#356b5b;font-size:12px;font-weight:900}.question{font-size:clamp(22px,2.25vw,30px);line-height:1.55;margin:7px 0 15px;font-weight:900}.options{display:grid;gap:8px}.option{width:100%;display:grid;grid-template-columns:34px 1fr 34px;align-items:center;gap:9px;text-align:right;border:1px solid #dfe8e4;background:#fbfdfc;border-radius:17px;padding:11px 13px;font:inherit;color:#17372d;cursor:pointer;min-height:55px}.option.selected{border-color:var(--g);background:#edf7f1}.icon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#eaf3ef;color:var(--g);font-size:20px}.radio{width:22px;height:22px;border-radius:50%;border:1px solid #bfcfc7;display:grid;place-items:center;background:#fff;color:#fff;justify-self:start}.selected .radio{background:var(--g);border-color:var(--g)}.actions{display:flex;gap:10px;margin-top:10px}.btn{flex:1;border:0;border-radius:15px;padding:11px 18px;font:inherit;font-weight:900;cursor:pointer}.next{background:#78a99e;color:#fff}.back{background:#f2f4f3;color:#9aa7a2;border:1px solid #e3e9e6}button:disabled{opacity:.45;cursor:not-allowed}.result{text-align:center}.score{font-size:62px;font-weight:950;color:var(--g)}.result h2{font-size:28px}.result p{color:var(--muted);line-height:1.9}.footer{text-align:center;color:#7a8c84;font-size:11px;margin-top:9px}@media(max-width:920px){.page{grid-template-columns:1fr}.visual{min-height:330px;height:330px}.content{padding:20px 12px 30px}.app{width:100%}.brand{display:none}}@media(max-width:560px){.visual{min-height:270px;height:270px}.card{padding:15px;border-radius:21px}.option{grid-template-columns:30px 1fr 30px}.actions{flex-direction:column-reverse}.btn{width:100%}}
.question-arrow-wrap{display:flex;justify-content:center;align-items:center;margin-top:12px;height:76px}.question-arrow{width:76px;height:76px;border:0;background:transparent;padding:0;display:grid;place-items:center;cursor:pointer;line-height:0;transition:transform .2s,filter .2s}.question-arrow img{width:100%;height:100%;object-fit:contain;display:block}.question-arrow:hover{transform:scale(1.06);filter:brightness(1.08)}.question-arrow:active{transform:scale(.96)}.question-arrow:disabled{opacity:.35;cursor:not-allowed;transform:none}.question-arrow:focus-visible{outline:3px solid rgba(0,216,120,.55);outline-offset:4px;border-radius:50%}@media(max-width:560px){.question-arrow-wrap{margin-top:8px;height:64px}.question-arrow{width:64px;height:64px}}</style></head><body><div class="page"><aside class="visual"></aside><section class="content"><main class="app"><div class="brand"><img src="/logo.svg" alt="مجتمع الصحة والثراء"></div><section class="card" id="quizCard"><div class="top"><span class="pill" id="step">السؤال 1 من 10</span><span class="pill">✦ رحلة قصيرة</span></div><div class="progress"><i id="bar"></i></div><div class="intro"><h2>هل أنت مستعد لمرحلة مختلفة؟</h2><p>أجب بعفوية. لا توجد إجابة صحيحة أو خاطئة؛ الهدف أن تساعدك هذه الرحلة على رؤية اتجاهك بوضوح أكبر.</p></div><div class="qnum" id="qnum">01 / 10</div><h3 class="question" id="question"></h3><div class="options" id="options"></div><div class="actions"><button class="btn back" id="back" disabled>السابق</button><button class="btn next" id="next" disabled>التالي</button></div><div class="question-arrow-wrap"><button class="question-arrow" id="questionArrow" type="button" aria-label="الانتقال إلى السؤال التالي" title="السؤال التالي"><img src="/big.png" alt=""></button></div></section><section class="card result" id="result" style="display:none"><div class="pill">✦ انتهت الرحلة</div><div class="score" id="score">0%</div><h2 id="resultTitle"></h2><p id="resultText"></p><button class="btn next" id="restart">إعادة التقييم</button></section><div class="footer">جميع إجاباتك خاصة وآمنة.</div></main></section></div><script>
const questions=[
['عندما تفكر في السنوات القادمة، ما الشيء الذي تتمنى أن يتغير في حياتك أكثر من غيره؟',['تحسين وضعي المالي','امتلاك وقت ومرونة أكبر','بناء شيء أفتخر به','تطوير نفسي ومهاراتي'],['💰','⏳','⚖️','📚'],[4,4,5,4]],
['ما الذي يدفعك حاليًا إلى البحث عن شيء جديد أو مختلف في حياتك؟',['الرغبة في التعلم والتطور','الرغبة في تحسين ظروفي','الشعور بأنني أستطيع تحقيق أكثر','البحث عن تحدٍ جديد'],['📚','🌱','🚀','🎯'],[5,4,5,4]],
['عندما تواجه شيئًا جديدًا لا تعرفه، ماذا تفعل عادةً؟',['أنتظر من يشرح لي','أحب أن أفهمه وأجربه بنفسي','أتجنبه','أبحث وأتعلم'],['👂','🔎','🛑','📖'],[2,5,0,4]],
['عندما تضع هدفًا مهمًا لنفسك، كيف تتعامل معه؟',['أضع خطوات واضحة وأتابع تقدمي','أبدأ ثم أفقد الحماس','أستمر إذا كانت الظروف مناسبة','ألتزم عندما يكون الهدف مهمًا بالنسبة لي'],['📝','😕','🌦️','💪'],[5,1,2,4]],
['إذا اكتشفت أن طريقة حياتك الحالية لا توصلك إلى ما تريد، فهل أنت مستعد لتغيير بعض عاداتك؟',['أغير بعض الأمور فقط','أفضل أن أبقى كما أنا','نعم، إذا اقتنعت بالسبب','نعم، ومستعد لتغيير ما يلزم'],['🔄','🧱','💡','🌱'],[2,0,4,5]],
['عندما تتعلم شيئًا جديدًا، هل تكتفي بالمعرفة أم تحاول تطبيق ما تعلمته؟',['أفضل المشاهدة والاستيعاب فقط','أطبق عندما تتاح لي الفرصة','أتعلم ثم أطبق مباشرة','أطبق وأراجع نفسي وأحسن طريقتي'],['👀','🧪','⚡','🛠️'],[1,3,4,5]],
['كيف تنظر إلى النتائج التي تحتاج وقتًا وجهدًا قبل أن تظهر؟',['أفضل النتائج السريعة','أتحمل فترة قصيرة','لا مشكلة لدي في بناء النتائج خطوة بخطوة','أستطيع الاستمرار إذا رأيت تقدمًا'],['⚡','⏱️','🪨','📈'],[1,2,5,4]],
['عندما تواجه خطأً أو فشلًا في محاولة مهمة، ماذا تفعل؟',['أشعر بالإحباط وأحتاج وقتًا','أحاول معرفة سبب الخطأ','أتعلم منه وأعيد المحاولة بطريقة أفضل','أتراجع عنها'],['😔','🔍','🔁','↩️'],[1,4,5,0]],
['لو ظهرت أمامك فرصة جديدة قد تفتح لك بابًا مختلفًا في المستقبل، كيف ستتعامل معها؟',['سأدرسها ثم أقرر','لا أحب الدخول في أشياء جديدة','سأتعرف عليها فقط','أحب أن أتعلم وأجرب وأرى إلى أين يمكن أن تصل'],['⚖️','🚪','👀','🚀'],[4,0,2,5]],
['بعد إجاباتك السابقة، ما الذي تبحث عنه فعلًا في هذه المرحلة من حياتك؟',['التعرف واكتشاف خيارات جديدة','تجربة شيء مختلف فقط','بناء مهارة أو مصدر إضافي للمستقبل','تغيير حقيقي وبناء مستقبل أفضل'],['🧭','✨','📈','🌱'],[3,1,5,5]]
];let idx=0,answers=Array(10).fill(null),$=id=>document.getElementById(id);
function render(){const [q,opts,icons,s]=questions[idx];$('step').textContent=`السؤال ${idx+1} من 10`;$('qnum').textContent=String(idx+1).padStart(2,'0')+' / 10';$('question').textContent=q;$('options').innerHTML='';opts.forEach((t,i)=>{const b=document.createElement('button');b.type='button';b.className='option'+(answers[idx]===i?' selected':'');b.innerHTML=`<span class="icon">${icons[i]}</span><span>${t}</span><span class="radio">${answers[idx]===i?'✓':''}</span>`;b.onclick=()=>{answers[idx]=i;render()};$('options').appendChild(b)});$('next').disabled=answers[idx]===null;$('next').textContent=idx===9?'عرض النتيجة':'التالي';$('back').disabled=idx===0;$('bar').style.width=((idx+1)*10)+'%';$('questionArrow').disabled=answers[idx]===null||idx===9;$('questionArrow').style.visibility=idx===9?'hidden':'visible'}
$('questionArrow').onclick=()=>{if(answers[idx]===null||idx===9)return;idx++;render();scrollTo(0,0)};$('next').onclick=()=>{if(answers[idx]===null)return;if(idx<9){idx++;render();scrollTo(0,0)}else finish()};$('back').onclick=()=>{if(idx){idx--;render();scrollTo(0,0)}};
function finish(){let total=0,max=0;questions.forEach(([q,o,e,s],i)=>{total+=s[answers[i]];max+=Math.max(...s)});let pct=Math.round(total/max*100);$('quizCard').style.display='none';$('result').style.display='block';$('score').textContent=pct+'%';$('resultTitle').textContent=pct>=80?'لديك استعداد واضح للمرحلة القادمة':pct>=60?'لديك قابلية جيدة للتغيير والنمو':'أنت في مرحلة اكتشاف خياراتك';$('resultText').textContent='إجاباتك تساعدك على رؤية الاتجاهات التي تستحق أن تستكشفها أكثر. النتيجة ليست حكمًا عليك، بل نقطة بداية.';scrollTo(0,0)}
$('restart').onclick=()=>{idx=0;answers=Array(10).fill(null);$('result').style.display='none';$('quizCard').style.display='block';render();scrollTo(0,0)};render();
</script></body></html>
