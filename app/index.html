(function(){
  if(window.__RAGWAN_STEP5_MOBILE_STATE_V1__) return;
  window.__RAGWAN_STEP5_MOBILE_STATE_V1__=true;
  function sync(){
    const journey=document.getElementById('ragwanJourney');
    const panel=document.getElementById('ragwanStepPanel');
    const n=document.getElementById('ragwanStepNumber');
    if(!journey||!panel||!n)return;
    const step=Number(String(n.textContent||'').trim());
    const active=step===5;
    journey.classList.toggle('ragwan-step-5-active',active);
    panel.classList.toggle('ragwan-step-5-active',active);
  }
  function init(){
    sync();
    const root=document.getElementById('ragwanJourney');
    if(!root)return;
    const observer=new MutationObserver(sync);
    const n=document.getElementById('ragwanStepNumber');
    if(n)observer.observe(n,{childList:true,characterData:true,subtree:true});
    window.addEventListener('resize',sync,{passive:true});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
  else init();
})();

function validateDXNAge18(birthDate){
  if(!birthDate) return {ok:false, message:'يرجى إدخال تاريخ التولد.'};
  const d = new Date(birthDate + 'T00:00:00');
  if(Number.isNaN(d.getTime())) return {ok:false, message:'تاريخ التولد غير صحيح.'};
  const now = new Date();
  let age = now.getFullYear() - d.getFullYear();
  const m = now.getMonth() - d.getMonth();
  if(m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
  return age >= 18
    ? {ok:true, age}
    : {ok:false, age, message:'⚠️ عذرًا، يشترط أن يكون عمر المتقدم 18 سنة أو أكثر للتسجيل.'};
}

async function login(){
  try{
    const loginNo=$('loginNo').value.trim();
    const pin=$('pin').value.trim();
    const loginRole=$('role').value==='leader'?'leader':'member';
    if(!loginNo||!pin)return toast('أدخل بيانات الدخول أولاً.');

    // Remember only the selected login type. The username/PIN are handled by
    // the browser's password manager, not stored in our localStorage.
    localStorage.setItem('dxn_login_role',loginRole);
    localStorage.setItem('dxn_login_no',loginNo);
    if(loginRole==='leader') localStorage.removeItem('dxn_leader_name');

    const r=await rpc('login',{p_login_no:loginNo,p_pin:pin});
    token=r.token;
    const loginIdentity=r&&(
      r.user||r.profile||r.account||r.leader||
      (r.leader_name?{name:r.leader_name}:null)
    );
    const loginLeaderName=String(
      r&&(
        r.leader_name||r.leaderName||
        loginIdentity?.name||loginIdentity?.full_name||loginIdentity?.display_name||loginIdentity?.displayName
      )||''
    ).trim();
    if(loginRole==='leader'){
      const fixedLeaderName=DXN_LEADER_IDENTITY_OVERRIDES[loginNo]||loginLeaderName;
      if(fixedLeaderName) localStorage.setItem('dxn_leader_name',fixedLeaderName);
    }
    localStorage.setItem('dxn_session',token);
    localStorage.setItem('dxn_session_issued',String(Date.now()));
    await boot();
  }catch(e){
    toast(e.message||'تعذر الدخول');
  }
}

function dxnNavLockScroll(){
  const x=window.scrollX||0,y=window.scrollY||0;
  const html=document.documentElement;
  const lock={
    x,y,until:performance.now()+3500,
    htmlScrollBehavior:html.style.scrollBehavior
  };
  window.__DXN_NAV_SCROLL_LOCK__=lock;
  /* V88.5 — freeze the scroll position without changing body positioning.
     The previous position:fixed approach could itself create a visual jump. */
  html.style.scrollBehavior='auto';
  const restore=()=>{
    if(window.__DXN_NAV_SCROLL_LOCK__!==lock)return;
    if(performance.now()>=lock.until){
      html.style.scrollBehavior=lock.htmlScrollBehavior;
      window.scrollTo({left:x,top:y,behavior:'auto'});
      window.__DXN_NAV_SCROLL_LOCK__=null;
      return;
    }
    try{window.scrollTo({left:x,top:y,behavior:'auto'});}catch(_){}
    requestAnimationFrame(restore);
  };
  requestAnimationFrame(restore);
}

const DXN_LEVELS=[
 {stars:0,icon:'🌱',name:'البداية'},
 {stars:100,icon:'🔥',name:'عضو نشيط'},
 {stars:250,icon:'🚀',name:'عضو متقدم'},
 {stars:500,icon:'🏅',name:'صانع إنجاز'},
 {stars:1000,icon:'👑',name:'قائد صاعد'},
 {stars:2000,icon:'💎',name:'قائد متميز'},
 {stars:5000,icon:'🏆',name:'قائد مؤثر'}
];
function getLevel(stars){const n=Math.max(0,Number(stars)||0);let idx=0;for(let i=0;i<DXN_LEVELS.length;i++){if(n>=DXN_LEVELS[i].stars)idx=i;else break}const current=DXN_LEVELS[idx],next=DXN_LEVELS[idx+1]||null;const progress=next?Math.min(100,Math.max(0,Math.round((n-current.stars)/(next.stars-current.stars)*100))):100;return {index:idx,current,next,stars:n,progress};}
function levelCard(stars,compact=false){const l=getLevel(stars), nextText=l.next?`باقي ${Math.max(0,l.next.stars-l.stars)} ⭐ للوصول إلى ${l.next.icon} ${l.next.name}`:'🎉 وصلت إلى أعلى رتبة في النظام';return `<div class="card level-card"><div class="level-head"><div><div class="level-number">المستوى ${l.index}</div><div class="level-name">${l.current.icon} ${l.current.name}</div></div><div class="level-badge">${l.current.icon}</div></div><div class="level-progress"><span style="width:${l.progress}%"></span></div><div class="level-meta"><b>⭐ ${l.stars} نجمة</b><span>${l.next?`الهدف: ⭐ ${l.next.stars}`:'الحد الأعلى'}</span></div>${compact?'':`<div class="level-next">${nextText}</div>`}</div>`}
function maybeShowLevelUp(){if(role!=='member'||!me)return;const l=getLevel(me.stars);const key='dxn_level_seen_'+String(me.id||me.member_no||'member');const old=Number(localStorage.getItem(key)||0);if(l.index>old){localStorage.setItem(key,String(l.index));if(old>0||l.index>0){const el=document.createElement('div');el.className='level-up';el.innerHTML=`🎉 مبروك!<br>${l.current.icon} وصلت إلى المستوى ${l.index} — ${esc(l.current.name)}`;document.body.appendChild(el);setTimeout(()=>el.remove(),5000)}}else if(l.index<old){localStorage.setItem(key,String(l.index));}}
function levelDistribution(members){const counts=DXN_LEVELS.map(()=>0);members.filter(m=>m.active!==false).forEach(m=>counts[getLevel(m.stars).index]++);return DXN_LEVELS.map((l,i)=>`<div class="level-mini"><b>${l.icon} المستوى ${i} — ${l.name}</b><span>${counts[i]} عضو · ⭐ ${l.stars}+</span></div>`).join('');}

function badgeApproved(){return myApprovedSubs().length}
function badgeTitleCount(re,n){return myApprovedSubs().filter(x=>re.test(String(x.challenge_title||x.title||x.challenge_name||''))).length>=n}
function trainingCompletedCount(){return (trainingData?.my_progress||[]).filter(x=>x.completed===true||Number(x.watch_percent||0)>=100).length}

function badgesCard(){const badges=getBadges(),earned=badges.filter(b=>b.earned);return `<div class="card"><div class="title">🏅 شاراتي</div><p class="muted">تُفتح الشارات تلقائيًا عند تحقيق شروطها، وتظهر الشارة المميزة بجانب اسمك في الشريط العلوي.</p><div class="badge-summary"><span class="name-badge">${earned.length?earned[earned.length-1].icon:'🔒'}</span><span class="badge-count">${earned.length} من ${badges.length} شارات مكتسبة</span></div><div class="badges-grid">${badges.map(b=>`<div class="badge-card ${b.earned?'badge-new':'locked'}"><span class="badge-icon">${b.icon}</span><b>${b.name}</b><div class="muted">${b.earned?'✅ مكتسبة':'🔒 '+b.desc}</div></div>`).join('')}</div></div>`}
function activityDatesForStreak(){
 const dates=new Set();
 const subs=(data?.my_submissions||[]);
 subs.forEach(x=>{if(x.status==='approved'||x.approved===true){const d=String(x.approved_at||x.created_at||x.submitted_at||'').slice(0,10);if(d)dates.add(d)}});
 (trainingData?.my_progress||[]).forEach(x=>{if(x.completed===true||Number(x.watch_percent||0)>=100){const d=String(x.completed_at||x.updated_at||x.created_at||'').slice(0,10);if(d)dates.add(d)}});
 return dates;
}
function calcStreak(){
 const set=activityDatesForStreak(), today=new Date(); today.setHours(0,0,0,0);
 const key=d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};
 let cur=new Date(today); if(!set.has(key(cur))){cur.setDate(cur.getDate()-1);}
 let count=0; while(set.has(key(cur))){count++;cur.setDate(cur.getDate()-1);}
 let best=0, run=0, prev=null; [...set].sort().forEach(ds=>{const d=new Date(ds+'T00:00:00');if(prev){const diff=(d-prev)/86400000;if(diff!==1)run=0}run++;best=Math.max(best,run);prev=d});
 return {current:count,best,activeToday:set.has(key(today)),dates:set};
}
function streakCard(){
 const s=calcStreak(); const days=[]; for(let i=6;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);const k=d.toISOString().slice(0,10);days.push({d,k,active:s.dates.has(k)})}
 const msg=s.activeToday?(s.current>=7?'🔥 رائع! حافظ على سلسلتك وواصل التقدم.':'✅ نشاط اليوم مسجل — عد غدًا للمحافظة على السلسلة.'):'⚠️ لم يُسجل نشاط اليوم بعد. أنجز نشاطًا واحدًا للحفاظ على السلسلة.';
 return `<div class="card streak-card"><div class="streak-head"><div><div class="title">🔥 سلسلة النشاط</div><div class="streak-number">${s.current} <span class="muted">يوم متتالي</span></div><div class="muted">أفضل سلسلة: ${s.best} يوم</div></div><div class="streak-fire">🔥</div></div><div class="streak-days">${days.map((x,i)=>`<span class="streak-day ${x.active?'active':''}" title="${x.k}">${x.active?'✓':(i+1)}</span>`).join('')}</div><div class="streak-note">${msg}</div></div>`;
}
function getDailyMission(){
 if(role!=='member'||!me)return null;
 const today=new Date().toISOString().slice(0,10);
 const subs=data.my_submissions||[];
 const approvedToday=subs.filter(x=>x.status==='approved').some(x=>String(x.approved_at||x.created_at||x.submitted_at||'').slice(0,10)===today);
 const pendingToday=subs.filter(x=>x.status==='pending').some(x=>String(x.created_at||x.submitted_at||'').slice(0,10)===today);
 const lessons=(trainingData?.lessons||[]).filter(x=>x.active!==false).sort((a,b)=>Number(a.lesson_no)-Number(b.lesson_no));
 const prog=trainingData?.my_progress||[];
 const nextLesson=lessons.find(l=>!prog.some(p=>String(p.lesson_id)===String(l.id)&&p.completed));
 if(nextLesson && prog.length===0){
   return {kind:'training',icon:'📚',title:'ابدأ رحلتك التعليمية',desc:`أكمل التدريب ${Number(nextLesson.lesson_no)} — ${esc(nextLesson.title)}`,reward:Number(nextLesson.reward_stars||0),action:`startTrainingLesson('${nextLesson.id}')`,label:'▶️ ابدأ التدريب'};
 }
 const ch=(data.challenges||[]).filter(c=>c.active!==false);
 // قاعدة مهمة: إذا أرسل العضو مهمة وما زالت معلقة، تبقى هي المهمة الوحيدة حتى قرار القائد.
 const pendingMission=subs.find(x=>x.status==='pending');
 if(pendingMission){
   const pc=ch.find(c=>String(c.id)===String(pendingMission.challenge_id||pendingMission.challengeId));
   if(pc)return {kind:'challenge',icon:'⏳',title:'بانتظار اعتماد إنجازك',desc:`تم إرسال «${esc(pc.title||'المهمة')}» للقائد. لا توجد مهمة جديدة حتى تتم الموافقة.`,reward:Number(pc.stars||0),action:'',label:''};
 }
 const priorities=[/استهلاك/i,/تواصل|استقطاب/i,/متابعة/i,/دعوة/i,/عرض المشروع/i,/تدريب/i,/عضو جديد/i];
 let candidate=null;
 for(const re of priorities){candidate=ch.find(c=>re.test(String(c.title||''))&&!subs.some(x=>String(x.challenge_id||x.challengeId)===String(c.id)&&x.status==='approved'&&String(x.approved_at||x.created_at||x.submitted_at||'').slice(0,10)===today));if(candidate)break;}
 if(!candidate)candidate=ch.find(c=>!subs.some(x=>String(x.challenge_id||x.challengeId)===String(c.id)&&x.status==='approved'&&String(x.approved_at||x.created_at||x.submitted_at||'').slice(0,10)===today));
 if(candidate){
   return {kind:'challenge',icon:'🎯',title:'خطوتك العملية اليوم',desc:esc(candidate.title||'أنجز تحديًا اليوم'),reward:Number(candidate.stars||0),action:`openChallengeSubmission('${candidate.id}')`,label:'🚀 ابدأ المهمة'};
 }
 if(approvedToday||pendingToday)return {kind:'done',icon:'🎉',title:'أحسنت! أنجزت نشاط اليوم',desc:'حافظ على سلسلة نشاطك، وغدًا لديك خطوة جديدة.',reward:0,action:'',label:''};
 return {kind:'done',icon:'🌱',title:'ابدأ نشاطك اليوم',desc:'اختر أي تحدٍّ متاح وابدأ أول خطوة.',reward:0,action:`switchTab('ch')`,label:'🎯 عرض التحديات'};
}

function memberActivitySnapshot(){

 const latest={};
 const note=(id,v)=>{if(!id||!v)return;const t=new Date(v).getTime();if(isFinite(t)&&(!latest[String(id)]||t>latest[String(id)]))latest[String(id)]=t};

 const activity= snap._days===null?0:(snap._days<=1?10:(snap._days<=3?8:(snap._days<=7?5:0)));

   achievements:Math.min(30,Math.round(approvedCount/10*30)),
   stars:Math.min(20,Math.round(stars/500*20)),
   training:Math.min(15,Math.round(trainingDone/8*15)),

   activity
 };

}

let communityAudioRecorder=null,communityAudioChunks=[];
async function communityRecordAudio(){
  try{
    if(communityAudioRecorder?.state==='recording'){
      communityAudioRecorder.stop();
      return;
    }
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    communityAudioChunks=[];
    communityAudioRecorder=new MediaRecorder(stream);
    communityAudioRecorder.ondataavailable=e=>{if(e.data.size)communityAudioChunks.push(e.data)};
    communityAudioRecorder.onstop=()=>{
      stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(communityAudioChunks,{type:'audio/webm'});
      const file=new File([blob],'تسجيل-صوتي-'+Date.now()+'.webm',{type:'audio/webm'});
      window.communityPendingFiles=[...(window.communityPendingFiles||[]),file];
      communityRenderPendingFiles();
      toast('تم تجهيز التسجيل الصوتي للإرسال.');
    };
    communityAudioRecorder.start();
    toast('جارٍ تسجيل الصوت... اضغط «تسجيل صوت» مرة أخرى لإيقاف التسجيل.');
  }catch(e){
    toast('تعذر الوصول إلى الميكروفون. تحقق من صلاحية المتصفح.');
  }
}
function communityChatParsePayload(value){
  const raw=String(value??'');
  const prefix='[[DXN_CHAT_V2]]';
  if(!raw.startsWith(prefix))return null;
  try{
    const data=JSON.parse(raw.slice(prefix.length));
    return data&&Array.isArray(data.attachments)?data:null;
  }catch(_){return null}
}
function communityChatAttachmentHtml(a){
  const url=communityEscapeHtml(a?.url||'');
  const name=communityEscapeHtml(a?.name||'مرفق');
  const type=String(a?.type||'').toLowerCase();
  if(!url)return '';
  if(type.startsWith('image/')) return '<a class="community-chat-attachment-image" href="'+url+'" target="_blank" rel="noopener"><img src="'+url+'" alt="'+name+'" loading="lazy"></a>';
  if(type.startsWith('video/')) return '<video class="community-chat-attachment-video" controls preload="metadata" src="'+url+'"></video>';
  if(type.startsWith('audio/')) return '<audio class="community-chat-attachment-audio" controls preload="metadata" src="'+url+'"></audio>';
  return '<a class="community-chat-attachment-file" href="'+url+'" target="_blank" rel="noopener" download>📎 '+name+'</a>';
}

function communityToggleBold(){

async function communityUploadFile(file){
  if(!file||!file.size)throw new Error('المرفق فارغ');
  if(file.size>4*1024*1024)throw new Error('حجم «'+file.name+'» أكبر من 4 ميغابايت');
  const token=String(localStorage.getItem('dxn_session')||'').trim();
  if(!token)throw new Error('انتهت جلسة الدخول. أعد تسجيل الدخول.');
  const response=await fetch('/api/community-chat-upload',{
    method:'POST',
    headers:{
      'Content-Type':file.type||'application/octet-stream',
      'X-DXN-Session':token,
      'X-DXN-File-Name':encodeURIComponent(file.name)
    },
    body:file,
    cache:'no-store'
  });
  const data=await response.json().catch(()=>({}));
  if(!response.ok||!data?.ok)throw new Error(data?.error||'تعذر رفع المرفق');
  return {url:data.url,path:data.path||'',name:data.name||file.name,type:data.type||file.type||'application/octet-stream',size:data.size||file.size};
}

  const files=[...(window.communityPendingFiles||[])];
  if(!text&&!files.length)return;
  const sendButton=e.submitter||document.querySelector('#communityChatModal .community-chat-send');
  if(sendButton)sendButton.disabled=true;
  try{
    let payload=text;
    if(files.length){
      const attachments=[];
      for(let i=0;i<files.length;i++){
        toast('جارٍ رفع المرفق '+(i+1)+' من '+files.length+'…');
        attachments.push(await communityUploadFile(files[i]));
      }
      payload='[[DXN_CHAT_V2]]'+JSON.stringify({text,attachments});
    }
    const saved=await communityChatRpc('community_chat_send',{p_message:payload});
    if(saved){
      if(input)input.value='';
      window.communityPendingFiles=[];
      communityRenderPendingFiles();
      const messages=await communityChatRpc('community_chat_list',{p_limit:100});
      if(messages)communityChatRender(messages);
      input?.focus();
    }
  }catch(error){
    toast(error?.message||'تعذر إرسال المرفق');
  }finally{
    if(sendButton)sendButton.disabled=false;
  }
}

async function communityMeetingRpc(fn,args){
  const token=String(localStorage.getItem('dxn_session')||'').trim();
  if(!token){toast('انتهت جلسة الدخول. أعد تسجيل الدخول.');return null}
  try{
    const response=await fetch('/api/rpc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fn,args:{...(args||{}),p_token:token,p_display_name:currentAccountName()}}),cache:'no-store'});
    const data=await response.json().catch(()=>({}));
    if(!response.ok||data?.error) throw new Error(data?.error||'تعذر تنفيذ العملية');
    return data;
  }catch(error){
    console.error('Community meeting:',error);
    toast(error?.message||'تعذر الاتصال بنظام اللقاءات.');
    return null;
  }
}
function communityMeetingLocalDate(iso){
  const d=new Date(iso);
  if(Number.isNaN(d.getTime())) return 'موعد غير صالح';
  return d.toLocaleString('ar-IQ',{dateStyle:'medium',timeStyle:'short'});
}

async function communitySaveMeeting(){
  const title=document.getElementById('cmTitle')?.value.trim();
  const date=document.getElementById('cmDate')?.value;
  const duration=Number(document.getElementById('cmDuration')?.value||60);
  const url=document.getElementById('cmUrl')?.value.trim()||'';
  const desc=document.getElementById('cmDesc')?.value.trim()||'';

  if(Number.isNaN(scheduled.getTime())||scheduled.getTime()<=Date.now()){toast('اختر موعدًا مستقبليًا للقاء.');return}
  if(duration<5||duration>720){toast('مدة اللقاء يجب أن تكون بين 5 و720 دقيقة.');return}
  const saved=await communityMeetingRpc('community_meeting_create',{p_title:title,p_scheduled_at:scheduled.toISOString(),p_duration_minutes:duration,p_description:desc,p_meeting_url:url});

function switchTrainingSubtab(next){
  if(next!=='home'&&next!=='lessons'&&next!=='ragwan_success_plan')return;
  trainingSubtab=next;
  saveDxnUiState({tab,trainingSubtab:next});
  try{
    render();
    const scrollToTrainingTarget=()=>{
      const target=next==='ragwan_success_plan'
        ? document.getElementById('ragwanIntroVideo')
        : document.getElementById('trainingLessonsStart');
      if(!target)return false;
      const sticky=document.querySelector('body.desktop-mode .tabs, body.mobile-mode .tabs');
      const offset=(sticky?sticky.getBoundingClientRect().height:0)+12;
      const scroller=document.scrollingElement||document.documentElement;
      const top=Math.max(0,scroller.scrollTop+target.getBoundingClientRect().top-offset);
      scroller.scrollTo({top,behavior:'smooth'});
      return true;
    };
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      scrollToTrainingTarget();
      [250,600,1000].forEach(ms=>setTimeout(scrollToTrainingTarget,ms));
    }));
  }catch(e){console.error(e);toast('تعذر فتح القسم: '+(e.message||e))}
}

/* حركة الباب السينمائية V2: انتقال حقيقي إلى المركز ثم تكبير ثم فتح */
.ragwan-door{
  transform-style:preserve-3d;
  perspective:1200px;
  overflow:visible!important;
  will-change:transform;
}
.ragwan-door-leaf{
  position:absolute;
  inset:0;
  display:block;
  overflow:hidden;
  border-radius:18px;
  transform-origin:right center;
  transform-style:preserve-3d;
  backface-visibility:hidden;
  z-index:3;
}
.ragwan-door.opening3d{
  z-index:100!important;
  animation:ragwanDoorMoveCenter 1.65s cubic-bezier(.16,.78,.2,1) forwards!important;
  box-shadow:0 40px 85px rgba(4,28,23,.58),0 0 0 4px rgba(240,199,88,.98),0 0 45px rgba(240,199,88,.58)!important;
}
.ragwan-door.opening3d .ragwan-door-leaf{
  animation:ragwanDoorLeafOpen .72s cubic-bezier(.2,.8,.18,1) 1.0s forwards;
}
.ragwan-door.opening3d .ragwan-door-image{
  filter:brightness(1.12) saturate(1.1);
}
.ragwan-door.opening3d:after{
  content:"";
  position:absolute;
  inset:-25px;
  border-radius:28px;
  background:radial-gradient(circle,rgba(255,225,112,.5),rgba(255,225,112,.14) 32%,transparent 68%);
  pointer-events:none;
  z-index:1;
  opacity:0;
  animation:ragwanDoorGlow .8s ease .9s forwards;
}
@keyframes ragwanDoorMoveCenter{
  0%{
    transform:translateX(0) translateY(0) scale(1);
  }
  38%{
    transform:translateX(var(--door-shift,0px)) translateY(-12px) scale(1.12);
  }
  58%{
    transform:translateX(var(--door-shift,0px)) translateY(-20px) scale(1.48);
  }
  100%{
    transform:translateX(var(--door-shift,0px)) translateY(-20px) scale(1.48);
  }
}
@keyframes ragwanDoorLeafOpen{
  0%{transform:rotateY(0deg);filter:brightness(1)}
  55%{transform:rotateY(-58deg);filter:brightness(.86)}
  100%{transform:rotateY(-112deg);filter:brightness(.58)}
}
@keyframes ragwanDoorGlow{
  0%{opacity:0;transform:scale(.8)}
  45%{opacity:1;transform:scale(1)}
  100%{opacity:.25;transform:scale(1.08)}
}

function ragwanProgressKey(){
  const memberKey=String((me&&(
    me.member_no||me.membership_no||me.membership_number||me.username||me.phone
  ))||'self').replace(/[^a-zA-Z0-9_-]/g,'_');
  return 'dxn_ragwan_progress_v2_'+memberKey;
}
// حساب معاينة خاص للمشرف: هذا الاستثناء مخصص لحساب واحد فقط لمراجعة تجربة العضو.
const RAGWAN_PREVIEW_MEMBER_NO='820469486';
function ragwanIsPreviewMember(){
  return role==='member' && String(me&&me.member_no||'').trim()===RAGWAN_PREVIEW_MEMBER_NO;
}

function ragwanProgressLoad(){
  const d=ragwanDoorData();
  let state={completed:[],started:[]};
  try{state=JSON.parse(localStorage.getItem(ragwanProgressKey())||'{}')||{};}catch(_){}
  state.completed=Array.isArray(state.completed)?state.completed.map(Number).filter(n=>n>=1&&n<=10):[];
  state.started=Array.isArray(state.started)?state.started.map(Number).filter(n=>n>=1&&n<=10):[];
  state.completed=[...new Set(state.completed)].sort((a,b)=>a-b);
  state.started=[...new Set(state.started)].sort((a,b)=>a-b);
  return state;
}
function ragwanProgressSave(state){
  try{localStorage.setItem(ragwanProgressKey(),JSON.stringify(state));}catch(_){}
}
function ragwanProgressNextStep(){
  const state=ragwanProgressLoad();
  return Math.max(1,Math.min(10,(state.completed.length<10?state.completed.length+1:10)));
}
function ragwanStepStatus(n,state){
  if(state.completed.includes(n))return 'completed';
  if(state.started.includes(n))return 'started';
  // الحساب التجريبي يرى جميع الأبواب المتاحة للمراجعة دون تغيير حالة الإنجاز الفعلية.
  return 'available';
}
function ragwanStatusLabel(status){
  return status==='completed'?'مكتملة':status==='started'?'قيد التنفيذ':status==='available'?'متاحة':'مغلقة';
}
function ragwanStepWord(n){
  return ['الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة','السابعة','الثامنة','التاسعة','العاشرة'][n-1]||n;
}
function ragwanRenderProgress(){
  const state=ragwanProgressLoad(),completed=state.completed.length,current=completed<10?completed+1:10,percent=Math.round(completed/10*100),remaining=10-completed;
  const bar=document.getElementById('ragwanRealProgress');
  if(bar)bar.style.width=percent+'%';
  const pct=document.getElementById('ragwanRealProgressPercent');if(pct)pct.textContent=percent+'%';
  const done=document.getElementById('ragwanRealProgressDone');if(done)done.textContent=completed;
  const cur=document.getElementById('ragwanRealProgressCurrent');if(cur)cur.textContent=completed<10?current:'—';
  const rem=document.getElementById('ragwanRealProgressRemaining');if(rem)rem.textContent=remaining;
  const stateLabel=document.getElementById('ragwanRealProgressState');if(stateLabel)stateLabel.textContent=completed===10?'🏆 الخطة مكتملة — أحسنت!':'الخطوة '+current+' هي خطوتك الحالية';
}

async function ragwanApproveStep4Email(){
  const input=document.getElementById('ragwanStep4SponsorEmail');
  const button=document.getElementById('ragwanStep4ApproveBtn');
  const status=document.getElementById('ragwanStep4Status');
  const approved=document.getElementById('ragwanStep4ApprovedStatus');
  const email=String((input&&input.value)||'').trim();
  const memberNo=String(me&&me.member_no||'').trim();
  const memberName=String(me&&(me.name||me.member_name)||'').trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    toast('⚠️ أدخل بريد الراعي الصحيح أولًا.');
    if(input)input.focus();
    return;
  }
  if(role==='member'&&(!/^\d{9}$/.test(memberNo)||!memberName)){
    toast('⚠️ تعذر إنشاء رابط الاختبار: بيانات عضويتك غير مكتملة.');
    if(status)status.textContent='⚠️ يجب أن يكون رقم العضوية والاسم متوفرين في حسابك.';
    return;
  }
  if(button){button.disabled=true;button.textContent='⏳ جارٍ الاعتماد...';}
  try{
    const memberNo=String(me&&me.member_no||'').trim();
    const memberName=String(me&&(me.name||me.member_name)||'').trim();
    if(role==='member'&&(!/^\d{9}$/.test(memberNo)||!memberName)){
      throw new Error('بيانات عضويتك غير مكتملة في الحساب.');
    }
    const res=await fetch('/api/google-form-prefill',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        sponsorEmail:email,
        memberName:role==='member'?memberName:'',
        membershipNumber:role==='member'?memberNo:''
      }),
      cache:'no-store'
    });
    const data=await res.json().catch(()=>null);
    if(!res.ok||!data?.prefilledUrl) throw new Error(String(data?.error||'تعذر إنشاء رابط الاختبار المعبّأ مسبقًا.'));
    localStorage.setItem(ragwanStep4StorageKey('sponsor_email'),email);
    localStorage.setItem(ragwanStep4StorageKey('form_id'),String(data.formId||''));
    localStorage.setItem(ragwanStep4StorageKey('form_url'),String(data.prefilledUrl));
    localStorage.removeItem(ragwanStep4StorageKey('form_copied'));
    localStorage.removeItem(ragwanStep4StorageKey('result_seen'));
    if(approved)approved.style.display='block';
    if(status)status.textContent='✅ تم اعتماد البريد. النموذج مرتبط بهذا الـSponsor داخليًا، وسيظهر اسمك ورقم عضويتك تلقائيًا في رابط الاختبار.';
    toast('✅ تم اعتماد بريد الراعي');
  }catch(err){
    if(status)status.textContent='❌ '+String(err?.message||err);
    toast('❌ تعذر اعتماد البريد');
  }finally{
    if(button){button.disabled=false;button.textContent='✅ اعتماد الإيميل';}
  }
}

function ragwanWelcomeRenderPreview(){
  const canvas=document.getElementById('ragwanWelcomeCanvas'), preview=document.getElementById('ragwanWelcomePreview');
  if(!canvas||!preview)return;

  const gender=document.getElementById('ragwanWelcomeGender')?.value||'male';
  const name=String(document.getElementById('ragwanWelcomeName')?.value||'').trim()||'عضو جديد';
  const memberNo=String(document.getElementById('ragwanWelcomeMemberNo')?.value||'').trim()||'................';
  const photo=document.getElementById('ragwanWelcomePhoto')?.files?.[0];

  const framePaths=gender==='female'
    ? ['/welcome_female_frame.png','/app/welcome_female_frame.png']
    : ['/welcome_male_frame.png','/app/welcome_male_frame.png'];

  function loadFrame(index){
    const framePath=framePaths[index];
    if(ragwanWelcomeFrameCache.src===framePath && ragwanWelcomeFrameCache.img && ragwanWelcomeFrameCache.img.complete){
      renderWithFrame(ragwanWelcomeFrameCache.img);
      return;
    }
    const frame=new Image();
    frame.onload=()=>{
      ragwanWelcomeFrameCache={src:framePath,img:frame};
      renderWithFrame(frame);
    };
    frame.onerror=()=>{
      if(index<framePaths.length-1){ loadFrame(index+1); return; }
      preview.removeAttribute('src');
      toast('⚠️ تعذر تحميل فريم الترحيب. تأكد من وجود ملف الفريم داخل GitHub.');
    };
    frame.src=framePath+'?v=20260925-2';
  }

  function renderWithFrame(frame){
    const w=frame.naturalWidth||1200,h=frame.naturalHeight||1600;
    canvas.width=w;canvas.height=h;
    const ctx=canvas.getContext('2d');
    ctx.clearRect(0,0,w,h);

    const finish=()=>{
      ctx.save();
      ctx.direction='rtl';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.lineJoin='round';

      ctx.font='900 '+Math.round(w*.029)+'px system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif';
      ctx.lineWidth=Math.max(3,Math.round(w*.0038));
      ctx.strokeStyle='#050505';
      ctx.fillStyle='#fff';
      ctx.strokeText(name,.568*w,.570*h);
      ctx.fillText(name,.568*w,.570*h);

      ctx.font='900 '+Math.round(w*.036)+'px system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif';
      ctx.lineWidth=Math.max(3,Math.round(w*.0042));
      ctx.strokeStyle='#050505';
      ctx.fillStyle='#fff';
      ctx.strokeText(memberNo,.568*w,.653*h);
      ctx.fillText(memberNo,.568*w,.653*h);
      ctx.restore();

      preview.src=canvas.toDataURL('image/png');
      preview.style.display='block';
      preview.style.width='100%';
      preview.style.maxWidth='100%';
      preview.style.height='auto';
      preview.style.objectFit='contain';
      preview.style.margin='0 auto';
      preview.style.cursor=(gender==='male' && photo)?'grab':'default';
      preview.style.touchAction=(gender==='male' && photo)?'none':'auto';
      preview.removeAttribute('title');

    };

    if(gender!=='male'||!photo){
      ctx.drawImage(frame,0,0,w,h);
      finish();
      return;
    }

    const drawMemberImage=(memberImg)=>{
        const frameLayer=document.createElement('canvas');
        frameLayer.width=w;frameLayer.height=h;
        const fctx=frameLayer.getContext('2d');
        fctx.drawImage(frame,0,0,w,h);

        let pixels;
        try{
          pixels=fctx.getImageData(0,0,w,h).data;
        }catch(err){
          toast('⚠️ تعذر قراءة فريم الترحيب.');
          ctx.drawImage(frame,0,0,w,h);
          finish();
          return;
        }

        /*
         * الفريم المرفوع قد يحتوي على شكل الشطرنج الخاص بمعاينة الشفافية
         * كألوان فعلية داخل PNG، وليس Alpha حقيقيًا.
         * لذلك نعتبر:
         * 1) الـ Alpha الشفاف الحقيقي، أو
         * 2) مربعات الشطرنج الرمادية المحايدة،
         * جزءًا من فتحة الصورة.
         */
        const isCheckerPixel=(r,g,b,a)=>{
          if(a<20)return true;
          const max=Math.max(r,g,b),min=Math.min(r,g,b);
          const neutral=(max-min)<=7;
          const light=(r>=145&&r<=255&&g>=145&&g<=255&&b>=145&&b<=255);
          return neutral&&light;
        };

        // نحدد فتحة الرجل فقط في المنطقة اليسرى من الفريم.
        const rx1=Math.floor(w*.01),rx2=Math.floor(w*.48);
        const ry1=Math.floor(h*.02),ry2=Math.floor(h*.78);

        const holeMask=document.createElement('canvas');
        holeMask.width=w;holeMask.height=h;
        const hmctx=holeMask.getContext('2d');
        const hd=hmctx.createImageData(w,h);

        let left=w,right=0,top=h,bottom=0,found=0;

        // نبني القناع من الشفافية/الشطرنج، مع استبعاد المناطق خارج الفتحة
        // بواسطة إهليلج تقريبي واسع فقط كحاجز أمان.
        const cx=w*.205,cy=h*.39;
        const rx=w*.205,ry=h*.39;

        for(let y=ry1;y<ry2;y++){
          for(let x=rx1;x<rx2;x++){
            const i=(y*w+x)*4;
            const a=pixels[i+3],r=pixels[i],g=pixels[i+1],b=pixels[i+2];
            const ellipse=((x-cx)*(x-cx))/(rx*rx)+((y-cy)*(y-cy))/(ry*ry)<=1.08;
            if(ellipse && isCheckerPixel(r,g,b,a)){
              hd.data[i]=255;hd.data[i+1]=255;hd.data[i+2]=255;hd.data[i+3]=255;
              found++;
              if(x<left)left=x;
              if(x>right)right=x;
              if(y<top)top=y;
              if(y>bottom)bottom=y;
            }
          }
        }

        // إذا كان الفريم Alpha حقيقيًا، نعيد بناء القناع من الـ Alpha داخل
        // المنطقة التي اكتشفناها أو من الإهليلج نفسه.
        if(found<1000){
          for(let y=ry1;y<ry2;y++){
            for(let x=rx1;x<rx2;x++){
              const i=(y*w+x)*4,a=pixels[i+3];
              if(a<20){
                const ellipse=((x-cx)*(x-cx))/(rx*rx)+((y-cy)*(y-cy))/(ry*ry)<=1.12;
                if(ellipse){
                  hd.data[i]=255;hd.data[i+1]=255;hd.data[i+2]=255;hd.data[i+3]=255;
                  found++;
                  if(x<left)left=x;
                  if(x>right)right=x;
                  if(y<top)top=y;
                  if(y>bottom)bottom=y;
                }
              }
            }
          }
        }

        if(found<1000){
          // احتياط أخير مطابق لمنطقة الفتحة في الفريم الذكري.
          left=Math.floor(w*.015);right=Math.floor(w*.395);
          top=Math.floor(h*.055);bottom=Math.floor(h*.735);
          for(let y=top;y<=bottom;y++){
            for(let x=left;x<=right;x++){
              const i=(y*w+x)*4;
              const xx=(x-left)/(right-left)-.5;
              const yy=(y-top)/(bottom-top)-.5;
              if((xx*xx)/.25+(yy*yy)/.25<=1){
                hd.data[i]=255;hd.data[i+1]=255;hd.data[i+2]=255;hd.data[i+3]=255;
              }
            }
          }
        }

        hmctx.putImageData(hd,0,0);

        /*
         * تنظيف أي بكسلات بيضاء/رمادية فاتحة عالقة داخل فتحة صورة العضو.
         * هذه البكسلات ليست جزءًا من زخرفة الفريم، وقد تظهر كخط أبيض
         * رفيع فوق حافة صورة العضو. نحذفها من طبقة الفريم فقط داخل الفتحة،
         * مع إبقاء باقي الفريم والزخارف دون أي تغيير.
         */
        try{
          const fd=fctx.getImageData(0,0,w,h);
          const md=hd.data;
          for(let i=0;i<fd.data.length;i+=4){
            if(md[i+3]===0) continue;
            const r=fd.data[i],g=fd.data[i+1],b=fd.data[i+2],a=fd.data[i+3];
            const neutral=(Math.max(r,g,b)-Math.min(r,g,b))<=12;
            const nearWhite=neutral && r>=238 && g>=238 && b>=238;
            if(nearWhite && a>0){
              fd.data[i+3]=0;
            }
          }
          fctx.putImageData(fd,0,0);
        }catch(_){}

        // نستخدم حدود القناع الفعلية لوضع صورة الرجل في منتصف الفتحة.
        if(right<=left||bottom<=top){
          left=Math.floor(w*.015);right=Math.floor(w*.395);
          top=Math.floor(h*.055);bottom=Math.floor(h*.735);
        }

        const holeW=right-left+1,holeH=bottom-top+1;
        const baseScale=Math.max(holeW/memberImg.naturalWidth,holeH/memberImg.naturalHeight);
        const scalePct=Math.max(10,Math.min(110,Number(document.getElementById('ragwanWelcomePhotoScale')?.value||75)));
        const scale=baseScale*(scalePct/100);
        const dw=memberImg.naturalWidth*scale,dh=memberImg.naturalHeight*scale;
        const dx=left+(holeW-dw)/2+ragwanWelcomePhotoOffsetX;
        const dy=top+(holeH-dh)/2+ragwanWelcomePhotoOffsetY;

        const photoLayer=document.createElement('canvas');
        photoLayer.width=w;photoLayer.height=h;
        const pctx=photoLayer.getContext('2d');
        pctx.drawImage(memberImg,dx,dy,dw,dh);

        pctx.globalCompositeOperation='destination-in';
        pctx.drawImage(holeMask,0,0);

        // صورة الرجل أولاً، ثم الفريم فوقها.
        ctx.drawImage(photoLayer,0,0,w,h);
        ctx.drawImage(frameLayer,0,0,w,h);
        finish();
    };

    const photoKey=photo.name+'|'+photo.size+'|'+photo.lastModified;
    if(ragwanWelcomeMemberCache.key===photoKey && ragwanWelcomeMemberCache.img && ragwanWelcomeMemberCache.img.complete){
      drawMemberImage(ragwanWelcomeMemberCache.img);
      return;
    }

    const reader=new FileReader();
    reader.onload=e=>{
      const memberImg=new Image();
      memberImg.onload=()=>{
        ragwanWelcomeMemberCache={key:photoKey,img:memberImg};
        drawMemberImage(memberImg);
      };
      memberImg.onerror=()=>toast('⚠️ تعذر قراءة صورة العضو. اختر الصورة مرة أخرى.');
      memberImg.src=String(e.target.result||'');
    };
    reader.onerror=()=>toast('⚠️ تعذر قراءة صورة العضو.');
    reader.readAsDataURL(photo);
  }

  loadFrame(0);
}
function ragwanBindWelcomePhotoDrag(){
  const preview=document.getElementById('ragwanWelcomePreview');
  if(!preview || preview.dataset.dragBound==='1') return;
  preview.dataset.dragBound='1';

  preview.addEventListener('pointerdown',e=>{
    const gender=document.getElementById('ragwanWelcomeGender')?.value||'male';
    const photo=document.getElementById('ragwanWelcomePhoto')?.files?.[0];
    if(gender!=='male'||!photo) return;
    e.preventDefault();
    preview.setPointerCapture?.(e.pointerId);
    ragwanWelcomeDragState={
      pointerId:e.pointerId,
      startX:e.clientX,
      startY:e.clientY,
      startOffsetX:ragwanWelcomePhotoOffsetX,
      startOffsetY:ragwanWelcomePhotoOffsetY,
      raf:0
    };
    preview.style.cursor='grabbing';
  });

  preview.addEventListener('pointermove',e=>{
    if(!ragwanWelcomeDragState || e.pointerId!==ragwanWelcomeDragState.pointerId) return;
    e.preventDefault();
    const rect=preview.getBoundingClientRect();
    const canvas=document.getElementById('ragwanWelcomeCanvas');
    const scaleX=canvas&&rect.width ? canvas.width/rect.width : 1;
    const scaleY=canvas&&rect.height ? canvas.height/rect.height : scaleX;
    ragwanWelcomePhotoOffsetX=ragwanWelcomeDragState.startOffsetX+(e.clientX-ragwanWelcomeDragState.startX)*scaleX;
    ragwanWelcomePhotoOffsetY=ragwanWelcomeDragState.startOffsetY+(e.clientY-ragwanWelcomeDragState.startY)*scaleY;
    if(!ragwanWelcomeDragState.raf){
      ragwanWelcomeDragState.raf=requestAnimationFrame(()=>{
        if(ragwanWelcomeDragState) ragwanWelcomeRenderPreview();
        if(ragwanWelcomeDragState) ragwanWelcomeDragState.raf=0;
      });
    }
  });

  const endDrag=()=>{
    if(!ragwanWelcomeDragState) return;
    if(ragwanWelcomeDragState.raf) cancelAnimationFrame(ragwanWelcomeDragState.raf);
    ragwanWelcomeDragState=null;
    preview.style.cursor='grab';
  };
  preview.addEventListener('pointerup',endDrag);
  preview.addEventListener('pointercancel',endDrag);
  preview.addEventListener('lostpointercapture',endDrag);
}

async function ragwanWelcomeCopyPost(){
  const canvas=document.getElementById('ragwanWelcomeCanvas');
  if(!canvas||!canvas.width){toast('⚠️ جهّز صورة الترحيب أولًا.');return;}
  canvas.toBlob(async blob=>{
    if(!blob){toast('⚠️ تعذر تجهيز صورة الترحيب.');return;}
    const msg=ragwanWelcomeMessage({
      gender:document.getElementById('ragwanWelcomeGender')?.value||'male',
      name:document.getElementById('ragwanWelcomeName')?.value,
      memberNo:document.getElementById('ragwanWelcomeMemberNo')?.value,
      country:document.getElementById('ragwanWelcomeCountry')?.value,
      city:document.getElementById('ragwanWelcomeCity')?.value
    });

    try{
      // على الهاتف: مشاركة الصورة والنص معًا عبر Web Share API.
      if(navigator.share && navigator.canShare){
        const file=new File([blob],'welcome-member.png',{type:'image/png'});
        if(navigator.canShare({files:[file]})){
          await navigator.share({
            text:msg,
            files:[file],
            title:'ترحيب بعضو جديد'
          });
          toast('✅ تمت مشاركة المنشور مع الصورة.');
          return;
        }
      }

      // على سطح المكتب: انسخ النص والصورة معًا إلى الحافظة.
      // يدعم Chrome/Edge صيغة ClipboardItem متعددة الأنواع، مما يسمح
      // بلصق النص والصورة معًا في التطبيقات التي تدعم ذلك.
      if(navigator.clipboard?.write && window.ClipboardItem){
        const item=new ClipboardItem({
          'text/plain':new Blob([msg],{type:'text/plain'}),
          'image/png':blob
        });
        await navigator.clipboard.write([item]);
        toast('✅ تم نسخ المنشور مع الصورة. يمكنك الآن لصقه مباشرة.');
        return;
      }

      throw new Error('clipboard_write_unsupported');
    }catch(e){
      // بديل آمن: نسخ النص وتنزيل الصورة.
      try{
        if(navigator.clipboard?.writeText){
          await navigator.clipboard.writeText(msg);
        }else{
          const ta=document.createElement('textarea');
          ta.value=msg;
          ta.style.position='fixed';
          ta.style.opacity='0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
        }

        const a=document.createElement('a');
        const objectUrl=URL.createObjectURL(blob);
        a.href=objectUrl;
        a.download='welcome-member.png';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(()=>URL.revokeObjectURL(objectUrl),1000);

        toast('ℹ️ تم نسخ النص وتنزيل الصورة. إذا لم يدعم المتصفح النسخ معًا، أرفق الصورة ثم الصق النص.');
      }catch(_){
        toast('⚠️ تعذر نسخ المنشور وتجهيز الصورة.');
      }
    }
  },'image/png');
}

let ragwanWelcomeGender='';
function ragwanRenderWelcomeImage(name,no){
  const canvas=document.getElementById('ragwanWelcomeCanvas');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  if(!ctx)return;
  const img=new Image();
  img.onload=()=>{
    const w=img.naturalWidth||1254,h=img.naturalHeight||1254;
    canvas.width=w;canvas.height=h;
    ctx.clearRect(0,0,w,h);
    ctx.drawImage(img,0,0,w,h);
    const cx=Math.round(w/2);
    ctx.fillStyle='#fff';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.direction='rtl';
    ctx.font='900 46px "Segoe UI",Tahoma,Arial,sans-serif';
    ctx.shadowColor='rgba(0,0,0,.55)';
    ctx.shadowBlur=5;
    ctx.fillText(String(name||'العضو الجديد').trim(),cx,766);
    ctx.direction='ltr';
    ctx.font='900 44px "Segoe UI",Tahoma,Arial,sans-serif';
    ctx.fillText(String(no||'......').trim(),cx,904);
    ctx.shadowColor='transparent';
    ctx.shadowBlur=0;
  };
  img.onerror=()=>{
    canvas.width=1254;canvas.height=1254;
    ctx.clearRect(0,0,1254,1254);
    ctx.fillStyle='#111';ctx.fillRect(0,0,1254,1254);
    ctx.fillStyle='#f2bf4a';ctx.font='900 34px system-ui,sans-serif';ctx.textAlign='center';ctx.direction='rtl';
    ctx.fillText('تعذر تحميل قالب الترحيب',627,627);
  };
  img.src='/ragwan-welcome-template.png?v=20260923-2';
}

function ragwanGetWelcomeBlob(){
  return new Promise((resolve,reject)=>{
    const canvas=document.getElementById('ragwanWelcomeCanvas');
    if(!canvas){reject(new Error('canvas not found'));return;}
    canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('image conversion failed')),'image/png');
  });
}
function ragwanCopyWelcomeImage(){

function ragwanSubmitStepTest(){
  const step=ragwanCurrentStep,qs=ragwanStepTests[step]||[];
  let score=0,missing=false;
  qs.forEach((x,i)=>{const checked=document.querySelector('input[name="ragwanTest_'+step+'_'+i+'"]:checked');if(!checked)missing=true;else if(Number(checked.value)===x.c)score++;});
  const status=document.getElementById('ragwanTestStatus');
  if(missing){if(status)status.textContent='⚠️ أجب عن جميع الأسئلة أولًا.';return;}
  if(score<qs.length){if(status)status.textContent='❌ نتيجتك '+score+' / '+qs.length+' — راجع المواد وأعد المحاولة.';return;}
  localStorage.setItem('dxn_ragwan_test_v1_'+step,'passed');
  if(status)status.textContent='🟢 ممتاز — اجتزت الاختبار بالكامل.';
  ragwanRenderStepTest();ragwanOpenDoor(step);
}

async function ragwanCopyStepResourceImage(url,name){
  const u=String(url||'').trim();
  if(!u){toast('⚠️ لا يوجد رابط للصورة.');return;}
  try{
    const res=await fetch(u,{mode:'cors',cache:'no-store'});
    if(!res.ok)throw new Error('تعذر تحميل الصورة.');
    const blob=await res.blob();
    if(!String(blob.type||'').startsWith('image/'))throw new Error('هذا الملف ليس صورة.');
    let copyBlob=blob;
    let mime=String(blob.type||'image/png').toLowerCase();

    // بعض المتصفحات تقبل image/png بشكل موثوق أكثر من بقية صيغ الصور.
    if(mime!=='image/png'){
      try{
        const bitmap=await createImageBitmap(blob);
        const canvas=document.createElement('canvas');
        canvas.width=bitmap.width;
        canvas.height=bitmap.height;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(bitmap,0,0);
        copyBlob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
        if(!copyBlob)copyBlob=blob;
        mime=String(copyBlob.type||'image/png');
        bitmap.close?.();
      }catch(_){}
    }

    if(!navigator.clipboard?.write || typeof ClipboardItem==='undefined'){
      throw new Error('المتصفح لا يدعم نسخ الصور مباشرة إلى الحافظة.');
    }

    const item=new ClipboardItem({[mime]:copyBlob});
    await navigator.clipboard.write([item]);
    toast('✅ تم نسخ الصورة. يمكنك لصقها مباشرة في واتساب أو تلغرام.');
  }catch(e){
    toast('⚠️ تعذر نسخ الصورة مباشرة. '+String(e.message||'حاول مرة أخرى.'));
  }
}

function ragwanFileIcon(file){

function ragwanRenderFiles(files){
  const el=document.getElementById('ragwanFilesList');if(!el)return;
  if(!files.length){el.innerHTML='<div class="muted">لا توجد ملفات مضافة حتى الآن.</div>';return;}
  const ordered=[...files].sort((a,b)=>{
    const an=String(a?.name||'');
    const bn=String(b?.name||'');
    const am=an.match(/(\d+)/);
    const bm=bn.match(/(\d+)/);
    if(am&&bm)return Number(am[1])-Number(bm[1]);
    if(am)return -1;
    if(bm)return 1;
    return an.localeCompare(bn,'ar',{numeric:true,sensitivity:'base'});
  });
  el.innerHTML=ordered.map(f=>{
    const mime=String(f.mime||'').toLowerCase(),url=String(f.url||'');

  if(f?.url)lines.push('🔗 رابط الصورة: '+String(f.url));
  const text=lines.join('\n');

async function ragwanUploadFiles(fileList){
  const files=Array.from(fileList||[]);if(!files.length)return;
  const status=document.getElementById('ragwanUploadStatus'),input=document.getElementById('ragwanFileInput');
  try{
    if(files.some(f=>f.size>50*1024*1024))throw new Error('لا يمكن رفع ملف أكبر من 50 MB.');
    if(status)status.textContent='⏳ جارٍ تجهيز الرفع...';
    for(let i=0;i<files.length;i++){
      const f=files[i];
      if(status)status.textContent=`⏳ جارٍ رفع الملف ${i+1} من ${files.length}: ${f.name}`;
      const signed=await ragwanPlanApi('sign_upload',{name:f.name,content_type:f.type||'application/octet-stream',size:f.size});
      if(!signed.token||!signed.path)throw new Error('لم يتم إنشاء رابط الرفع.');
      const {error}=await sb.storage.from('ragwan-plan').uploadToSignedUrl(signed.path,signed.token,f,{contentType:f.type||'application/octet-stream'});
      if(error)throw error;
    }
    if(status)status.textContent='✅ تم رفع الملفات بنجاح.';
    if(input)input.value='';
    await ragwanLoadFiles();
  }catch(e){if(status)status.textContent='❌ '+(e.message||'تعذر رفع الملف.');}
}

  const m=s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{6,})/i);
  if(m)id=m[1];
  return id?`https://www.youtube.com/embed/${id}?cc_load_policy=1&cc_lang_pref=ar`:'';
}

function loadYouTubeAPI(){
  if(window.YT&&YT.Player)return Promise.resolve();
  if(window.__dxnYouTubePromise)return window.__dxnYouTubePromise;
  window.__dxnYouTubePromise=new Promise((resolve,reject)=>{
    const finish=()=>{if(window.YT&&YT.Player)resolve();else reject(new Error('YouTube API غير متاحة'));};
    const script=document.createElement('script');
    script.src='https://www.youtube.com/iframe_api';
    script.async=true;
    script.onload=()=>{
      let tries=0;
      const timer=setInterval(()=>{
        if(window.YT&&YT.Player){clearInterval(timer);finish();}
        else if(++tries>80){clearInterval(timer);reject(new Error('تعذر تحميل مشغل YouTube'));}
      },100);
    };
    script.onerror=()=>reject(new Error('تعذر تحميل مشغل YouTube'));
    document.head.appendChild(script);
  });
  return window.__dxnYouTubePromise;
}
function waitForYouTubePlayer(l){
  loadYouTubeAPI().then(()=>{
      const iframeId='trainingYoutubePlayer';
      const player=new YT.Player(iframeId,{
        videoId:trainingWatch.videoId,
        playerVars:{rel:0,cc_load_policy:1,cc_lang_pref:'ar',playsinline:1,disablekb:0},
        events:{
          onReady:()=>beginTrainingWatch(player,l.id),
          onStateChange:(e)=>{
            if(e.data===YT.PlayerState.ENDED) finishTrainingWatch(l.id,player);
          }
        }
      });
  }).catch(e=>{updateTrainingWatchStatus('⚠️ تعذر تحميل الفيديو. حاول مرة أخرى.',true);console.error(e);});
}
function beginTrainingWatch(player,lessonId){
  trainingWatch.player=player;
  const duration=Number(player.getDuration()||0);
  const saved=(trainingData?.my_progress||[]).find(x=>String(x.lesson_id)===String(lessonId));
  // آخر نقطة مسجلة للمشاهدة الفعلية تصبح حدّ التقديم اليدوي المسموح.
  // الرجوع للخلف لا يخفض هذا الحد، لذلك يستطيع العضو العودة إلى آخر نقطة وصل إليها سابقًا.
  const savedSeconds=Number(saved?.current_seconds||0);
  const savedPercent=Number(saved?.watch_percent||0);
  const savedFromPercent=duration>0?savedPercent/100*duration:0;
  trainingWatch.maxWatchedSeconds=Math.max(savedSeconds,savedFromPercent,0);
  trainingWatch.lastSampleSeconds=Number(player.getCurrentTime()||0);
  trainingWatch.timer=setInterval(()=>sampleTrainingWatch(lessonId),1000);
  trainingWatch.guardTimer=setInterval(()=>guardTrainingSeek(),250);
  updateTrainingWatchStatus('▶️ الفيديو جاهز. يمكنك الرجوع لأي فقرة، ويمكنك التقديم يدويًا فقط حتى آخر نقطة شاهدتها فعليًا.');
}
function guardTrainingSeek(){
  const p=trainingWatch.player;
  if(!p||trainingWatch.invalid||trainingWatch.suppressSeek||!p.getCurrentTime)return;
  const current=Number(p.getCurrentTime()||0);
  const max=Number(trainingWatch.maxWatchedSeconds||0);
  // الرجوع مسموح بالكامل؛ المنع يطبق فقط عند القفز إلى الأمام خارج المنطقة التي تمت مشاهدتها.
  if(current>max+1.5){
    trainingWatch.suppressSeek=true;
    try{p.seekTo(Math.max(0,max),true)}catch(e){}
    setTimeout(()=>{trainingWatch.suppressSeek=false},350);
    updateTrainingWatchStatus(`⏪ يمكنك التقديم فقط حتى آخر نقطة شاهدتها فعليًا (${Math.floor(max)} ثانية). الرجوع وإعادة الاستماع مسموحان.`,true);
  }
}
async function sampleTrainingWatch(lessonId){
  const p=trainingWatch.player;
  if(!p||!p.getDuration)return;
  const duration=Number(p.getDuration()||0), current=Number(p.getCurrentTime()||0);
  if(!duration)return;
  if(!trainingWatch.suppressSeek && current<=Number(trainingWatch.maxWatchedSeconds||0)+1.5){
    trainingWatch.maxWatchedSeconds=Math.max(Number(trainingWatch.maxWatchedSeconds||0),current);
  }
  const state=p.getPlayerState();
  const pct=Math.min(100,Number(trainingWatch.maxWatchedSeconds||current)/duration*100);
  if(state===YT.PlayerState.PLAYING){
    // نرسل أعلى نقطة مشاهدة مثبتة؛ التقديم اليدوي داخل هذه المنطقة مسموح، ولا يرفع الحد إلا بالمشاهدة الفعلية.
    try{
      const result=await rpc('update_training_progress',{
        p_token:token,p_lesson:lessonId,p_watch_percent:pct,p_current_seconds:Math.min(current,Number(trainingWatch.maxWatchedSeconds||current)),
        p_duration_seconds:duration,p_completed:false
      });
      if(result?.seek_detected){
        // حماية خادمية إضافية: لا نعاقب العضو على الرجوع ثم التقدم إلى نقطة سبق أن شاهدها.
        trainingWatch.suppressSeek=true;
        try{p.seekTo(Math.max(0,Number(trainingWatch.maxWatchedSeconds||0)),true)}catch(e){}
        setTimeout(()=>{trainingWatch.suppressSeek=false},350);
        updateTrainingWatchStatus(`⏪ التقديم مسموح حتى آخر نقطة مشاهدة مثبتة فقط (${Math.floor(Number(trainingWatch.maxWatchedSeconds||0))} ثانية).`,true);
      }else{
        updateTrainingWatchStatus(`▶️ تمت مشاهدة ${pct.toFixed(0)}% — أكمل حتى النهاية.`);
      }
    }catch(e){}
  }
}
async function finishTrainingWatch(lessonId,player){
  if(trainingWatch.invalid)return;
  const duration=Number(player.getDuration()||0);
  if(!duration)return;
  try{
    // عند انتهاء فيديو YouTube نرسل النهاية الفعلية. الخادم يتحقق من
    // التقدم المتراكم وعدم وجود تقديم يدوي قبل اعتماد الإكمال.
    const result=await rpc('update_training_progress',{
      p_token:token,p_lesson:lessonId,p_watch_percent:100,p_current_seconds:Math.max(0,duration-0.25),
      p_duration_seconds:duration,p_completed:true
    });
    if(result?.completed){
      const rewardText=result?.stars_awarded ? ` 🎁 تمت إضافة ⭐${Number(result.reward_stars||0)} إلى رصيدك.` : '';
      updateTrainingWatchStatus(`🎉 اكتملت المشاهدة 100% — تم فتح التدريب التالي في التسلسل.${rewardText}`,false,true);
      if(trainingWatch.timer){clearInterval(trainingWatch.timer);trainingWatch.timer=null;}
      setTimeout(async()=>{closeTraining();await refresh()},1200);
    }else{
      trainingWatch.invalid=true;
      updateTrainingWatchStatus('⚠️ لم يتم اعتماد الإكمال لأن المشاهدة الكاملة لم تُثبت. أعد التدريب من البداية.',true);
    }
  }catch(e){toast(e.message||'تعذر اعتماد إكمال التدريب')}
}
function updateTrainingWatchStatus(msg,bad=false,done=false){
  const el=$('trainingWatchStatus'); if(!el)return;
  el.innerHTML=`<b>${msg}</b>${bad?`<div style="margin-top:10px"><button class="danger" onclick="restartTrainingWatch()">🔄 إعادة التدريب من البداية</button></div>`:done?'':`<div class="muted" style="margin-top:5px">لن يفتح التدريب التالي إلا بعد المشاهدة الكاملة.</div>`}`;
}
async function restartTrainingWatch(){
  const id=trainingWatch.lessonId;
  try{await rpc('reset_training_progress',{p_token:token,p_lesson:id});await refresh();closeTraining();setTimeout(()=>startTrainingLesson(id),150)}catch(e){toast(e.message||'تعذر إعادة التدريب')}
}
function closeTraining(){
  if(trainingWatch.timer){clearInterval(trainingWatch.timer);trainingWatch.timer=null;}
  if(trainingWatch.guardTimer){clearInterval(trainingWatch.guardTimer);trainingWatch.guardTimer=null;}
  if(trainingWatch.player&&trainingWatch.player.destroy){try{trainingWatch.player.destroy()}catch(e){}}
  trainingWatch={player:null,timer:null,guardTimer:null,lessonId:null,videoId:null,invalid:false,maxWatchedSeconds:0,lastSampleSeconds:0,suppressSeek:false};
  $('trainingModal')?.remove();
}

function openTrainingManager(){

async function sendMonthlyPointsEvidence(v){
 const btn=document.getElementById('sendMonthlyPointsEvidenceBtn');
 const status=document.getElementById('monthlyPointsSendStatus');
 if(btn){btn.disabled=true;btn.style.opacity='.65';btn.style.cursor='wait';}
 if(status)status.textContent='⏳ جارٍ رفع الصورة وإرسال الطلب للمراجعة...';

  const res=await fetch(endpoint,{method:'POST',headers:{'apikey':C.SUPABASE_ANON_KEY||''},body:fd});
  const text=await res.text();
  let out={};try{out=JSON.parse(text)}catch{}
  if(!res.ok||!out.ok)throw new Error(out.error||`تعذر إرسال الإثبات (${res.status})`);
  setLocalMonthlyPointsPending({request_id:out.request_id||'',requested_points:Number(v),month_key:currentMonthKey(),created_at:new Date().toISOString()});
  if(status)status.textContent='✅ تم إرسال الطلب بنجاح. بانتظار مراجعة القائد.';

 }catch(e){

 }

function teams(){
 const teams=data.teams||[], members=data.members||[];
 const teamStarsById=members.reduce((acc,m)=>{const keys=[m.team_id,m.teamId,m.team_name].filter(Boolean).map(String);keys.forEach(k=>acc[k]=(acc[k]||0)+Number(m.stars||0));return acc},{});
 const rankingTeams=teams.filter(t=>t.active!==false).map(t=>({...t, stars:Number(teamStarsById[String(t.id)]||teamStarsById[String(t.name)]||0)}));
 const rankingMembers=members.filter(m=>m.active!==false);
 if(role!=='leader') return `<div class="card"><div class="title">🏆 ترتيب الفرق</div>${rankingTeams.map((t,i)=>`<div class="row"><div><b>#${i+1} ${esc(t.name)}</b><div class="muted">👥 ${t.members||0} · 🎯 ${t.approved_challenges||0} إنجاز</div></div><span class="stars">⭐ ${t.stars||0}</span></div>`).join('')||'<div class="empty">لا توجد فرق نشطة.</div>'}</div><div class="card"><div class="title">⭐ المتصدرون</div>${rankingMembers.map((m,i)=>`<div class="row"><div><b>#${i+1} ${esc(m.name)}</b><div class="muted">${esc(m.team_name||'بدون فريق')} · 🪪 ${esc(m.member_no)}</div></div><span class="stars">⭐ ${m.stars||0}</span></div>`).join('')||'<div class="empty">لا يوجد أعضاء نشطون.</div>'}</div>`;
 const teamCenter=(()=>{
  const activeMembers=members.filter(m=>m.active!==false);
  const snaps=memberActivitySnapshot();
  const monthRows=data.monthly||[];
  const now=Date.now(), day=86400000;
  const byTeam={};
  teams.filter(t=>t.active!==false).forEach(t=>byTeam[String(t.id)]={team:t,members:[],stars:0,approved:0,target:0,active7:0,ratingSum:0,ratingCount:0});

function leaderDailyPlan(){
  const members=data.members||[], subs=data.my_submissions||[], mp=(data.trainingData&&data.trainingData.member_progress)||[];
  const now=Date.now(), day=86400000;
  const activeSubs=subs.filter(s=>s.status==='approved');
  const rows=members.filter(m=>m.active!==false).map(m=>{
    const id=String(m.id||m.member_id||'');
    const ms=activeSubs.filter(s=>String(s.member_id||s.memberId||'')===id).map(s=>new Date(s.created_at||s.createdAt||s.approved_at||0).getTime()).filter(Boolean);
    const mt=mp.filter(x=>String(x.member_id||x.memberId||'')===id).map(x=>new Date(x.last_update_at||x.last_watched_at||x.updated_at||0).getTime()).filter(Boolean);
    const last=Math.max(0,...ms,...mt);
    const joinedAt=new Date(m.joined_at||m.joinedAt||m.membership_date||m.membershipDate||m.created_at||m.createdAt||0).getTime();
    const joinedDays=joinedAt?Math.max(0,Math.floor((now-joinedAt)/day)):null;
    const days=last?Math.max(0,Math.floor((now-last)/day)):null;
    let priority=0, reason='';
    const pending=subs.some(s=>String(s.member_id||s.memberId||'')===id&&s.status==='pending');
    const dxn=Number(m.dxn_points||m.monthly_dxn_points||0);
    if(pending){priority=100;reason='إنجاز بانتظار اعتماد القائد';}
    else if(dxn>=80&&dxn<100){priority=90;reason=`اقترب من التارجت: ${dxn}/100 نقطة DXN`}
    else if(dxn>=100){priority=70;reason='حقق التارجت الشهري — يحتاج تشجيعًا واستثمار الإنجاز';}
    else if(days!==null&&days>=7){priority=85;reason=`لا يوجد نشاط منذ ${days} أيام`;}
    else if(days!==null&&days>=3){priority=60;reason=`يحتاج دفعة نشاط — آخر نشاط منذ ${days} أيام`;}
    else if(!last){priority=50;reason=joinedDays!==null?`لم يبدأ النشاط بعد — العضوية منذ ${joinedDays} أيام`:'لم يبدأ النشاط بعد — تاريخ العضوية غير مسجل';}
    else {priority=20;reason='نشط — متابعة خفيفة وتشجيع';}
    return {...m,_priority:priority,_reason:reason,_days:days};
  }).sort((a,b)=>b._priority-a._priority).slice(0,8);
  const top=rows.slice(0,5);
  return `<div class="card smart-plan" style="border:2px solid rgba(11,107,87,.16);background:linear-gradient(180deg,#fff,#f7fbf9)">
    <div class="title">🗓️ خطة العمل اليومية للقائد</div>
    <p class="muted">قائمة عملية مرتبة حسب الأولوية، لتعرف من يستحق اهتمامك اليوم وما الإجراء الأنسب معه.</p>
    ${top.length?`<div style="display:grid;gap:10px">${top.map((m,i)=>`<div style="padding:14px;border:1px solid #e5e7eb;border-radius:14px;background:#fff;display:flex;gap:12px;align-items:center"><div style="font-size:22px;font-weight:900;min-width:30px">${i+1}</div><div style="flex:1"><b>${esc(m.name||'عضو')}</b><div class="muted" style="margin-top:4px">${esc(m._reason)}</div></div><span class="badge" style="white-space:nowrap">${m._priority>=85?'🔴 عاجلة':m._priority>=60?'🟠 مهمة':'🟢 متابعة'}</span></div>`).join('')}</div>`:'<div class="empty">لا توجد مهام متابعة حاليًا.</div>'}
    <div class="muted" style="margin-top:12px">💡 ابدأ بالأولوية الأولى، ثم انتقل بالتسلسل. الهدف هو بناء عادة متابعة يومية بسيطة ومنتظمة.</div>
  </div>`;
}


const DXN_SYNC_ALIASES={
  member_no:['member_no','member number','membernumber','رقم العضوية','رقم العضو','رقم عضوية dxn','رقم عضوية','العضوية','الرمز'],
  member_name:['member_name','member name','name','الاسم','اسم العضو','اسم العضوية','الاسم الكامل'],
  sponsor_member_no:['sponsor_member_no','sponsor number','sponsor member no','رقم الراعي','رقم المسجل','رقم المشرف','الراعي رقم'],
  sponsor_name:['sponsor_name','sponsor name','اسم الراعي','اسم المسجل','اسم المشرف','الراعي'],
  generation:['generation','gen','الجيل'],
  rank:['rank','الرتبة','المرتبة','المستوى'],
  dxn_status:['dxn_status','dxn status','status','حالة dxn','حالة العضوية','الحالة'],
  downline_status:['downline_status','downline status','حالة الفريق','حالة الخط','حالة الداونلاين'],
  join_date:['join_date','join date','date joined','تاريخ الانضمام','تاريخ الاشتراك','تاريخ العضوية'],
  personal_pv:['personal_pv','personal pv','pv','pv الشخصي','الـpv','النقاط الشخصية','النقاط الشخصيه'],
  personal_group_pv:['personal_group_pv','personal group pv','pgpv','pv المجموعة الشخصية','pv المجموعة الشخصيه','pv شخصي جماعي'],
  total_group_pv:['total_group_pv','total group pv','group pv','إجمالي pv المجموعة','اجمالي pv المجموعة','مجموع pv المجموعة','إجمالي المجموعة','مجموع المجموعة'],
  accumulated_group_pv:['accumulated_group_pv','accumulated group pv','group accumulated pv','accumulated pv','التراكمي','النقاط التراكمية','التراكمي للمجموعة','تراكمي المجموعة'],
  accumulated_promotion_pv:['accumulated_promotion_pv','accumulated promotion pv','promotion pv','promotion','تراكمي الترقية','التراكمي للترقية','تراكمي الترفيع'],
  diamond_group_pv:['diamond_group_pv','diamond group pv','diamond pv','diamond','pv الماس','المجموعة الماسية','الماس']
};
let dxnSyncRows=[];
let dxnSyncInvalid=[];
let dxnSyncDuplicates=0;
let dxnSyncHeaders=[];

function dxnSyncNorm(v){
  return String(v??'')
    .toLowerCase()
    .replace(/[\u064B-\u065F\u0670]/g,'')
    .replace(/ـ/g,'')
    .replace(/[_\-\/\\()[\]{}:.,]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function dxnSyncDigits(v){
  return String(v??'').replace(/[٠-٩]/g,ch=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(ch))).trim();
}
function dxnSyncHeaderIndex(headers,aliases){
  const set=new Set(aliases.map(dxnSyncNorm));
  for(let i=0;i<headers.length;i++) if(set.has(dxnSyncNorm(headers[i]))) return i;
  return -1;
}
function dxnSyncParseGrid(text){
  const first=String(text||'').replace(/^\uFEFF/,'').split(/\r?\n/).find(x=>x.trim()!=='')||'';
  const tab=(first.match(/\t/g)||[]).length;
  const comma=(first.match(/,/g)||[]).length;
  const semi=(first.match(/;/g)||[]).length;
  const sep=tab>0?'\t':(comma>=semi&&comma>0?',':(semi>0?';':''));
  if(!sep) return String(text||'').split(/\r?\n/).filter(x=>x.trim()!=='').map(x=>[x.trim()]);
  const rows=[]; let row=[], cell='', quoted=false;
  const src=String(text||'').replace(/\r/g,'');
  for(let i=0;i<src.length;i++){
    const ch=src[i];
    if(ch==='"'){
      if(quoted&&src[i+1]==='"'){cell+='"';i++}
      else quoted=!quoted;
    }else if(ch===sep&&!quoted){
      row.push(cell);cell='';
    }else if(ch==='\n'&&!quoted){
      row.push(cell);rows.push(row);row=[];cell='';
    }else{
      cell+=ch;
    }
  }
  row.push(cell); if(row.some(x=>String(x).trim()!=='')) rows.push(row);
  return rows;
}
function dxnSyncNumber(v){
  const raw=String(v??'').trim();
  if(!raw) return {value:null,masked:false};
  const latin=dxnSyncDigits(raw);
  if(latin==='***'||latin==='--'||latin==='—'||latin==='-') return {value:null,masked:true};
  let s=latin.replace(/\s/g,'');
  if(s.includes(',')&&s.includes('.')){
    if(s.lastIndexOf(',')>s.lastIndexOf('.')) s=s.replace(/\./g,'').replace(',','.');
    else s=s.replace(/,/g,'');
  }else if(s.includes(',')&&s.split(',').length===2&&s.split(',')[1].length<=2){
    s=s.replace(',','.');
  }else{
    s=s.replace(/,/g,'');
  }
  s=s.replace(/[^0-9.+-]/g,'');
  const n=Number(s);
  return Number.isFinite(n)?{value:n,masked:false}:{value:null,masked:false};
}
function dxnSyncDate(v){
  const raw=dxnSyncDigits(v);
  if(!raw) return null;
  if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(raw)){
    const p=raw.split('-').map(Number); return String(p[0]).padStart(4,'0')+'-'+String(p[1]).padStart(2,'0')+'-'+String(p[2]).padStart(2,'0');
  }
  const m=raw.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
  if(m){
    const a=Number(m[1]), b=Number(m[2]), y=Number(m[3]);
    // تقرير DXN الظاهر يستخدم تنسيق M/D/YYYY (مثل 4/14/2020).
    // ندعم أيضًا D/M/YYYY عندما يكون اليوم أكبر من 12.
    let month=a, day=b;
    if(a>12 && b<=12){ month=b; day=a; }
    if(month>=1 && month<=12 && day>=1 && day<=31){
      const d=new Date(Date.UTC(y,month-1,day));
      if(d.getUTCFullYear()===y && d.getUTCMonth()===month-1 && d.getUTCDate()===day){
        return y+'-'+String(month).padStart(2,'0')+'-'+String(day).padStart(2,'0');
      }
    }
    return null;
  }
  if(/^\d{5}$/.test(raw)){
    const serial=Number(raw), base=new Date(Date.UTC(1899,11,30));
    const d=new Date(base.getTime()+serial*86400000);
    return d.toISOString().slice(0,10);
  }
  return null;
}
function dxnSyncInferField(row,memberIdx,idx,key){
  if(idx[key]>=0) return String(row[idx[key]]??'').trim();
  if(key==='member_name') return String(row[memberIdx+1]??'').trim();
  if(key==='generation') return String(row[memberIdx-1]??'').trim();
  if(key==='sponsor_member_no'){
    for(let i=row.length-1;i>=0;i--){
      const v=dxnSyncDigits(row[i]).replace(/\s/g,'');
      if(/^\d{9}$/.test(v) && v!==dxnSyncDigits(row[memberIdx]).replace(/\s/g,'')) return v;
    }
  }
  if(key==='join_date'){
    for(let i=0;i<row.length;i++) if(dxnSyncDate(row[i])) return String(row[i]??'').trim();
  }
  if(key==='rank'){
    const known=/^(SR|MEM|SA|QSA|QSR|STAR|RUBY|SAPPHIRE|DIAMOND)$/i;
    for(let i=memberIdx+1;i<row.length;i++){
      const v=String(row[i]??'').trim();
      if(known.test(v)) return v;
    }
  }
  return '';
}
function dxnSyncBuildRows(){
  const text=document.getElementById('dxnSyncInput')?.value||'';
  const grid=dxnSyncParseGrid(text);
  if(!grid.length) return {rows:[],invalid:[{row:0,message:'لم يتم العثور على بيانات.'}],duplicates:0};
  const headers=grid[0].map(x=>String(x??'').trim());
  dxnSyncHeaders=headers;
  const idx={};
  Object.keys(DXN_SYNC_ALIASES).forEach(k=>idx[k]=dxnSyncHeaderIndex(headers,DXN_SYNC_ALIASES[k]));

  const firstRowMemberIdx=(()=>{
    const row=grid[0]||[];
    for(let i=0;i<row.length;i++){
      const v=dxnSyncDigits(row[i]).replace(/\s/g,'');
      if(/^\d{9}$/.test(v)) return i;
    }
    return -1;
  })();
  const headerless=idx.member_no<0 && firstRowMemberIdx>=0;
  let startRow=headerless?0:1;

  // تقرير DXN قد يحتوي على أكثر من صف عناوين/عناوين مجمعة.
  // نبدأ دائمًا من أول صف يحتوي فعليًا على رقم عضوية من 9 أرقام،
  // حتى لا تُحتسب أسطر العناوين العربية كصفوف غير صالحة.
  const firstDataRow=grid.findIndex(row=>(row||[]).some(cell=>{
    const v=dxnSyncDigits(cell).replace(/\s/g,'');
    return /^\d{9}$/.test(v);
  }));
  if(firstDataRow>=0) startRow=firstDataRow;

  if(idx.member_no<0 && !headerless){
    return {rows:[],invalid:[{row:1,message:'لم يتم العثور على رقم العضوية. يمكن لصق تقرير DXN بالعناوين أو بدون عناوين.'}],duplicates:0};
  }

  const invalid=[]; const map=new Map(); let duplicates=0;
  for(let r=startRow;r<grid.length;r++){
    const row=grid[r]||[];
    if(row.every(x=>String(x??'').trim()==='')) continue;

    const memberIdx=idx.member_no>=0?idx.member_no:(()=>{
      for(let i=0;i<row.length;i++){
        const v=dxnSyncDigits(row[i]).replace(/\s/g,'');
        if(/^\d{9}$/.test(v)) return i;
      }
      return -1;
    })();

    const no=memberIdx>=0?dxnSyncDigits(row[memberIdx]??'').replace(/\s/g,''):'';
    if(!/^\d{9}$/.test(no)){
      invalid.push({row:r+1,member_no:no,message:'رقم العضوية غير صالح؛ يجب أن يكون 9 أرقام.'});
      continue;
    }

    const get=k=>String(dxnSyncInferField(row,memberIdx,idx,k)??'').trim();
    const numAt=(key,fallbackOffset)=>{
      const v=dxnSyncNumber(get(key));
      if(v.value!==null||v.masked||idx[key]>=0||fallbackOffset==null) return v;
      return dxnSyncNumber(row[memberIdx+fallbackOffset]);
    };

    const pv=numAt('personal_pv',2);
    const pg=numAt('personal_group_pv',3);
    const tg=numAt('total_group_pv',4);
    const ag=numAt('accumulated_group_pv',5);
    const ap=numAt('accumulated_promotion_pv',6);
    const dg=numAt('diamond_group_pv',7);

    const item={
      member_no:no,
      member_name:get('member_name')||null,
      sponsor_member_no:dxnSyncDigits(get('sponsor_member_no')).replace(/\s/g,'')||null,
      sponsor_name:get('sponsor_name')||null,
      generation:(()=>{const n=dxnSyncNumber(get('generation')).value;return n==null?null:Math.trunc(n)})(),
      rank:get('rank')||null,
      dxn_status:get('dxn_status')||null,
      downline_status:get('downline_status')||null,
      join_date:dxnSyncDate(get('join_date')),
      personal_pv:pv.value,
      personal_group_pv:pg.value,
      total_group_pv:tg.value,
      accumulated_group_pv:ag.value,
      accumulated_promotion_pv:ap.value,
      diamond_group_pv:dg.value,
      accumulated_group_pv_masked:ag.masked,
      accumulated_promotion_pv_masked:ap.masked,
      diamond_group_pv_masked:dg.masked
    };
    if(map.has(no)) duplicates++;
    map.set(no,item);
  }
  return {rows:Array.from(map.values()),invalid,duplicates,headers,headerless};
}

/* V78 — Global Quality Pass helpers. Additive only; existing app logic is preserved. */
function applyGlobalAccessibility(){
  const app=document.getElementById('app');
  if(app){app.setAttribute('role','main');app.setAttribute('aria-label','محتوى الموقع');}
  const toastEl=document.getElementById('toast');
  if(toastEl){toastEl.setAttribute('role','alert');toastEl.setAttribute('aria-live','assertive');toastEl.setAttribute('aria-atomic','true');}
  document.querySelectorAll('.evidence-modal,.ai-guide-box').forEach(el=>{
    el.setAttribute('role','dialog');
    el.setAttribute('aria-modal','true');
    if(!el.hasAttribute('tabindex'))el.setAttribute('tabindex','-1');
    if(!el.getAttribute('aria-label')&&!el.getAttribute('aria-labelledby')){
      const heading=el.querySelector('h1,h2,h3,.title,b');
      if(heading){if(!heading.id)heading.id='a11y-dialog-title-'+Math.random().toString(36).slice(2,8);el.setAttribute('aria-labelledby',heading.id);}
    }
  });
  // Associate ordinary labels with the following form control and expose required fields.
  document.querySelectorAll('label').forEach(label=>{
    if(label.querySelector('input,textarea,select'))return;
    let control=label.nextElementSibling;
    while(control && !/^(INPUT|TEXTAREA|SELECT)$/.test(control.tagName))control=control.nextElementSibling;
    if(control){
      if(!control.id)control.id='a11y-field-'+Math.random().toString(36).slice(2,9);
      if(!label.htmlFor)label.htmlFor=control.id;
      if(label.textContent.includes('*'))control.setAttribute('aria-required','true');
    }
  });
  document.querySelectorAll('input,textarea,select').forEach(control=>{
    if(!control.getAttribute('aria-label')&&!control.getAttribute('aria-labelledby')){
      const lab=control.id?document.querySelector('label[for="'+CSS.escape(control.id)+'"]'):null;
      if(lab && !lab.htmlFor)lab.htmlFor=control.id;
    }
  });
  document.querySelectorAll('iframe').forEach(f=>{
    if(!f.hasAttribute('title'))f.setAttribute('title','محتوى فيديو');
    if(!f.hasAttribute('loading'))f.setAttribute('loading','lazy');
    if(!f.hasAttribute('referrerpolicy'))f.setAttribute('referrerpolicy','strict-origin-when-cross-origin');
  });
}

let a11yLastFocused=null;
function a11yDialogs(){return [...document.querySelectorAll('.evidence-modal,.ai-guide-box,[role="dialog"]')].filter(el=>{const cs=getComputedStyle(el);return cs.display!=='none'&&cs.visibility!=='hidden'&&el.offsetParent!==null;});}
document.addEventListener('focusin',e=>{if(a11yDialogs().length)a11yLastFocused=e.target;});
document.addEventListener('keydown',e=>{
  const dialogs=a11yDialogs();
  if(!dialogs.length)return;
  const dialog=dialogs[dialogs.length-1];
  if(e.key==='Escape'){
    if(dialog.classList.contains('ai-guide-box')&&typeof closeAIGuide==='function')closeAIGuide();
    else if(dialog.classList.contains('evidence-modal')&&typeof closeEvidence==='function')closeEvidence();
    return;
  }
  if(e.key!=='Tab')return;
  const focusable=[...dialog.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(x=>x.offsetParent!==null);
  if(!focusable.length){e.preventDefault();dialog.focus();return;}
  const first=focusable[0],last=focusable[focusable.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
});
let a11yTimer=0;
const a11yObserver=new MutationObserver(()=>{
  clearTimeout(a11yTimer);
  a11yTimer=setTimeout(()=>{
    applyGlobalAccessibility();
    const dialogs=a11yDialogs();
    if(dialogs.length){
      const d=dialogs[dialogs.length-1];
      if(document.activeElement===document.body){
        const first=d.querySelector('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])');
        if(first)first.focus();else d.focus();
      }
    }
  },40);
});

  // Existing packs already contain most translations for all supported languages.
  // For missing phrases, use English master then translate that master word-by-word with the language fallback.
  function escapeReg(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
  function uiNode(n){
    if(n.nodeType!==3||!/[\u0600-\u06ff]/.test(n.nodeValue||'')) return false;
    const e=n.parentElement; if(!e) return false;
    if(['SCRIPT','STYLE','NOSCRIPT'].includes(e.tagName)) return false;
    if(e.closest('#site-language-bar,[data-i18n-ignore],[data-user-content],.answer,.user-content,.member-name,.member-no')) return false;
    return true;
  }
  const orig=new WeakMap();
  function translate(text,lang){
    if(lang==='ar') return text;
    const p=Object.assign({},packs[lang]||{});
    Object.assign(p,extra[lang]||{});
    let out=text;
    // Longest known phrase first.
    const keys=Object.keys(p).filter(k=>k&&p[k]&&p[k]!==k&&/[\u0600-\u06ff]/.test(k)).sort((a,b)=>b.length-a.length);
    for(const k of keys) out=out.split(k).join(p[k]);
    // English master -> target language word fallback, guaranteeing no Arabic UI words remain.
    const enWords=words.en;
    const target=generic[lang]||{};
    if(lang!=='en'){
      const enP=extra.en;
      // Map any remaining exact Arabic phrase to English first.
      for(const k of Object.keys(enP).sort((a,b)=>b.length-a.length)) if(/[\u0600-\u06ff]/.test(k)) out=out.split(k).join(enP[k]);
      for(const [ar,en] of Object.entries(enWords)){
        if(/[\u0600-\u06ff]/.test(out)) out=out.replace(new RegExp('(?<![\u0600-\u06ff])'+escapeReg(ar)+'(?![\u0600-\u06ff])','g'), target[en]||en);
      }
    }else{
      // English: direct word fallback.
      for(const [ar,en] of Object.entries(enWords)) out=out.replace(new RegExp('(?<![\u0600-\u06ff])'+escapeReg(ar)+'(?![\u0600-\u06ff])','g'),en);
    }
    return out;
  }
  function apply(){
    const lang=I.getLanguage(); if(lang==='ar') return;
    const root=document.body;
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>uiNode(n)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT});
    while(walker.nextNode()){
      const n=walker.currentNode; if(!orig.has(n)) orig.set(n,n.nodeValue);
      n.nodeValue=translate(orig.get(n),lang);
    }
    document.querySelectorAll('input[placeholder],textarea[placeholder],input[aria-label],textarea[aria-label],[title]').forEach(el=>{
      if(el.closest('#site-language-bar,[data-i18n-ignore],[data-user-content],.answer,.user-content')) return;
      for(const attr of ['placeholder','aria-label','title']) if(el.hasAttribute(attr)){
        const key='__dxn_orig_'+attr; if(!el.dataset[key]) el.dataset[key]=el.getAttribute(attr)||'';
        el.setAttribute(attr,translate(el.dataset[key],lang));
      }
    });
  }
  const old=I.setLanguage;
  I.setLanguage=function(l){old(l);setTimeout(apply,0)};

(function(){

    f.dir=isRTL?'rtl':'ltr';

    f.innerHTML='<div>© '+YEAR+' <strong>'+ (brand[l]||brand.en) +'</strong></div><div>'+ (labels[l]||labels.en) +'</div>';
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',inject); else inject();
  const app=document.getElementById(APP_ID);
  if(app){
    new MutationObserver(function(){ if(!app.querySelector(':scope > .app-copyright-footer')) inject(); }).observe(app,{childList:true});
  }
  window.addEventListener('dxn-language-changed',inject);

(function(){
  if(window.__DXN_SAME_ORIGIN_RPC_PROXY_V8632__) return;
  window.__DXN_SAME_ORIGIN_RPC_PROXY_V8632__=true;
  async function proxyRpc(name,args){
    const r=await fetch('/api/rpc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fn:name,args:args||{}}),cache:'no-store'});
    const tx=await r.text(); let d=null; try{d=tx?JSON.parse(tx):null}catch(e){}
    if(!r.ok){const e=new Error((d&&(d.message||d.error))||tx||('HTTP '+r.status));e.status=r.status;e.code=d&&d.code;e.details=d&&d.details;e.hint=d&&d.hint;throw e}
    return d;
  }
  function patchClient(){
    try{
      if(!window.supabase||typeof window.supabase.createClient!=='function'||window.supabase.createClient.__dxnV8632) return false;
      const original=window.supabase.createClient;
      function wrapped(){
        const client=original.apply(this,arguments);
        if(client&&typeof client.rpc==='function'&&!client.rpc.__dxnV8632){client.rpc=proxyRpc;client.rpc.__dxnV8632=true}
        return client;
      }
      wrapped.__dxnV8632=true; window.supabase.createClient=wrapped; return true;
    }catch(e){return false}
  }

<script>


/* Team Genealogy Foundation V4 — member number lookup */
(function(){
  if(window.__DXN_TEAM_MEMBER_NUMBER_V4__) return;
  window.__DXN_TEAM_MEMBER_NUMBER_V4__=true;

  const RPC='/api/rpc';
  const sessionToken=()=>String(localStorage.getItem('dxn_session')||'').trim();

  async function rpc(fn,args){
    const r=await fetch(RPC,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({fn,args:args||{}}),
      cache:'no-store'
    });
    const tx=await r.text();
    let d=null;
    try{d=tx?JSON.parse(tx):null}catch(_){d=null}
    if(!r.ok) throw new Error((d&&(d.message||d.error||d.hint))||tx||('HTTP '+r.status));
    return d;
  }

  function escapeHtml(v){
    return String(v??'').replace(/[&<>"']/g,function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];

  function ensurePanel(){

          '<div class="team-member-input-row">'+
            '<input id="teamMemberNumber" inputmode="numeric" autocomplete="off" placeholder="مثال: 820469486">'+
            '<button type="button" class="team-member-search" id="teamMemberSearch">عرض الفريق</button>'+
          '</div>'+
          '<div class="team-member-hint">يمكنك إدخال رقم عضويتك أو رقم عضو تابع لك فقط.</div>'+
        '</div>'+
        '<div id="teamMemberStatus" class="team-member-status hidden"></div>'+
        '<div id="teamMemberSummary" class="team-member-summary"></div>'+
        '<div id="teamMemberList" class="team-member-list"></div>'+
      '</div>';
    document.body.appendChild(panel);

    const close=()=>panel.classList.remove('show');
    panel.addEventListener('click',e=>{if(e.target===panel)close()});
    panel.querySelector('#teamMemberClose').onclick=close;
    panel.querySelector('#teamMemberSearch').onclick=()=>loadTeam(panel);

    let zoom=1;
    const applyZoom=()=>{
      zoom=Math.max(.75,Math.min(1.5,Math.round(zoom*100)/100));
      panel.style.setProperty('--team-zoom',String(zoom));
      panel.querySelector('#teamMemberZoomLabel').textContent=Math.round(zoom*100)+'%';
    };

    panel.querySelector('#teamMemberZoomOut').onclick=()=>{zoom-=.1;applyZoom()};

    const fullscreenBtn=panel.querySelector('#teamMemberFullscreen');

      fullscreenBtn.title=active?'الخروج من ملء الشاشة':'ملء الشاشة';

        if(panel.classList.contains('team-member-fullscreen') && panel.requestFullscreen){
