  function renderMembers(payload){
    const list=Array.isArray(payload&&payload.members)?payload.members:[];
    if(!list.length) return '<div class="team-member-empty">🌱 لا يوجد أعضاء تابعون لهذا العضو حاليًا.</div>';

    const groups={};
    list.forEach(m=>{
      const depth=Number(m.depth_from_target||1);
      const key=Number.isFinite(depth)&&depth>0?String(depth):'غير محدد';
      if(!groups[key]) groups[key]=[];
      groups[key].push(m);
    });

    const keys=Object.keys(groups).sort((a,b)=>{
      if(a==='غير محدد') return 1;
      if(b==='غير محدد') return -1;
      return Number(a)-Number(b);
    });

    return '<div class="team-generations-board">'+keys.map(key=>{
      const members=groups[key].slice().sort((a,b)=>{
        const ap=Number(a.cumulative_points ?? a.total_group_pv ?? a.personal_group_pv ?? a.cumulative_pv ?? a.cumulative ?? a.accumulated_points ?? 0);
        const bp=Number(b.cumulative_points ?? b.total_group_pv ?? b.personal_group_pv ?? b.cumulative_pv ?? b.cumulative ?? b.accumulated_points ?? 0);
        if(bp!==ap) return bp-ap;
        const at=Number(a.personal_pv ?? a.pv ?? a.pv_points ?? a.personal_points ?? 0);
        const bt=Number(b.personal_pv ?? b.pv ?? b.pv_points ?? b.personal_points ?? 0);
        if(bt!==at) return bt-at;
        return String(a.member_name||'').localeCompare(String(b.member_name||''));
      });
      const title=key==='غير محدد'?'غير محدد':'الجيل '+escapeHtml(key);
      return '<section class="team-generation-column">'+
        '<div class="team-generation-head">'+
          '<div class="team-generation-title">🌱 '+title+'</div>'+
          '<div class="team-generation-count">'+members.length+' عضو</div>'+
        '</div>'+
        '<div class="team-generation-list">'+members.map((m,index)=>{
          const name=String(m.member_name||'عضو');
          const no=String(m.member_no||'');
          const rank=String(m.rank||'MEM');
          const pvValue=m.personal_pv ?? m.pv ?? m.pv_points ?? m.personal_points;
          const cumulativeValue=m.cumulative_points ?? m.total_group_pv ?? m.personal_group_pv ?? m.cumulative_pv ?? m.cumulative ?? m.accumulated_points;
          const pv=pvValue==null?'—':String(pvValue);
          const cumulative=cumulativeValue==null?'—':String(cumulativeValue);
          const status=String(m.dxn_status||m.downline_status||'');
          return '<div class="team-member-row">'+
            '<div class="team-member-index">'+(index+1)+'</div>'+
            '<div class="team-member-main">'+
              '<div class="team-member-name"><b>'+escapeHtml(name)+'</b><span>🪪 '+escapeHtml(no)+'</span></div>'+
              '<div class="team-member-meta">'+
                '<span>⭐ '+escapeHtml(rank)+'</span>'+
                '<span class="team-member-stat team-member-pv">PV: <b>'+escapeHtml(pv)+'</b></span>'+
                '<span class="team-member-stat team-member-cumulative">تراكمي: <b>'+escapeHtml(cumulative)+'</b></span>'+
                (status?'<span>'+escapeHtml(status)+'</span>':'')+
              '</div>'+
            '</div>'+
          '</div>';
        }).join('')+'</div>'+
      '</section>';
    }).join('')+'</div>';
  }

  async function loadTeam(panel){
    const input=panel.querySelector('#teamMemberNumber');
    const status=panel.querySelector('#teamMemberStatus');
    const summaryBox=panel.querySelector('#teamMemberSummary');
    const listBox=panel.querySelector('#teamMemberList');
    const t=sessionToken();
    const rootNo=String(input.value||'').trim();

    if(!t){
      status.className='team-member-status error';
      status.textContent='جلسة الدخول غير موجودة. أعد تسجيل الدخول.';
      return;
    }
    if(!rootNo){
      status.className='team-member-status error';
      status.textContent='أدخل رقم العضوية أولًا.';
      input.focus();
      return;
    }

    status.className='team-member-status';
    status.textContent='جارٍ البحث عن العضو '+rootNo+' وتحميل فريقه...';
    summaryBox.innerHTML='';
    listBox.innerHTML='';

    try{
      const summary=await rpc('get_dxn_team_intelligence',{p_token:t,p_mode:'summary',p_member_no:rootNo,p_limit:5000});

      // Use the recursive downline response as the source of truth.
      // It already includes depth_from_target plus the member PV/group-PV fields.
      const downline=await rpc('get_dxn_team_intelligence',{
        p_token:t,
        p_mode:'downline',
        p_member_no:rootNo,
        p_limit:5000
      });
      let allMembers=Array.isArray(downline&&downline.members)?downline.members:[];
      
      // Backward-compatible fallback for an older RPC that still returns only
      // a limited downline payload.
      if(Number(downline&&downline.count||0)>allMembers.length){
        const generationCalls=Array.from({length:20},(_,i)=>
          rpc('get_dxn_team_intelligence',{
            p_token:t,
            p_mode:'generation',
            p_member_no:rootNo,
            p_generation:i+1,
            p_limit:5000
          }).catch(()=>({mode:'generation',generation:i+1,members:[]}))
        );
        const generations=await Promise.all(generationCalls);
        allMembers=[];
        generations.forEach((g,i)=>{
          const members=Array.isArray(g&&g.members)?g.members:[];
          members.forEach(m=>{
            if(m && (m.member_no||m.member_name)){
              m.depth_from_target=i+1;
              allMembers.push(m);
            }
          });
        });
      }

      summaryBox.innerHTML=renderSummary(summary,rootNo);
      listBox.innerHTML=renderMembers({members:allMembers});
      status.className='team-member-status ok';
      status.textContent='تم تحميل فريق العضو '+rootNo+' بنجاح.';
    }catch(err){
      status.className='team-member-status error';
      status.textContent='تعذر تحميل الفريق: '+String(err&&err.message||err);
    }
  }
