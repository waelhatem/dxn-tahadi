name: Fix desktop homepage buttons
on:
  push:
    paths:
      - '.github/workflows/fix-desktop-buttons.yml'
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip desktop fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;padding:0;margin:0;outline:none;z-index:4}', '.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;padding:0;margin:0;outline:none;z-index:10;pointer-events:auto;touch-action:manipulation}')
          s=s.replace('#desktopPreviousUser{left:30%;top:74.4%;width:19.5%;height:13%}', '#desktopPreviousUser{left:30.3%;top:75.8%;width:19.2%;height:11%}')
          s=s.replace('#desktopNewVisitor{left:51%;top:74.4%;width:19.5%;height:13%}', '#desktopNewVisitor{left:50.3%;top:75.8%;width:19.2%;height:11%}')
          s=s.replace('<button id="desktopPreviousUser" class="hotspot" aria-label="مستخدم سابق"></button>', '<button id="desktopPreviousUser" class="hotspot" aria-label="مستخدم سابق" type="button"></button>')
          s=s.replace('<button id="desktopNewVisitor" class="hotspot" aria-label="زائر جديد"></button>', '<button id="desktopNewVisitor" class="hotspot" aria-label="زائر جديد" type="button"></button>')
          if "function goNew(mode)" not in s:
              s=s.replace("function goNew(){location.href='/02-pretest-intro.html'}", "function goNew(mode){location.href='/02-pretest-intro.html?device='+mode}")
              s=s.replace("document.getElementById('mobileNewVisitor').onclick=goNew;", "document.getElementById('mobileNewVisitor').onclick=()=>goNew('mobile');")
              s=s.replace("document.getElementById('desktopNewVisitor').onclick=goNew;", "document.getElementById('desktopNewVisitor').onclick=()=>goNew('desktop');")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-desktop-buttons.yml
          git commit -m 'Fix desktop homepage button hit areas [skip desktop fix]'
          git push