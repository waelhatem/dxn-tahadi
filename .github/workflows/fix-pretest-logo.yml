name: Fix pretest logo reference
on:
  push:
permissions:
  contents: write
jobs:
  fix-logo:
    if: github.event.head_commit.message != 'Fix pretest logo reference'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace embedded logo with transparent asset
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('02-pretest-intro.html')
          s = p.read_text(encoding='utf-8')
          s2, n = re.subn(r'(<img\s+class="logo"\s+src=")[^"]+("[^>]*>)', r'\1logo.webp\2', s, count=1)
          if n != 1:
              raise SystemExit(f'Expected exactly one logo image, found {n}')
          p.write_text(s2, encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 02-pretest-intro.html
          git diff --cached --quiet || (git commit -m 'Fix pretest logo reference' && git push)
