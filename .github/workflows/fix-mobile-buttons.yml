name: Temporary full project archive
on:
  push:
    paths:
      - '.github/workflows/fix-mobile-buttons.yml'
permissions:
  contents: read
jobs:
  archive:
    if: ${{ !contains(github.event.head_commit.message, '[skip full project]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create full project ZIP
        run: zip -r dxn-tahadi-full-project.zip . -x '.git/*'
      - name: Upload full project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: dxn-tahadi-full-project
          path: dxn-tahadi-full-project.zip
          retention-days: 7
