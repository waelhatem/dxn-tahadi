name: Apply login guard
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[login-guard]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V86.4 login runtime guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Remove all generated login guards so only this version remains.
          s=re.sub(r'<!-- DXN LOGIN GUARD V[0-9.]+ -->\s*<script>\(function\(\).*?</script>\s*', '', s, flags=re.S)

          # Never register the service worker from the application runtime.
          s=re.sub(r'navigator\.serviceWorker\.register\s*\([^;]*\)\s*;?', '', s, flags=re.S)

          # Run application bootstrap directly; do not depend on service-worker support.
          s=s.replace("if('serviceWorker' in navigator)boot();", 'boot();')
          s=s.replace("if('serviceWorker' in navigator) boot();", 'boot();')

          # Force a fresh V86.4 config.js request.
          s=re.sub(r'src="config\.js(?:\?v=[0-9.]+)?"', 'src="config.js?v=86.4"', s)

          # Stable login button id.
          if 'id="loginButton"' not in s:
              s=s.replace('<button class="primary" style="width:100%" onclick="login()">🔐 دخول</button>', '<button id="loginButton" class="primary" type="button" style="width:100%" onclick="login()">🔐 دخول</button>', 1)

          # Visible deployment marker.
          marker='<div id="dxnBuildMarker" class="small muted" style="text-align:center;margin-top:8px">مجتمع الصحة والثراء • V86.4</div>'
          if 'id="dxnBuildMarker"' in s:
              s=re.sub(r'<div id="dxnBuildMarker"[^>]*>.*?</div>', marker, s, count=1, flags=re.S)
          else:
              needle='<button id="loginButton" class="primary" type="button" style="width:100%">🔐 دخول</button>'
              if needle not in s:
                  needle='<button id="loginButton" class="primary" type="button" style="width:100%" onclick="login()">🔐 دخول</button>'
              if needle in s:
                  s=s.replace(needle, needle+marker, 1)

          guard='''<!-- DXN LOGIN GUARD V86.4 -->
          <script>(function(){
          if(window.__DXN_LOGIN_GUARD_V864__)return;
          window.__DXN_LOGIN_GUARD_V864__=true;
          function show(msg){
            try{var t=document.getElementById('toast');if(t){t.textContent=msg;t.classList.remove('hidden');setTimeout(function(){t.classList.add('hidden')},6000);return}}catch(_){ }
            try{if(window.alert)window.alert(msg)}catch(_){ }
          }
          document.addEventListener('click',function(e){
            try{
              var b=e.target&&e.target.closest?e.target.closest('#loginButton'):null;
              if(!b)return;
              var n=document.getElementById('loginNo'),p=document.getElementById('pin');
              if(!n||!p){e.preventDefault();e.stopImmediatePropagation();show('تعذر تحميل نموذج الدخول.');return}
              var no=String(n.value||'').trim(),pin=String(p.value||'').trim();
              if(!no||!pin){e.preventDefault();e.stopImmediatePropagation();show('أدخل بيانات الدخول أولاً.');return}
              if(typeof window.login!=='function'){e.preventDefault();e.stopImmediatePropagation();show('تعذر تحميل وظيفة الدخول.');return}
            }catch(_){ }
          },true);
          })();</script>
          '''
          pos=s.find('</head>')
          if pos<0: raise SystemExit('no </head>')
          s=s[:pos]+guard+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit V86.4 index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'apply V86.4 login runtime [login-guard] V86.4'
          git push
