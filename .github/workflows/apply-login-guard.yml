name: Apply login guard
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[login-guard]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V86.9 notification scope fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<!-- DXN LOGIN GUARD V[0-9.]+ -->\s*<script>\(function\).*?</script>\s*','',s,flags=re.S)
          s=re.sub(r'<div[^>]*>\s*مجتمع الصحة والثراء\s*•\s*V86\.[0-9]+\s*</div>','',s,flags=re.S)
          s=re.sub(r'navigator\.serviceWorker\.register\s*\([^;]*\)\s*;?','',s,flags=re.S)
          s=s.replace("if('serviceWorker' in navigator)boot();",'boot();')
          s=s.replace("if('serviceWorker' in navigator) boot();",'boot();')
          s=re.sub(r'src="config\.js(?:\?v=[0-9.]+)?"','src="config.js?v=86.9"',s)
          marker='<div id="dxnBuildMarker" class="small muted" style="text-align:center;margin-top:8px">مجتمع الصحة والثراء • V86.9</div>'
          s=re.sub(r'<div id="dxnBuildMarker"[^>]*>.*?</div>','',s,count=1,flags=re.S)
          needle=re.search(r'<button id="loginButton"[^>]*>🔐 دخول</button>',s)
          if not needle: raise SystemExit('loginButton not found')
          s=s[:needle.end()]+marker+s[needle.end():]
          s=re.sub(r'<meta name="x-community-version"[^>]*>','<meta name="x-community-version" content="V86.9 Notification Scope Fix + WCAG 2.2 AA + Site Visit Analytics">',s,count=1)
          # V86.9: home() uses notificationSummary(), but notifSummary was scoped only to render().
          # Define it locally at the start of home() so the authenticated home screen cannot crash.
          if 'function home(){const notifSummary=notificationSummary();' not in s:
              s,n=re.subn(r'function home\(\)\{', 'function home(){const notifSummary=notificationSummary();', s, count=1)
              if n!=1: raise SystemExit('home function not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit V86.9 index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix notification summary scope [login-guard] V86.9'
          git push
