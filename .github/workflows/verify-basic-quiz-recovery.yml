name: Verify basic lesson 2 quiz recovery

on:
  pull_request:
    paths:
      - 'basic-training.js'
      - 'training-engine.js'
      - 'tests/training-engine.test.js'
      - 'tests/helpers/**'
      - '.github/workflows/verify-basic-quiz-recovery.yml'

permissions:
  contents: read

jobs:
  basic-quiz-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Verify second quiz recovery and all three training tracks
        run: node --test tests/training-engine.test.js tests/quiz-opens-after-watch.test.js tests/training-autoplay.test.js
