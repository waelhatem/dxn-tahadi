name: fix-device-routing
on:
  push:
    paths:
      - '.github/workflows/fix-device-routing.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix device routing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="function goNew(){location.href='/02-pretest-intro.html'}"
          new="function goNew(mode){location.href='/02-pretest-intro.html?device='+mode}"
          if old not in s:
              raise SystemExit('index: goNew pattern not found')
          s=s.replace(old,new,1)
          old2="document.getElementById('mobileNewVisitor').onclick=goNew;\ndocument.getElementById('desktopNewVisitor').onclick=goNew;"
          new2="document.getElementById('mobileNewVisitor').onclick=()=>goNew('mobile');\ndocument.getElementById('desktopNewVisitor').onclick=()=>goNew('desktop');"
          if old2 not in s:
              raise SystemExit('index: visitor handlers pattern not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')

          p=Path('02-pretest-intro.html')
          s=p.read_text(encoding='utf-8')
          old='mobileMode.addEventListener("click",()=>setDeviceMode("mobile"));desktopMode.addEventListener("click",()=>setDeviceMode("desktop"));setDeviceMode("desktop");'
          new='mobileMode.addEventListener("click",()=>setDeviceMode("mobile"));desktopMode.addEventListener("click",()=>setDeviceMode("desktop"));const requestedMode=new URLSearchParams(location.search).get("device");setDeviceMode(requestedMode==="mobile"?"mobile":"desktop");'
          if old not in s:
              raise SystemExit('intro: initialization pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html 02-pretest-intro.html .github/workflows/fix-device-routing.yml
          git commit -m 'Fix device routing from homepage' || exit 0
          git push
