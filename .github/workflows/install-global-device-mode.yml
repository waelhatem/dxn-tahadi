name: Apply Global Device Mode

on:
  push:
    branches: ["main", "global-device-mode"]

permissions:
  contents: write

jobs:
  patch-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject global device mode script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          script = '<script src="/device-mode.js" defer></script>'
          changed = []

          for path in root.rglob('*.html'):
              if '.git' in path.parts or 'node_modules' in path.parts:
                  continue
              if path.name == 'LICENSES.chromium.html':
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              if '/device-mode.js' in text:
                  continue
              marker = '</body>'
              lower = text.lower()
              if marker not in lower:
                  continue
              idx = lower.rfind(marker)
              text = text[:idx] + script + '\n' + text[idx:]
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))

          print('Patched:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No HTML changes needed."
            exit 0
          fi
          git commit -m "Enable persistent global device mode"
          git push
