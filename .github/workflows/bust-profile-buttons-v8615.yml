name: Temporary V86.15 profile buttons cache bust
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[profile-buttons]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update profile cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('config.js?v=86.14','config.js?v=86.15').replace('config.js?v=86.13','config.js?v=86.15')
          s=s.replace('مجتمع الصحة والثراء • V86.14','مجتمع الصحة والثراء • V86.15').replace('مجتمع الصحة والثراء • V86.13','مجتمع الصحة والثراء • V86.15')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit profile buttons cache bust
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'apply V86.15 profile buttons cache bust [profile-buttons]'
          git push
