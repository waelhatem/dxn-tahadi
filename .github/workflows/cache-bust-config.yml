name: DXN Config Cache Bust V86.31
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cache-bust:
    if: "!contains(github.event.head_commit.message, '[cache-bust]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force current config.js cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          new = 'config.js?v=86.31'
          s2 = re.sub(r'config\.js\?v=[0-9.]+', new, s, count=1)
          if s2 == s:
              raise SystemExit('config.js script reference not found')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit cache-bust
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V86.31: bust config.js cache [cache-bust]'
          git push
