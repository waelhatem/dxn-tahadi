name: DXN Config Cache Bust V86.46.4
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cache-bust:
    if: "!contains(github.event.head_commit.message, '[cache-bust]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force fresh runtime version
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Bust the config.js reference from index.html.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s2 = re.sub(r'config\.js\?v=[0-9.]+', 'config.js?v=86.46.4', s, count=1)
          if s2 == s:
              raise SystemExit('config.js script reference not found')
          p.write_text(s2, encoding='utf-8')

          # Also bust the two question-admin runtime scripts loaded by config.js.
          p = Path('config.js')
          s = p.read_text(encoding='utf-8')
          s2 = re.sub(r'training-question-admin\.js\?v=[0-9.]+', 'training-question-admin.js?v=86.46.4', s)
          s2 = re.sub(r'training-question-admin-center\.js\?v=[0-9.]+', 'training-question-admin-center.js?v=86.46.4', s2)
          if s2 == s:
              raise SystemExit('question-admin script references not found in config.js')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit cache-bust
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html config.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V86.46.4: force fresh question admin runtime [cache-bust]'
          git pull --rebase origin main
          git push origin HEAD:main