name: DXN Config Cache Bust V86.32
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cache-bust:
    if: "!contains(github.event.head_commit.message, '[cache-bust]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime cache and RPC proxy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s2 = re.sub(r'config\.js\?v=[0-9.]+', 'config.js?v=86.32', s, count=1)
          if s2 == s:
              raise SystemExit('config.js script reference not found')
          client = Path('rpc-proxy-client.js').read_text(encoding='utf-8')
          marker = 'DXN_SAME_ORIGIN_RPC_PROXY_V8632'
          if marker not in s2:
              s2 = s2.replace('</body>', '<script>' + chr(10) + client + chr(10) + '</script></body>')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit cache-bust and proxy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V86.32: cache-bust and proxy Supabase RPC [cache-bust]'
          git push
